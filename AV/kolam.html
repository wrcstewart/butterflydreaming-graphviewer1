<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ButterflyDreaming — Kolam viewer</title>
<!--
  Ancillary Viewer (AV) — Kolam. The reference implementation.

  WHAT THIS IS
  A presentation surface. BD holds the state and drives it; this page renders.
  Near-full screen, no controls that change anything, nothing sent back. Move a
  slider in BD and the figure here follows.

  WHY IT IS WORTH COPYING
  Everything here works the same from ANY host. It is served by BD only because
  that is convenient; move the file to your own domain and it behaves
  identically, because BD's Socket.IO server accepts any origin and the token
  travels in the URL rather than in storage. That is the whole point: a third
  party can build an AV without anything of theirs living in BD's repo, and
  without asking permission.

  WHAT IT DELIBERATELY DOES NOT DO
  - It does not send anything back. An AV is a viewer, not an editor.
  - It does not save. There is no path from here into the BD database.
  - It does not reconnect on refusal. The token is single-use; only BD can
    issue another, so retrying would just fail more quietly.

  HOW IT DRAWS
  The module iframe (visual_module.html) is the SAME renderer BD and the frozen
  standalone use. We hand it a %%bd_ script over postMessage exactly as they do,
  so the figure is identical and there is one renderer to maintain, not three.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a0a0f; overflow: hidden; }
  /* The kolam is a SQUARE figure, so the viewer is a square — as large as the
     window allows — centred. Letting the iframe fill a non-square window made
     the module lay itself out for the wider box and draw a small square at the
     bottom, which is what it was doing on iOS. */
  /* Hidden until the first real script arrives. The module renders its own
     DEFAULT the moment it loads, and showing that — then replacing it a moment
     later — is the flicker of a wrong figure the viewer used to open with. */
  #frame.waiting { visibility: hidden; }
  #frame {
    position: fixed;
    width:  min(100vw, 100vh);
    height: min(100vw, 100vh);
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    border: 0; display: block;
  }
  /* Return to BD. Small, out of the way, but always reachable — this window has
     no address bar and no tab strip, so without it there is no way back. */
  /* CANARY host for the viewer. The AV is cached separately from BD and on a
     different origin's rules, so BD's canary says nothing about which viewer
     you are looking at. Same rotation, same meaning: blue -> red -> green per
     change to a cached AV file. 2026-09-24: RED (the viewer loads the module
     the node actually uses). Next rotation = green. */
  #back {
    position: fixed; top: 10px; right: 12px; z-index: 6;
    font: 12px/1 system-ui, sans-serif; color: #b9b9c4;
    background: rgba(0,0,0,.55);
    border: 2px solid #c0392b;              /* CANARY — red (was blue) */
    padding: 6px 10px; border-radius: 3px; cursor: pointer;
  }
  #back:hover { color: #fff; border-color: #6a6a78; }
  /* Status is deliberately visible and deliberately small. A viewer that shows
     nothing when it cannot reach BD is the failure we are avoiding — but it
     must not compete with the work it is displaying. */
  #status {
    position: fixed; left: 10px; bottom: 8px; z-index: 5;
    font: 11px/1.4 system-ui, sans-serif; color: #7a7a86;
    background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 2px;
    pointer-events: none; transition: opacity .6s ease; max-width: 70vw;
  }
  #status.live { opacity: 0; }          /* the bare transient — fades away */
  /* The MONITOR, by contrast, stays. Quiet enough not to compete with the
     drawing, present enough to be read on purpose. It must not use the .live
     fade: a monitor you cannot see is not a monitor, and this one vanished the
     first time a stepper was moved because an ordinary update re-rendered the
     strip as the bare word "live". */
  /* 0.8 while this is being watched. Drop it back once the connection
     question is settled — the strip is meant to be quiet, not invisible, and
     at .5 it was reported as hard to read. */
  #status.health { opacity: .8; }
  #status.problem { color: #d98a8a; opacity: 1; }
</style>
</head>
<body>
  <!-- NO src here, deliberately. The renderer announces itself with BD_READY
       as soon as it loads; if the iframe starts loading while the parser is
       still on its way to the script below, that announcement arrives before
       anything is listening and is lost forever — leaving a viewer that is
       connected, receiving pushes, and permanently blank. BD's own loader
       avoids this the same way ("the iframe has no src at page load").
       The src is set from JS, after the listener is attached. -->
  <iframe id="frame" class="waiting" title="Kolam"></iframe>
  <!-- Label set in JS: it differs by device. See the comment at the handler. -->
  <button id="back" type="button" title="Back to ButterflyDreaming">← controls</button>
  <div id="status">connecting…</div>

  <!-- Socket.IO's client, served by BD itself. Loading it from BD ties startup
       to BD being up — which costs nothing, since the socket needs BD anyway. -->
  <script src="https://graph.virtualfictions.uk/socket.io/socket.io.js"></script>
  <script src="bd_av_client.js?v=6"></script>
  <script>
  (function () {
    const frame  = document.getElementById('frame');
    const status = document.getElementById('status');

    // The renderer loads asynchronously. Anything that arrives before it is
    // ready is held and replayed on BD_READY — the same pattern the standalone
    // uses (pendingScript), and the reason a fast first push is not lost.
    let moduleReady = false;
    let pending     = null;

    window.addEventListener('message', function (e) {
      const d = e && e.data;
      if (d && d.type === 'BD_READY') {
        moduleReady = true;
        // No controls here. BD is the control surface; this is the display.
        // The module hides its own stepper column and resizes the canvas into
        // the reclaimed space, which is also what makes the figure fill the
        // square rather than sitting small in a corner.
        try {
          frame.contentWindow.postMessage({ type: 'bd_ui_config', hideControls: true }, '*');
        } catch (_) {}
        if (pending) { const p = pending; pending = null; post(p); }
      }
    });

    // ── WHICH renderer (2026-09-24) ───────────────────────────────────────
    //
    // This page hard-coded the Kolam renderer and minted every token against
    // 'bd_V_Kolam'. So View or Device on a Fractal or ABC node opened a KOLAM
    // renderer and handed it a music script, which finds no score and draws
    // nothing — "play it on the other device" had never worked for anything
    // but Kolam.
    //
    // The module is named in the launch URL because it has to be known BEFORE
    // the iframe loads, and the first script arrives later. Falling back to
    // Kolam keeps every link issued before today working.
    //
    // Loaded DIRECTLY, not through /bd_M_*/index.html — those are relay
    // wrappers whose whitelists exist to serve BD's Player, and bd_ui_config
    // is not in any of their RELAY_DOWN sets. Kolam's viewer has always
    // bypassed its wrapper for the same reason.
    const AV_RENDERERS = {
      'bd_V_Kolam':   '/bd_V_Kolam/visual_module.html',
      'bd_M_ABC':     '/bd_M_ABC/music_module.html',
      'bd_M_Fractal': '/bd_M_Fractal/music_module.html'
    };
    const AV_MODULE = (function () {
      try {
        const m = new URLSearchParams(location.search).get('m');
        return AV_RENDERERS[m] ? m : 'bd_V_Kolam';
      } catch (_) { return 'bd_V_Kolam'; }
    })();

    // Listener is attached; only now start the renderer loading.
    // Versioned: iOS Safari caches an iframe src hard, and a stale renderer
    // here means layout and behaviour fixes silently never arrive. Bump on any
    // change to a module.
    frame.src = AV_RENDERERS[AV_MODULE] + '?v=15';

    // ── What this viewer is currently showing (2026-09-16) ────────────────
    //
    // The renderer announces its live script on every render (bd_av_state),
    // which until now this page ignored — it only needed BD_READY. Keeping it
    // is what lets the viewer answer BD's av_state_request, and it is the ONLY
    // place the drift that happened while BD was asleep is recorded.
    //
    // nodeId identifies WHICH node the script belongs to. It arrives in the
    // launch URL and is then updated by every push, because this viewer FOLLOWS
    // BD from node to node — an id fixed at launch would go stale the moment it
    // did, and BD would reject the answer as being about the wrong node.
    // Echoed back untouched; the viewer never interprets it.
    let liveScript = null;
    let showingNodeId = new URLSearchParams(location.search).get('n');

    window.addEventListener('message', function (e) {
      const d = e && e.data;
      if (d && d.type === 'bd_av_state' && typeof d.text === 'string') liveScript = d.text;
    });

    // ── An arriving script is applied WHOLE, angle included ───────────────
    //
    // There was a keepOurAngle() here for a few hours on 2026-09-18, which
    // substituted this viewer's own angle into any incoming script while drift
    // was running. It was defending against av_hello answers resetting the
    // angle on every tab switch — and it could not tell a DELIBERATE angle
    // change from a stale one, so it discarded both. Changing the angle in BD
    // did nothing here, which is how it was found.
    //
    // The cause is gone rather than defended against: the shim now re-asks
    // only after the socket has actually dropped, so whole scripts stop
    // arriving on every return to the foreground. What does arrive is meant.
    function post(script) {
      if (!moduleReady) { pending = script; return; }
      try {
        frame.contentWindow.postMessage({ type: 'bd_script_update', script: script }, '*');
      } catch (err) {
        say('renderer unreachable', true);
      }
    }

    function say(text, problem) {
      status.textContent = text;
      status.classList.remove('health');
      status.classList.toggle('problem', !!problem);
      status.classList.toggle('live', !problem && text === 'live');
    }

    // ── The monitor owns the strip once it has something to say ────────────
    //
    // Two things wrote to #status and the last writer won, which is how the
    // monitor disappeared the moment a stepper moved: onUpdate called
    // say('live'), and say() fades anything that is exactly "live". A monitor
    // that survives only until the next ordinary event is not one.
    //
    // So there is now a single place that renders it, and every caller goes
    // through it. Transient messages (connecting, renewing, refused) still use
    // say(); the monitor re-asserts itself afterwards.
    let lastHealth   = null;   // the minute snapshot, for the tooltip
    let lastUpdateAt = null;   // last time the script actually DIFFERED
    let lastScript   = null;   // what it was, so a resend can be recognised
    let resends      = 0;
    // Connectivity is tracked HERE rather than read from lastHealth, for two
    // reasons: the snapshot is up to a minute old, and waiting a minute to
    // show anything would leave the strip blank exactly when a viewer is being
    // watched most closely — the first minute after opening it.
    let connected    = false;

    function showHealth() {
      if (!connected && !lastHealth) return false;
      if (!connected) {
        say('NO CONTACT with ButterflyDreaming — press View there to reconnect', true);
        return true;
      }
      // "last change", not "last heard from". BD deliberately says nothing
      // while drift runs — the viewer animates that itself — so a long silence
      // here is normal and must not read as a fault.
      let age = 'no changes yet';
      if (lastUpdateAt != null) {
        const secs = Math.round((Date.now() - lastUpdateAt) / 1000);
        age = secs < 90 ? 'last change ' + secs + 's ago'
                        : 'last change ' + Math.round(secs / 60) + 'm ago';
      }
      status.textContent = 'live · ' + age;
      status.classList.remove('live', 'problem');
      status.classList.add('health');
      if (lastHealth) {
        try {
          status.title = JSON.stringify(
            Object.assign({}, lastHealth, { resendsIgnored: resends }), null, 1);
        } catch (_) {}
      }
      return true;
    }

    // The age has to keep up on its own, or the strip sits reading "last
    // change 12s ago" for a whole minute — which is worse than no number,
    // because it looks live and is not. Display only; no network, no work.
    setInterval(function () { if (connected) showHealth(); }, 15 * 1000);

    // Kept on window deliberately: a viewer that misbehaves is otherwise a
    // closed box, and the socket is the one thing worth inspecting from a
    // console. It is a read handle — nothing here sends.
    // Back to BD. close() first: this window was opened by script, so it may
    // close itself, and on iOS — where it is a tab, not a window — closing is
    // the only thing that reliably returns you. focus() on the opener is the
    // desktop nicety and the fallback when close is refused.
    // The label depends on whether BD is already visible.
    //
    // On a desktop the viewer is a WINDOW sitting beside BD, so BD's controls
    // are on screen the whole time and this button does not take you to them —
    // it raises the ButterflyDreaming window. "controls" would be describing
    // something you are already looking at.
    //
    // On a phone the viewer is a TAB with BD hidden behind it, and the only way
    // to reach the controls is through this button — so "controls" is exactly
    // what it gives you.
    //
    // The test is whether this viewer LEAVES ROOM for BD, which is the actual
    // question — not screen size, and not a device sniff.
    //
    // A desktop viewer is opened at ~55% of the screen, so there is a wide
    // margin beside it where BD sits. A phone tab fills the screen, so there is
    // none and BD is hidden behind it. Comparing our own outer width against
    // the screen says which of those we are, without guessing at device class.
    // ── A viewer on ANOTHER DEVICE has nowhere to go back to ─────────────
    //
    // Everything above assumes BD is in this browser: the button closes this
    // window and raises BD, and the phone case means "BD is the tab behind
    // this one". Opened from a link or a QR code on a different device, none
    // of that holds. There is no opener, so no raise; window.close() is
    // refused for a window the script did not open; and "back to
    // ButterflyDreaming" names something that is not on this machine. Pressed,
    // it appeared to do nothing or to kill the page.
    //
    // BD says so in the URL rather than leaving it to be guessed: opener is
    // absent after an ordinary reload too, which would misread a same-browser
    // viewer as remote.
    //
    // The button keeps the half that still works. Telling BD where this viewer
    // got to travels over the socket and does not care which device this is —
    // and on a second screen it is the more useful half anyway, since BD
    // cannot see what you have drifted to here.
    const IS_DEVICE = (function () {
      try { return new URLSearchParams(location.search).get('d') === '1'; }
      catch (_) { return false; }
    })();

    const backBtn = document.getElementById('back');

    // Held in a variable, NOT re-derived from the label at click time.
    //
    // The handler below used to read `backBtn.textContent ===
    // 'ButterflyDreaming'`, which made the WORDING load-bearing: renaming the
    // button would silently flip that to false and a desktop viewer would
    // start CLOSING ITSELF instead of raising BD. Wording is presentation and
    // must never be state — found while making exactly that rename.
    let roomForBoth = false;
    try {
      roomForBoth = (window.outerWidth || innerWidth) < screen.availWidth * 0.9;
    } catch (_) { /* assume none; the phone behaviour is the safe default */ }

    if (IS_DEVICE) {
      backBtn.textContent = 'Sync';
      backBtn.title = 'Send what this viewer is showing back to ButterflyDreaming';
    } else if (roomForBoth) {
      // Desktop: BD is beside us, so this does not take you anywhere. It sends
      // this viewer's state and asks BD's window to come forward — and the
      // raise is largely refused by browsers, so the sync is the part that
      // reliably happens. Name it for what it does.
      backBtn.textContent = 'Sync';
      backBtn.title = 'Send this viewer\u2019s state to ButterflyDreaming';
    }
    // Otherwise the default label stands. On a phone the viewer covers BD and
    // this button is the only way back to the controls, so that IS what it
    // gives you.

    backBtn.addEventListener('click', function () {
      // On another device: send, say so, and stay. No raise — there is no
      // window to raise. No close — the browser refuses it for a page it did
      // not open, and succeeding would be worse, leaving a blank tab and no
      // BD to have returned to.
      if (IS_DEVICE) {
        let sent = false;
        try {
          const sock = window.__avSocket;
          if (sock && sock.connected) {
            sock.emit('msg', { type: 'av_return', script: liveScript || undefined });
            sent = true;
          }
        } catch (_) {}
        say(sent ? 'sent to ButterflyDreaming' : 'cannot reach ButterflyDreaming', !sent);
        return;
      }

      // roomForBoth is the variable set above — deliberately not the label.

      // 1. Ask BD to come back to this node.
      //
      // This is the part that actually shows. Raising another window is
      // largely refused by browsers on a page's say-so, and where BD and the
      // viewer sit side by side a successful raise looks identical to nothing
      // happening — which is exactly how this button was reported: "nothing
      // happens when I press it". It may well have been raising all along.
      //
      // NO PAYLOAD. BD decides where to go, from the node it believes this
      // viewer is on. The viewer says that a person asked to go back; it does
      // not say where back is.
      // The live script goes WITH the request. On a phone this window closes
      // a few lines below, so there is nobody left for BD to ask afterwards —
      // and BD has been backgrounded and throttled the whole time you were
      // looking at this, so its own idea of the state is however stale the
      // suspension made it. This is the only moment the drift that happened
      // here can be handed over.
      //
      // No destination: BD decides which node this applies to. The server
      // forwards the script and drops every other field.
      let told = false;
      try {
        const sock = window.__avSocket;
        if (sock && sock.connected) {
          sock.emit('msg', { type: 'av_return', script: liveScript || undefined });
          told = true;
        }
      } catch (_) {}

      // 2. Best-effort raise. Kept because it costs nothing and works in some
      //    browsers; never depended on.
      let raised = false;
      try {
        if (window.opener && !window.opener.closed) { window.opener.focus(); raised = true; }
      } catch (_) {}

      // 3. Close only when the viewer is in the way — the phone case. On a
      //    desktop the two windows sit side by side and closing the one you are
      //    working with, every time you glance at the controls, would be absurd.
      if (!roomForBoth || !raised) { try { window.close(); } catch (_) {} }

      // 4. Say what happened. A button whose whole effect may be invisible
      //    must not also be silent.
      if (roomForBoth) {
        say(told ? 'ButterflyDreaming is on this node'
                 : 'cannot reach ButterflyDreaming', !told);
      }
    });

    window.__avSocket = BD_AV.connect({
      // Same origin as the page when served by BD; a third party would set
      // their own value here, or leave the default.
      bdOrigin: location.origin.startsWith('http://localhost')
                  ? location.origin
                  : BD_AV.DEFAULT_BD_ORIGIN,

      onUpdate: function (payload) {
        // The payload is whatever BD pushed. For Kolam that is a %%bd_ script,
        // the same text the editor and the standalone use.
        const script = (payload && payload.script) || (typeof payload === 'string' ? payload : null);
        if (!script) return;
        if (payload && typeof payload.nodeId === 'string') showingNodeId = payload.nodeId;
        post(script);
        // Real content has arrived — reveal. Until now the module has been
        // showing its own default behind a hidden frame.
        frame.classList.remove('waiting');

        // An arriving update is not necessarily a CHANGE — 2026-09-17.
        //
        // The shim re-sends av_hello on visibilitychange, and BD answers with
        // whatever it currently holds. So a monitor waking from sleep, or a
        // tab being switched to, produces an av_update carrying exactly the
        // script already on screen. Counting those made the strip report
        // "last change 4s ago" when nothing had been touched for an hour,
        // which is how this was noticed: changes "much more recent than any
        // changes I have made, other than the screen going live".
        //
        // The monitor is meant to answer "is BD still talking to me and is it
        // saying anything new". A resend answers the first and not the second,
        // so it is counted separately and does not move the clock.
        if (script !== lastScript) {
          lastScript   = script;
          lastUpdateAt = Date.now();
        } else {
          resends += 1;
        }
        if (!showHealth()) say('live');
      },

      // Solicited only — BD asks, we answer. Null until the renderer has
      // actually drawn something, which is the honest answer at that point.
      onStateRequest: function () {
        return liveScript ? { script: liveScript, nodeId: showingNodeId } : null;
      },

      // Once a minute. A viewer keeps drawing whether or not anyone is
      // talking to it — it animates from its own timer — so being cut off
      // looks exactly like working. Say the quiet part out loud.
      onHealth: function (h) {
        lastHealth = h;
        showHealth();
      },

      // Tells the shim which kind of replacement token to ask BD for — and it
      // matters functionally, not just descriptively: the relay filters a push
      // by the viewer's module type, so a viewer minted as Kolam would have
      // every Fractal push SKIPPED and simply sit there showing nothing.
      moduleId: AV_MODULE,

      onState: function (state, info) {
        // 'live' hands the strip back to the monitor if it has anything to
        // say; the bare word is only for the very first connection.
        if (state === 'live')       { connected = true; showHealth(); }
        else if (state === 'renewing')   { connected = false; say('reconnecting to ButterflyDreaming…'); }
        else if (state === 'connecting') say('connecting…');
        else if (state === 'no-token')   say('opened without a session — open this from ButterflyDreaming', true);
        else if (state === 'refused') {
          connected = false;
          // The single-use token is spent. This is not something the user did:
          // past the 60s recovery window every retry is re-checked against a
          // token that was consumed at first connect, so it can never succeed.
          // Say what to do rather than what went wrong.
          // Only reached once renewal has been tried and failed, or is
          // impossible (no opener — a viewer reopened from history, or a
          // third-party one). Then the honest answer is to launch a new one.
          say(info && info.afterGoodConnection
                ? 'lost contact — press View in ButterflyDreaming for a fresh viewer'
                : 'BD refused the session: ' + ((info && info.reason) || ''), true);
        }
        else if (state === 'lost')       { connected = false;
                                           say('connection lost — ' + ((info && info.reason) || '') +
                                               ' — reconnecting…', true); }
      }
    });
  })();
  </script>
</body>
</html>
