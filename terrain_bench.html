<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fractal terrain bench — a profile from two grammars</title>
<style>
  :root { --ink:#111; --line:#c9c9c4; --panel:#f6f6f2; --accent:#8a7f5c; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 "Helvetica Neue", Arial, sans-serif; color:var(--ink);
         background:#fff; display:flex; flex-direction:column; height:100dvh; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; font-weight:600; }
  header p { margin:3px 0 0; font-size:12px; color:#666; }
  main { flex:1; display:flex; min-height:0; }
  #panel { width:330px; flex:0 0 330px; overflow-y:auto; padding:12px 14px;
           border-right:1px solid var(--line); background:var(--panel); }
  #stage { flex:1; min-width:0; position:relative; background:#fff; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  fieldset { border:1px solid var(--line); border-radius:4px; margin:0 0 12px; padding:9px 10px 11px; }
  legend { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--accent); padding:0 4px; }
  label { display:block; font-size:11px; color:#555; margin:7px 0 2px; }
  textarea, input[type=number], select {
    width:100%; font:12px/1.45 ui-monospace, Menlo, Consolas, monospace;
    padding:4px 6px; border:1px solid var(--line); border-radius:3px; background:#fff; color:var(--ink);
  }
  textarea { resize:vertical; min-height:52px; }
  .row { display:flex; gap:8px; } .row > div { flex:1; }
  button { font:12px inherit; padding:6px 11px; border:1px solid #999; border-radius:3px;
           background:#fff; cursor:pointer; }
  button.go { background:var(--ink); color:#fff; border-color:var(--ink); }
  #out { font:11px/1.6 ui-monospace, Menlo, monospace; white-space:pre; margin-top:9px;
         padding:8px 9px; background:#fff; border:1px solid var(--line); border-radius:3px; }
  .warn { color:#a33; }
</style></head><body>

<header>
  <h1>Fractal terrain bench — a profile from two grammars</h1>
  <p>Every drawn segment takes one decision from each fractal: <b>&plusmn;1&deg; of angle</b>,
     and <b>&plusmn;a quantum of step length</b>. Black line, white canvas, no 3D yet.</p>
</header>

<main>
<div id="panel">

  <fieldset><legend>Angle fractal</legend>
    <label>axiom</label><input id="a-ax" value="F">
    <label>rules — one per line, <code>symbol: replacement</code></label>
    <textarea id="a-rules">F: F+F-F+F-F-F+F</textarea>
    <div class="row">
      <div><label>depth</label><input id="a-depth" type="number" value="3" min="0" max="7"></div>
      <div><label>&deg; per step</label><input id="a-q" type="number" value="1" step="0.25"></div>
      <div><label>limit &plusmn;&deg;</label><input id="a-lim" type="number" value="60"></div>
    </div>
  </fieldset>

  <fieldset><legend>Step-size fractal</legend>
    <label>axiom</label><input id="s-ax" value="F">
    <label>rules</label>
    <textarea id="s-rules">F: F-F++F-F</textarea>
    <div class="row">
      <div><label>depth</label><input id="s-depth" type="number" value="4" min="0" max="7"></div>
      <div><label>m per step</label><input id="s-q" type="number" value="25" step="5"></div>
    </div>
    <div class="row">
      <div><label>min m</label><input id="s-min" type="number" value="50"></div>
      <div><label>max m</label><input id="s-max" type="number" value="500"></div>
      <div><label>start m</label><input id="s-start" type="number" value="275"></div>
    </div>
  </fieldset>

  <fieldset><legend>Smoothing</legend>
    <label>window <span id="sm-val">1</span> segments</label>
    <input id="sm" type="range" min="1" max="81" value="1" step="2" style="width:100%">
    <div style="font-size:11px;color:#666;margin-top:4px">
      A moving average over the <b>angle</b>. 1 = untouched.
    </div>
  </fieldset>

  <fieldset><legend>View</legend>
    <div class="row">
      <div><label>vertical &times;</label><input id="v-ex" type="number" value="1" step="0.5"></div>
      <div><label>max segments</label><input id="v-cap" type="number" value="20000" step="1000"></div>
    </div>
    <label><input type="checkbox" id="v-fit" checked style="width:auto"> fit to canvas</label>
  </fieldset>

  <button class="go" id="draw">Draw</button>
  <button id="png">Save PNG</button>
  <div id="out">—</div>
</div>

<div id="stage"><canvas id="cv"></canvas></div>
</main>

<script src="/lib/lindenmayer-1.5.4.js"></script>
<script>
const $ = id => document.getElementById(id);

// Expand a grammar and reduce it to the only thing this bench reads: a sequence
// of +1 / -1 decisions. Everything else in the string is a carrier -- it shapes
// how the decisions fall without being one, exactly as X and Y do in a Hilbert
// curve. So `F` is not "draw" here; the DECISIONS are the draws.
function decisions(axiom, rulesText, depth) {
  const productions = {};
  for (const line of rulesText.split('\n')) {
    const t = line.trim();
    if (!t || t.startsWith('#')) continue;
    const i = t.indexOf(':');
    if (i > 0) productions[t.slice(0, i).trim()] = t.slice(i + 1).trim();
  }
  const ls = new LSystem({ axiom: axiom.trim() || 'F', productions });
  ls.iterate(depth);
  const s = ls.getString();
  const out = [];
  for (const c of s) { if (c === '+') out.push(1); else if (c === '-') out.push(-1); }
  // BIAS IS THE WHOLE STORY. A rule with unequal + and - compounds its surplus at
  // every depth, so the angle runs to the clamp and stays there: the profile
  // becomes a smooth ramp rather than terrain. The first default here did
  // exactly that (four + against three -) and drew a quarter-circle. Reported
  // rather than prevented -- a deliberate bias is a legitimate thing to want.
  let bias = 0; for (const d of out) bias += d;
  // SYMMETRY OF THE RULE DECIDES SYMMETRY OF THE TERRAIN, at every depth.
  // The author spotted it before the bench could tell him: *"Why has it
  // reflective symmetry about the axis through highest point"*. Because the
  // first balanced default, F+F-F-F+F, has decisions + - - + -- a PALINDROME.
  // Rewriting a palindrome with a palindromic rule stays palindromic however
  // deep it goes, so the walk read backwards is the same walk, and with zero
  // bias the second half retraces the first mirrored. The peak sat at 49.2%
  // along, which is the symptom.
  //
  // An ANTI-palindrome (d[i] = -d[n-1-i]) has its own symmetry rather than
  // none, so both are named. Measured on the RULE, not the expansion: it is a
  // property of the rule and no depth escapes it.
  const r0 = [];
  for (const c of (productions[Object.keys(productions)[0]] || '')) {
    if (c === '+') r0.push(1); else if (c === '-') r0.push(-1);
  }
  const m = r0.length;
  const palin = m > 1 && r0.every((v, i) => v === r0[m - 1 - i]);
  const anti  = m > 1 && r0.every((v, i) => v === -r0[m - 1 - i]);
  const rbias = (axiom.match(/\+/g) || []).length - (axiom.match(/-/g) || []).length;
  let pbias = 0;
  for (const k in productions) {
    pbias += (productions[k].match(/\+/g) || []).length
           - (productions[k].match(/-/g) || []).length;
  }
  return { seq: out, raw: s.length, bias, rbias, pbias, palin, anti };
}

function build() {
  const aQ   = +$('a-q').value, aLim = Math.abs(+$('a-lim').value);
  const sQ   = +$('s-q').value, sMin = +$('s-min').value, sMax = +$('s-max').value;
  const cap  = +$('v-cap').value;

  const A = decisions($('a-ax').value, $('a-rules').value, +$('a-depth').value);
  const S = decisions($('s-ax').value, $('s-rules').value, +$('s-depth').value);
  const n = Math.min(A.seq.length, S.seq.length, cap);

  // The two fractals are consumed IN LOCKSTEP, one decision each per segment.
  // They are deliberately independent grammars: if they were one, step and
  // angle would rise and fall together and the terrain would have a single
  // rhythm rather than two beating against each other.
  // Angles first, as their own sequence, because smoothing operates on them.
  let angle = 0;
  const rawAng = [], steps = [];
  let step = Math.min(Math.max(+$('s-start').value, sMin), sMax);
  let angleClamped = 0, stepClamped = 0;
  for (let i = 0; i < n; i++) {
    const a2 = angle + A.seq[i] * aQ;
    if (a2 > aLim || a2 < -aLim) angleClamped++;
    angle = Math.min(Math.max(a2, -aLim), aLim);
    rawAng.push(angle);
    const s2 = step + S.seq[i] * sQ;
    if (s2 > sMax || s2 < sMin) stepClamped++;
    step = Math.min(Math.max(s2, sMin), sMax);
    steps.push(step);
  }
  const win = +$('sm').value;
  $('sm-val').textContent = win;
  const ang = smoothAngles(rawAng, win);

  const walk = (seq) => {
    let x = 0, y = 0, minY = 0, maxY = 0, climb = 0, fall = 0, maxTurn = 0;
    const pts = [{ x, y }];
    for (let i = 0; i < n; i++) {
      const r = seq[i] * Math.PI / 180;
      const dy = Math.sin(r) * steps[i];
      x += Math.cos(r) * steps[i];   // cos never negative while |angle| <= 90,
      y += dy;                       // so the profile always advances
      if (dy > 0) climb += dy; else fall -= dy;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (i) { const d = Math.abs(seq[i] - seq[i - 1]); if (d > maxTurn) maxTurn = d; }
      pts.push({ x, y });
    }
    return { pts, minY, maxY, climb, fall, maxTurn };
  };
  const W = walk(ang), RAW = win > 1 ? walk(rawAng) : W;
  const { pts, minY, maxY, climb, fall, maxTurn } = W;

  return { pts, n, A, S, angleClamped, stepClamped, climb, fall, minY, maxY,
           maxTurn, win, rawRelief: RAW.maxY - RAW.minY,
           truncated: Math.min(A.seq.length, S.seq.length) > cap };
}

// ── SMOOTH THE ANGLE, NOT THE CORNERS ────────────────────────────────────
// The first version of this cut corners (Chaikin). MEASURED, it did nothing:
// the raw profile's sharpest corner is 1.00 degrees, because the angle only
// ever moves +/-1 per step, so there are no corners to cut. What reads as
// jaggedness is the SLOPE oscillating, seen through a ninetyfold vertical
// stretch -- not angular geometry. Corner cutting was the wrong tool, and at
// full strength it was worse than useless: the two inserted points coincided,
// producing zero-length segments and RAISING the maximum turn to 2.53 degrees.
//
// Roughness lives in the angle sequence, so that is what is averaged. A
// centred moving average of `win` segments, shrinking at the ends rather than
// padding, so the profile is not dragged towards zero at its edges.
//
//   window  1 -> 1.00 deg max slope change,  relief 821 m
//   window 61 -> 0.06 deg,                   relief 779 m
//
// It costs relief, as any smoothing must, and the readout says how much.
function smoothAngles(raw, win) {
  if (win <= 1) return raw;
  const half = Math.floor(win / 2), out = new Array(raw.length);
  for (let i = 0; i < raw.length; i++) {
    let t = 0, c = 0;
    for (let k = -half; k <= half; k++) {
      const j = i + k;
      if (j >= 0 && j < raw.length) { t += raw[j]; c++; }
    }
    out[i] = t / c;
  }
  return out;
}

function draw() {
  const cv = $('cv'), st = $('stage');
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(st.clientWidth * dpr);
  cv.height = Math.round(st.clientHeight * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = st.clientWidth, H = st.clientHeight;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

  const M = build();
  if (M.n === 0) { $('out').textContent = 'no +/- decisions in one of the grammars'; return; }

  const vex = +$('v-ex').value;
  const spanX = M.pts[M.pts.length - 1].x || 1;
  const spanY = Math.max(M.maxY - M.minY, 1) * vex;
  const pad = 26;
  let sx, sy;
  if ($('v-fit').checked) {
    sx = (W - pad * 2) / spanX;
    sy = (H - pad * 2) / spanY;
  } else { sx = sy = Math.min((W - pad * 2) / spanX, (H - pad * 2) / spanY); }

  // baseline
  ctx.strokeStyle = '#e4e4de'; ctx.lineWidth = 1;
  const y0 = H - pad - (0 - M.minY) * vex * sy;
  ctx.beginPath(); ctx.moveTo(pad, y0); ctx.lineTo(W - pad, y0); ctx.stroke();

  ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < M.pts.length; i++) {
    const px = pad + M.pts[i].x * sx;
    const py = H - pad - (M.pts[i].y - M.minY) * vex * sy;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();

  // ── SAY HOW MUCH THE PICTURE IS STRETCHED ────────────────────────────
  // "Fit to canvas" scales x and y independently, which flatters the result
  // enormously: the first balanced run drew a convincing mountain that was
  // actually 32 km wide and 147 m tall — stretched about sixtyfold. A bench
  // whose picture is more dramatic than its numbers teaches the wrong thing.
  const vexEff = sy / sx;
  const km = spanX / 1000;
  const pc = v => (100 * v / M.n).toFixed(1) + '%';
  $('out').innerHTML =
    `segments      ${M.n}${M.truncated ? '  <span class="warn">(capped)</span>' : ''}\n` +
    `decisions     angle ${M.A.seq.length} of ${M.A.raw} symbols\n` +
    `              step  ${M.S.seq.length} of ${M.S.raw} symbols\n` +
    `distance      ${km.toFixed(2)} km\n` +
    `drawn at      ${vexEff < 1.5 ? 'true scale' :
       '<span class="warn">' + vexEff.toFixed(0) + '&times; vertical stretch</span>'}` +
    `   true grade ${(100 * (M.maxY - M.minY) / spanX).toFixed(2)}%\n` +
    `elevation     ${M.minY.toFixed(0)} to ${M.maxY.toFixed(0)} m   ` +
    `range ${(M.maxY - M.minY).toFixed(0)} m\n` +
    `roughness     max slope change ${M.maxTurn.toFixed(2)}&deg; between segments\n` +
    (M.win > 1
      ? `smoothing     window ${M.win}   ` +
        `<span class="warn">relief ${M.rawRelief.toFixed(0)} &rarr; ` +
        `${(M.maxY - M.minY).toFixed(0)} m</span>\n` : '') +
    `ascent/descent ${M.climb.toFixed(0)} / ${M.fall.toFixed(0)} m\n` +
    `angle at limit ${pc(M.angleClamped)}${M.angleClamped / M.n > 0.3
      ? '  <span class="warn">&larr; mostly saturated</span>' : ''}\n` +
    `step at limit  ${pc(M.stepClamped)}\n` +
    `\n` +
    `net bias      angle ${M.A.bias >= 0 ? '+' : ''}${M.A.bias}   step ${M.S.bias >= 0 ? '+' : ''}${M.S.bias}\n` +
    `per rule      angle ${M.A.pbias >= 0 ? '+' : ''}${M.A.pbias}   step ${M.S.pbias >= 0 ? '+' : ''}${M.S.pbias}` +
    (M.A.palin
      ? `\n<span class="warn">angle rule is a PALINDROME — the terrain will mirror\n` +
        `about its peak at every depth.</span>` : '') +
    (M.A.anti
      ? `\n<span class="warn">angle rule is an ANTI-palindrome — symmetric in its\n` +
        `own way; expect the peak at one end.</span>` : '') +
    (M.A.pbias !== 0
      ? `\n<span class="warn">angle rules are unbalanced by ${M.A.pbias > 0 ? '+' : ''}${M.A.pbias} — the\n` +
        `surplus compounds with depth, so the angle will run to\n` +
        `the limit and hold: a ramp, not terrain.</span>` : '');
}

$('draw').addEventListener('click', draw);
for (const el of document.querySelectorAll('input, textarea')) {
  el.addEventListener('change', draw);
}
$('png').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'terrain.png'; a.href = $('cv').toDataURL('image/png'); a.click();
});
addEventListener('resize', draw);
draw();
</script>
</body></html>
