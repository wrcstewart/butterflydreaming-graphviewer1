<!-- ButterflyDreaming Visual Module (3D) — V_Kolam3D/visual_module.html — BD Protocol v0.1 -->
<!--
  bd_V_Kolam3D, 2026-09-27. A kolam in three dimensions, hung off Graphics
  as a Cluster of its own — NOT under Kolam. It is a sibling, not a variant:
  it reads and writes the same %%bd_ script, but it is a different renderer
  with two angles instead of one and a camera to place.

  THE INVARIANT: with %%bd_pitch 0 and %%bd_cam_elevation 90, this module
  draws exactly what V_Kolam draws — the same segments, the same hues. Every
  sign convention in here (the yaw applied as −a, the bulge along −L, the
  camera up taken from the sphere's north tangent) exists to keep that true,
  and each is commented where it is chosen. It is what lets a stored figure
  move between the two modules without changing.

  %%bd_step_pitch (added later the same day) does not touch that: at pitch 0
  the turtle never leaves the plane, so there is no y to scale and the control
  is correctly inert. It is the step length in the NEW dimension, and it is
  what makes pitch a dial instead of a switch.

  Everything above the "3D-only additions" marker in the stylesheet, and the
  parser, the stepper machinery and the drift clock in the script, are
  V_Kolam/visual_module.html's — deliberately identical, so the two present
  the same control surface and BD's positionExtendPanel measurements hold
  for both. Fix the shared parts THERE and copy down.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ButterflyDreaming — Visual Module 3D</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;                  /* A42 §42.9 — module fills its iframe */
    }
    /* %%bd_background transparent — see the render path. Three.js's clear
       alpha is only the first of four stacked backgrounds; this is the second,
       and without it the canvas is see-through onto an opaque body. */
    body.transparent-bg { background: transparent !important; }
    body {
      background: #0a0a0f;
      color: #e8e8e0;
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      gap: 0;                            /* no gap — every pixel goes to the canvas */
      padding: 0;                        /* was 0.6rem — reclaim ~20px each side (A42) */
      box-sizing: border-box;
    }

    /* Status overlays the top-left corner instead of consuming a full row.
       Pointer-events: none so it never blocks a canvas or spinner click. */
    #status {
      position: absolute;
      top: 2px;
      left: 4px;
      z-index: 10;
      font-size: 0.7rem;
      font-style: italic;
      color: #9e9e90;
      letter-spacing: 0.04em;
      pointer-events: none;
      background: rgba(10, 10, 15, 0.6);
      padding: 1px 4px;
      border-radius: 2px;
    }

    .controls {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    button {
      background: #0f0f18;
      border: 1px solid #4a9b8e;
      color: #4a9b8e;
      cursor: pointer;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      padding: 0.45rem 1.1rem;
      text-transform: uppercase;
    }

    button:hover {
      background: #1a2a28;
    }

    button:active {
      background: #243f3b;
    }

    /* A42 fix (user report 2026-07-01) — canvas takes the full available
       height and matches its width to it (square), spinners fill whatever
       horizontal room is left and wrap. Previous grid layout was giving the
       controls column a fixed 170px and starving the canvas of both padding
       and honest height math.
       In a very wide-and-short iframe (e.g. 1574×150 when the chat panel
       is open) this yields canvas 150×150 with spinners in a ~1400px-wide
       band wrapping into a couple of rows. */
    .module-layout {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 0;
      min-height: 0;
      min-width: 0;
    }

    .canvas-wrapper {
      flex: 1 1 auto;                    /* takes whatever remains after the panel */
      min-height: 0;
      min-width: 0;
      display: flex;
      /* Landscape (default): right-align the square canvas within its wrapper
         so it sits snug against the left edge of the control-panel.
         Previously center-aligned, leaving a large empty gap between the
         canvas and the column on desktop/laptop. Overridden to center in
         the portrait media query below. */
      justify-content: flex-end;
      align-items: center;
      /* 2026-08-19 — 44px band between canvas and stepper column, the home for
         BD's ↓↑ arrows. The small layout gets the same band for free from the
         canvas's translateX; without this the canvas is flush against the
         column in landscape and the arrows land on the graphic. */
      padding-right: 44px;
      /* 2026-08-19 — and 52px below it for BD's Extension strip, matching the
         reserve the small layout has always had. Without it the canvas fills
         the wrapper down to the iframe's bottom edge, the strip has nowhere to
         sit, and positionExtendPanel's breadcrumb clamp pulls it up ONTO the
         graphic (it needs 44: 34 strip + 6 gap + 4 clearance).
         The canvas is height-limited on desktop, so this costs ~52px of square
         in both dimensions — deliberate, and the same trade the small layout
         makes for free (it is width-limited there). */
      padding-bottom: 52px;
    }

    /* Small iframe (mobile) — 2026-08-05 v13. Kolam-specific gutter for BD's
       extend panel (which sits at bottom-left of viewport, ~84 px wide).
       Was previously a global iframe left-reserve in positionCyEl (v8) but
       that shifted every module including music_module unnecessarily. Now
       Kolam handles it via a padding-left on the flex layout — canvas +
       control-panel shift right by 88 px, extend panel sits in the gutter.
       Music module has its own portrait rules and doesn't need this. */
    @media (max-width: 500px) {
      /* 2026-08-17 — keep the 88px band so the canvas holds its former (small)
         size + position; the Extension bar sits UNDER the canvas (BD
         positionExtendPanel .under-canvas). Drop the canvas to the BOTTOM
         (align-items: flex-end) with a padding-bottom that reserves room for
         the Extension bar just beneath it — so the bar lands just above the
         breadcrumbs and the canvas sits just above the bar. */
      .module-layout { padding-left: 88px; }
      .canvas-wrapper { justify-content: center; align-items: flex-end; padding-bottom: 52px;
                        padding-right: 0; }   /* small layout makes its own band
                                                 via the canvas translateX */
      /* 2026-08-17 — shift canvas 15% + 20px left to free room between it and
         the stepper column for BD's ↓↑ arrows. The Extension bar follows (BD
         centres it on the live canvas rect). */
      .canvas-wrapper canvas { transform: translateX(calc(-15% - 20px)); }
      .control-panel {
        flex: 0 0 108px !important;
        padding: 6px 4px;
        /* 2026-08-17 — bright amber so the stepper panel reads as its own
           block, set off from the ↓↑ arrows to its left. !important because the
           BASE .control-panel rule below (equal specificity, later in source)
           was overriding this — which is why earlier attempts showed no tint
           (same reason the flex above needs !important). */
        background: rgba(75, 54, 0, 0.9) !important;
      }
      .control-row { width: 100px; }
    }

    /* Default (landscape) control panel — fixed 220 px column on the right.
       Fixed width prevents the canvas from squeezing the panel to zero when
       the iframe is nearly square (as in the preview harness).
       Portrait media query above overrides to a bottom band.
       The <canvas> keeps itself square via its own aspect-ratio + max-*. */
    /* The column's own header. Smallest size that renders as letters, with a
       rule under it so it reads as a break rather than another label — the
       same idiom the music module's strip uses, so two stacked columns in a
       collage look like one list with two groups. */
    .strip-title {
      flex: 0 0 auto;
      width: 100%;
      padding: 0 2px 3px;
      margin-bottom: 3px;
      border-bottom: 1px solid rgba(74, 155, 142, 0.35);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 8px;
      letter-spacing: 0.06em;
      color: #cbbf8a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .control-panel {
      /* ── SHARING THE LANE (2026-10-10) ───────────────────────────────────
         `--bd-col-max` is set by the host via bd_collage_layout when another
         module's steppers are to sit beneath these. Unset everywhere else, so
         `none` is the normal case and nothing changes for a module on its own.
         A max-height rather than a height: the column should still be short
         when it has few rows. */
      max-height: var(--bd-col-max, none);
      /* 2026-08-19 — 220 → 130. A control-row is 94px; with the panel's
         padding, border and a scrollbar it needs ~122. The 220 was defensive
         (stop the canvas squeezing the panel to zero in the preview harness)
         and left ~90px dead, which is what made the column look twice the
         width it needs. */
      flex: 0 0 130px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;             /* controls hug the left edge, − on the left */
      gap: 2px;                            /* 2026-07-12 -50% from 4 px for MM3 density */
      /* 2026-08-19 — amber at EVERY width, not just the small layout, so the
         stepper block reads as its own thing and the arrows' relationship to
         it is visible at a glance. */
      background: rgba(75, 54, 0, 0.9);
      border: 1px solid rgba(74, 155, 142, 0.2);
      padding: 6px 8px;
      border-radius: 0.4rem;
      min-height: 0;
      min-width: 0;
      overflow-y: auto;
    }

    /* ── A WHITE FRAME WHILE SHARING THE LANE ─────────────────────────────
       Matching the music module's own `.panel` border, so two stacked groups
       read as two panels of one list rather than one column with a line in it.
       The faint teal above is right for a column standing alone and far too
       quiet to divide one column from another — luminance, not hue, doing the
       work, which matters here.

       AFTER the rule it overrides, and the full `border` SHORTHAND rather than
       `border-color` alone. Specificity already favoured it, but a shorthand
       below a longhand is the kind of thing that is true until someone adds a
       declaration, and this file has lost rounds to exactly that. */
    body.sharing-lane .control-panel { border: 1px solid #fff; }

    /* Control cell — one stepper (or select) above, label immediately below.
       Small margin-bottom separates each button-label pair from the next.
       Media-module convention 2026-07-02. */
    /* A control the script did not ask for. `hidden` alone loses to the
       display rule below, so it is stated explicitly. */
    .control-row[hidden] { display: none !important; }
    .control-row {
      display: flex;
      flex-direction: column;
      gap: 1px;                            /* 2026-07-12 -50% from 2 px */
      flex: 0 0 auto;
      width: 94px;                         /* 2026-08-17 — with 34px buttons, centres sit ~60px apart (was 70) → ~15% closer */
      margin-bottom: 3px;                  /* 2026-07-12 -50% from 6 px */
    }

    .control-row label {
      font-size: 0.7rem;
      letter-spacing: 0.02em;
      color: #4a9b8e;
      text-align: center;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;      /* no iOS magnifier / text-select on long-press */
    }

    /* Stepper: [−] [value] [+] row. Buttons flex fixed-width, value spans middle. */
    .stepper {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 2px;                            /* 2026-07-12 -50%-ish from 3 px */
    }

    .step-btn {
      background: #0f0f18;
      border: 1px solid #4a9b8e;
      color: #4a9b8e;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.25rem;                      /* 2026-08-17 — glyph scales with the bigger button */
      padding: 0;
      width: 34px;                             /* 2026-08-17 — +30% (was 26) for easier mobile taps */
      height: 34px;                            /* 2026-08-17 — +30% (was 26) */
      line-height: 1;
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
      border-radius: 3px;
      flex: 0 0 auto;
      touch-action: manipulation;              /* kill iOS double-tap zoom on rapid taps */
      user-select: none;
      -webkit-user-select: none;               /* older iOS Safari — text-select on long press */
      -webkit-touch-callout: none;             /* suppress long-press callout / magnifier */
      -webkit-tap-highlight-color: transparent;/* no grey flash halo */
    }

    .step-btn:hover  { background: #1a2a28; }
    .step-btn:active { background: #243f3b; }
    .step-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Four characters ("1.0k") in a span measured to fit three. Shrinking the
       text is the cheaper trade: widening .control-row would move every
       stepper's centre and undo the tap-target spacing set on 2026-08-17. */
    .stepper-value--wide { font-size: 0.56rem; letter-spacing: -0.02em; }
    .stepper-value {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.7rem;                       /* 2026-08-17 — was 0.78; narrower value span (bigger buttons + closer centres) still fits "100" */
      color: #e8e8e0;
      background: #0f0f18;
      border: 1px solid #2a2a3a;
      padding: 1px;                            /* 2026-08-17 — was 2px, reclaim width for the 3-char readout */
      border-radius: 3px;
      min-width: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* Hidden source input backing each stepper — kept in the DOM so existing
       JS can still read/write .value, min, max, step. */
    .stepper-source {
      display: none;
    }

    /* Set by the host harness via postMessage bd_ui_config { hideControls: true }.
       Preview.html supplies its own outer stepper column; hiding the internal
       one lets the canvas take the whole iframe width. */
    body.controls-hidden .control-panel { display: none; }
    body.controls-hidden .canvas-wrapper { flex: 1 1 auto; }

    /* ── The host's chrome, which is a SEPARATE question from the controls ──
       2026-09-30. These rules were on `controls-hidden`, and the note said "BD's
       embedded player and the standalones still need those gutters". That was
       true of the OLD standalones, which drew their own arrows. The new one
       draws none — and its author reported exactly the symptom the note
       predicts: "the graphic seems unnecessarily small, a lot of black space
       around it... it loses black space on the left".

       So the two are split. `controls-hidden` still means "the host supplies
       the stepper column". `no-host-chrome` means "the host draws NOTHING
       around this iframe", and it is what releases the gutters:

         88px left   BD's ↓↑ arrows, beside the stepper column
         52px bottom BD's Extension strip, under the canvas
         translateX(calc(-15% - 20px))  the small layout's nudge, which frees
                     that arrow band — 84.5px at a 430px width, measured

       The BOTTOM one is what binds on a phone: at 430x335 the wrapper, 52px of
       reserve takes the square from 335 to 283. Releasing it is ~18%, and the
       nudge is the whole of "the figure hangs off the left edge".

       Hiding the controls implies no chrome — a viewer has neither — so
       controls-hidden still sets both. */
    body.no-host-chrome .canvas-wrapper canvas { transform: none; }
    body.no-host-chrome .module-layout  { padding-left: 0; padding-right: 0; }
    body.no-host-chrome .canvas-wrapper {
      justify-content: center;
      align-items: center;
      padding-bottom: 0;
      padding-right: 0;
    }

    /* Selects retain their native appearance for iOS/mobile compatibility. */
    .control-panel select {
      width: 100%;
      background: #0f0f18;
      color: #e8e8e0;
      border: 1px solid #2a2a3a;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;          /* ≥16px logical to avoid iOS auto-zoom on focus */
      padding: 4px;
      accent-color: #4a9b8e;
      outline: none;
    }

    .control-panel select:focus {
      border-color: #4a9b8e;
    }

    canvas {
      border: 1px solid #4a9b8e;
      border-opacity: 0.3;
      display: block;
      /* A42 §42.9 — fit inside wrapper without overflowing either axis */
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1 / 1;
    }

    /* ── 3D-only additions ───────────────────────────────────────────────────
       Everything above this line is V_Kolam/visual_module.html's stylesheet
       verbatim (2026-09-27), so the two modules present an identical control
       surface and BD's positionExtendPanel measurements hold for both. Edit
       the shared part THERE and copy down; only 3D-specific rules belong
       below.                                                               */

    /* The waiting message can no longer be PAINTED. The 2D module writes
       "Waiting for script..." with ctx.fillText, and a WebGL canvas has no
       fillText — so it becomes a DOM overlay. Which is the better thing
       anyway: it is selectable, it scales with the browser's text size, and
       it is also where a missing-CDN failure is announced. */
    #waiting {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem;
      text-align: center;
      font-style: italic;
      font-size: 1.05rem;
      color: #9e9e90;
      pointer-events: none;
      z-index: 5;
    }
    #waiting[hidden] { display: none !important; }
    /* A CDN that did not answer is not a "waiting" state — it is a dead
       module, and it must not look like a slow one. */
    #waiting.fatal { color: #e0b0b0; font-style: normal; pointer-events: auto; }
    /* #waiting is positioned against the canvas wrapper, not the viewport, so
       the message stays centred on the SQUARE rather than on the whole iframe
       (the wrapper is the only box that tracks the canvas at every width). */
    .canvas-wrapper { position: relative; }
    /* The fatal message is two sentences on two lines. */
    #waiting { white-space: pre-line; }
    /* ── output-only: the module's OUTPUT and nothing else (2026-10-08) ──
       For this module the output is the canvas. #status is the module talking
       about itself, which a presentation surface has no room for and a collage
       would never want. */
    body.output-only #status { display: none; }
    body.output-only { overflow: hidden; }
  </style>
</head>
<body>

  <!-- Errors reach here via setStatus; starts empty, as in the 2D module. -->
  <div id="status"></div>

  <div class="module-layout">

  <div class="canvas-wrapper">
    <canvas id="kolam-canvas"></canvas>
    <div id="waiting">Waiting for script…</div>
  </div>

  <div class="control-panel">
    <!-- THE MODULE'S NAME, HEADING ITS OWN GROUP (2026-10-10).
         "Module headers above each group for clarity" — the author's, in a
         collage where this column is joined by another module's below it. The
         title lives IN the column rather than being positioned over it by the
         host, so each module labels its own steppers and the labels appear in
         whatever order the host places the modules. Nothing is told twice.
         Its own identity, not a value read from the script: a directive could
         otherwise rename the module in its own label. -->
    <div class="strip-title">bd_V_Kolam3D</div>
    <!-- Media-module control convention (2026-07-02): buttons above, the
         directive's own name below, verbatim.

         2026-09-27 — the 3D column, and what differs from the 2D one:

         · pitch / pitch_minutes / pitch_drift are NEW, and they mirror
           angle / angle_minutes / angle_drift exactly. pitch is the SECOND
           plane: `+` turns the turtle by `angle` about its up axis AND by
           `pitch` about its left axis, `-` by the negatives of both. So
           pitch 0 leaves the turtle in one plane and draws the 2D figure,
           segment for segment — which is the property the whole module is
           built around and the reason the default is 0.

         · cam_azimuth / cam_elevation / cam_distance place the camera. A 3D
           figure you cannot walk round is a flat picture with extra cost, so
           these are not an extra: they are what makes the module worth having.
           `cam_` comes first in all three names so they sort and read as one
           group in the column. The labels WRAP rather than truncate (there is
           no text-overflow on .control-row label) — 13 characters is the
           one-line limit, set by angle_minutes, and all three fit inside it.

         · there is NO weight stepper, and that is deliberate. See the note on
           LINE_WIDTH_IS_NOT_AVAILABLE in the script below: core WebGL ignores
           line width on every platform that matters, so a weight control here
           would be a knob wired to nothing. %%bd_weight is left untouched in
           the script so a figure can still travel between the 2D and the 3D
           module without losing it. -->
    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="symmetry-select" data-delta="-1">−</button>
        <span class="stepper-value" data-target="symmetry-select">8</span>
        <button class="step-btn" type="button" data-target="symmetry-select" data-delta="1">+</button>
      </div>
      <label>symmetry</label>
      <input id="symmetry-select" class="stepper-source" type="number" min="1" max="16" step="1" value="8">
    </div>

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="depth-select" data-delta="-1">−</button>
        <span class="stepper-value" data-target="depth-select">2</span>
        <button class="step-btn" type="button" data-target="depth-select" data-delta="1">+</button>
      </div>
      <label>depth</label>
      <input id="depth-select" class="stepper-source" type="number" min="1" max="5" step="1" value="2">
    </div>

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="step-slider" data-delta="-1">&minus;</button>
        <span class="stepper-value" data-target="step-slider">1</span>
        <button class="step-btn" type="button" data-target="step-slider" data-delta="1">+</button>
      </div>
      <label>step</label>
      <!-- THE TURTLE'S STEP LENGTH, IN METRES. 2026-10-19, second attempt.
           `step` is the nominal length: the segment actually drawn is
           step / 3^(depth-1), so at depth 5 a step of 74 m draws 91 cm. That
           division keeps the figure roughly one size as depth changes, since
           the segment count goes as 4^depth.

           METRES FROM THE WORD GO, which is the author's aim and the whole
           reason for this revision: world units are metres with no scale
           factor anywhere, so a script that works on a flat screen works in a
           headset with nothing to translate.

           WHAT THIS REPLACED, AND WHY IT CAME BACK. A %%bd_size directive in
           metres was tried first, with `step` kept in arbitrary units and the
           figure post-scaled to the declared size. It worked and was abandoned
           on the author's judgement: two controls for one degree of freedom,
           one of them invisible, and the scale factor had to be carried
           through placeCamera, the auto-fit and the arm-axis target. Setting
           the step in metres needs none of that. The cost is that `step` is
           not the length of anything you can see — 74 draws 0.91 — and the
           author accepts it: "the trick is going to be to find a combination
           of rig distance and step size that gives a workable view."

           PROPORTIONAL: five per cent a press, because a physical length spans
           decades. 1 cm to 200 m is 203 presses, the same feel as angle's 359.
           REBUILDS the geometry, unlike the post-scale it replaced — that is
           the price of having no scale factor. -->
      <input id="step-slider" class="stepper-source" type="number"
             min="0.01" max="200" step="0.01" data-proportional="0.05" value="1">
    </div>

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="stretch-slider" data-delta="-1">&minus;</button>
        <span class="stepper-value" data-target="stretch-slider">1</span>
        <button class="step-btn" type="button" data-target="stretch-slider" data-delta="1">+</button>
      </div>
      <label>stretch</label>
      <!-- HOW FAR THE FIGURE IS STRETCHED OUT OF ITS BASE PLANE. A plain
           ratio: 1 is isotropic, 0 is flat whatever `pitch` says, 2 is twice
           as tall for the same width.

           WAS %%bd_step_pitch, A LENGTH IN `step`'s UNITS, UNTIL 2026-10-19.
           The old form divided by `step`, which made `step` do two jobs at
           once — and the second one was invisible. With %%bd_size set, `step`
           cancels out of the figure's SIZE entirely (proven: any step gives
           the same final metres) and survived only as half of an aspect
           control, through this ratio. Nothing in the column said so. Breaking
           the dependency is what lets `step` be a pure uniform scale and
           nothing else.

           It remains what makes `pitch` usable: pitch compounds at every one
           of five hundred turns, so a single degree is a wholesale change and
           there is no gentle way in from the angle alone. This is the gentle
           way in — set whatever pitch you like and open the new dimension from
           0 upward.

           BACKWARD COMPATIBLE. A script carrying %%bd_step_pitch and no
           %%bd_stretch is read as step_pitch / step, so the four stored
           figures load unchanged; the first touch of any control writes
           %%bd_stretch, and the stale line is then ignored rather than
           deleted, the same courtesy %%bd_weight gets. -->
      <input id="stretch-slider" class="stepper-source" type="number" min="0" max="4" step="0.05" value="1">
    </div>

    <!-- 2026-09-27 — PAIRED ORDER. Every quantity that exists in both planes
         sits next to its counterpart: angle/pitch and
         angle_minutes/pitch_minutes, angle_drift/pitch_drift. The column is
         read as six pairs rather than two families, so the question "what is
         the pitch equivalent of this" is answered by the row underneath

    <div class="control-row">
      <div class="stepper">

        <span class="stepper-value" data-target="pitch-slider">1</span>
        <button class="step-btn" type="button" data-target="pitch-slider" data-delta="1">+</button>
      </div>
      <label>pitch</label>
      <!-- Initialises to 1, not 0 (2026-09-27). At pitch 0 the turtle never
           leaves the plane, so stretch has no out-of-plane extent to scale
           and reads as a dead control — which is exactly how it was first
           reported. One degree is a shallow dome: MEASURED, it lifts the
           default figure 75 world units against an in-plane radius of 97, so
           sweeping stretch across its range is plainly visible.

           This is the MARKUP default, seen before any script arrives. The
           PARSE fallback in setControlValues stays 0, deliberately: a script
           that never mentions pitch is a script written for the flat module,
           and it must render flat here rather than be quietly given a shape
           its author did not ask for. -->
      <input id="pitch-slider" class="stepper-source" type="number" min="0" max="359" step="1" value="1" data-wrap="1">
    </div>

        <span class="stepper-value" data-target="angle-minutes-slider">0</span>

    </div>

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="pitch-minutes-slider" data-delta="-1">−</button>
        <span class="stepper-value" data-target="pitch-minutes-slider">0</span>
        <button class="step-btn" type="button" data-target="pitch-minutes-slider" data-delta="1">+</button>
      </div>
      <label>pitch_minutes</label>

    <div class="control-row">
      <div class="stepper">

    <!-- Both seconds accumulators, together, below the pair they belong to.
         They are sub-arcminute drift totals with controls and deliberately NO
         directive, so they are not in CONTROL_FOR and cannot be hidden by a
         marking decision they have no way to express. -->
    <input id="angle-seconds-slider" type="hidden" value="0">
    <input id="pitch-seconds-slider" type="hidden" value="0">

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="cam-azimuth-slider" data-delta="-1">−</button>
        <span class="stepper-value" data-target="cam-azimuth-slider">0</span>
        <button class="step-btn" type="button" data-target="cam-azimuth-slider" data-delta="1">+</button>
      </div>
      <label>cam_azimuth</label>
      <!-- Cyclic, like angle: going round the figure has no far edge. -->
      <input id="cam-azimuth-slider" class="stepper-source" type="number" min="0" max="359" step="1" value="0" data-wrap="1">
    </div>

    <div class="control-row">

        <button class="step-btn" type="button" data-target="cam-elevation-slider" data-delta="-1">−</button>
        <span class="stepper-value" data-target="cam-elevation-slider">60</span>
        <button class="step-btn" type="button" data-target="cam-elevation-slider" data-delta="1">+</button>
      </div>
      <label>cam_elevation</label>
      <!-- 2026-09-27 — the FULL TURN, -180..179, and CYCLIC. It was -90..90
           with a note saying it must not wrap because "stepping past the pole
           would flip the azimuth by 180 degrees without the azimuth control
           moving, so two different numbers would name one view".
           THAT NOTE WAS WRONG, and it was wrong about code that had already
           been written to avoid the problem it described. It is true of a naive
           up vector of world +Y; it is not true of the sphere's north tangent,
           which is what placeCamera uses. CHECKED rather than reasoned about:
           across all 360 whole degrees the up vector stays unit length and its
           dot product with the view direction is 0 to twelve places — including
           AT the poles — no two elevations in -180..179 give the same position
           and up, and every one-degree step moves the camera exactly 0.01745 of
           the radius, so there is no jump going over the top.

           The range stops at 179 rather than 180 because 180 and -180 are the
           SAME view (verified identical), and one picture must not have two
           spellings or a script cannot round-trip. Same discipline as angle,
           where 360 is never stored. So the span is 360 and + at 179 comes
           round to -180.

           Cyclic also because it has to be: cam_elevation_speed rotates through
           it continuously, and a clamp would simply stop the rotation dead at
           the end. -->
      <input id="cam-elevation-slider" class="stepper-source" type="number" min="-180" max="179" step="1" value="60" data-wrap="1">
    </div>

    <!-- 2026-10-15 — ARCMINUTES ON THE BEARING, both of it, reported as "i
         cannot set the elevation finely enough". Two separate reasons, and the
         second is the one that makes this not a nicety:

         1. cam_axis MEASURES an axis and then had to round the answer to whole
            degrees to write it, throwing away up to half a degree of a fit
            that is good to a fortieth of one. The control was less precise
            than the measurement it carried.
         2. A DEGREE OF ELEVATION AND A DEGREE OF AZIMUTH ARE NOT THE SAME
            SIZE. The azimuth circle has radius cos(elevation), so near the
            pole a degree of azimuth is a fraction of a degree of view while a
            degree of elevation is a whole one. MEASURED at elevation 82, where
            this module's tunnel is aimed: cos 82 = 0.139, so the azimuth is
            already SEVEN TIMES the finer control and the elevation is the one
            that cannot reach. That asymmetry is why it reads as "the elevation
            is too coarse" rather than "the bearing is too coarse".

         Both get minutes anyway, because the asymmetry reverses: at elevation
         0 a degree of azimuth is a degree of view too, and an arm need not run
         anywhere near vertical. Giving minutes only to the half that happened
         to be short on one figure would be fitting the control to the example.

         0..59 and UNSIGNED, adding to the signed degrees, exactly as
         angle_minutes adds to angle. One spelling per arcminute and no second
         way to write any aim — a signed ±59 would make 81 + 30' and 82 - 30'
         the same picture twice, which is the thing the elevation markup above
         refuses for 180 and -180. -->
    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="cam-azimuth-minutes-slider" data-delta="-1">&minus;</button>
        <span class="stepper-value" data-target="cam-azimuth-minutes-slider">0</span>
        <button class="step-btn" type="button" data-target="cam-azimuth-minutes-slider" data-delta="1">+</button>
      </div>
      <label>cam_azimuth_minutes</label>
      <input id="cam-azimuth-minutes-slider" class="stepper-source" type="number" min="0" max="59" step="1" value="0">
    </div>

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="cam-elevation-minutes-slider" data-delta="-1">&minus;</button>
        <span class="stepper-value" data-target="cam-elevation-minutes-slider">0</span>
        <button class="step-btn" type="button" data-target="cam-elevation-minutes-slider" data-delta="1">+</button>
      </div>
      <label>cam_elevation_minutes</label>
      <input id="cam-elevation-minutes-slider" class="stepper-source" type="number" min="0" max="59" step="1" value="0">
    </div>

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="cam-elevation-speed-slider" data-delta="-1">−</button>
        <span class="stepper-value" data-target="cam-elevation-speed-slider">0</span>
        <button class="step-btn" type="button" data-target="cam-elevation-speed-slider" data-delta="1">+</button>
      </div>
      <label>cam_elevation_speed</label>
      <!-- Auto-rotate: DEGREES PER SECOND through cam_elevation, so the figure
           tumbles over its own poles. 0 is off. 1 is a turn in six minutes, 60
           a turn in six seconds.

           Called _speed and deliberately NOT _drift, even though angle_drift and
           pitch_drift are the module's other automatic movements. Their unit is
           ARCSECONDS PER TICK, and at the top of that range the camera would
           take twenty-one minutes to come round once — useless here. A control
           that shares a family name must share the family's unit, so this one
           takes a different name rather than a second meaning for "drift".

           It has its own clock at 20 a second, not the drift timer's: that one
           is throttled by DEPTH (a whole second per tick at depth 5) because
           every tick of it rebuilds the geometry. A camera move rebuilds
           nothing, so it can be smooth at any depth — which is the entire
           reason the no-rebuild path exists. -->
      <input id="cam-elevation-speed-slider" class="stepper-source" type="number" min="0" max="60" step="1" value="0">
    </div>

    <!-- 2026-10-15 — ROLL ABOUT THE VIEW AXIS, asked for as "how can we make
         it rotate about the fly axis".

         It is the THIRD and last degree of freedom the camera has, and the one
         the other controls cannot reach: azimuth and elevation say where the
         eye is, cam_distance says how far along, and none of them can turn the
         picture about the line of sight. Flying down a tunnel is exactly where
         that becomes the interesting one — a spiral read head-on is a still
         pattern, and a spiral read head-on while turning is a passage.

         Cyclic, like cam_azimuth: a turn has no far edge. POSITIVE TURNS THE
         PICTURE ANTICLOCKWISE, derived rather than eyeballed — at roll 90 the
         camera's up vector becomes the screen's old right, so a feature at the
         top of the frame moves to the left.

         NO MINUTES. The bearing controls have them because cam_axis MEASURES
         an aim and a rounded aim misses; nothing is being aimed with the roll,
         and a degree of it is a degree of picture at every elevation.

         It rides the same clock as the other two speeds and takes no new
         timer — see ONE CLOCK FOR BOTH MOVES below, which is now three. -->
    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="cam-roll-slider" data-delta="-1">&minus;</button>
        <span class="stepper-value" data-target="cam-roll-slider">0</span>
        <button class="step-btn" type="button" data-target="cam-roll-slider" data-delta="1">+</button>
      </div>
      <label>cam_roll</label>
      <input id="cam-roll-slider" class="stepper-source" type="number" min="0" max="359" step="1" value="0" data-wrap="1">
    </div>

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="cam-roll-speed-slider" data-delta="-1">&minus;</button>
        <span class="stepper-value" data-target="cam-roll-speed-slider">0</span>
        <button class="step-btn" type="button" data-target="cam-roll-speed-slider" data-delta="1">+</button>
      </div>
      <label>cam_roll_speed</label>
      <!-- DEGREES PER SECOND, and SIGNED, unlike cam_elevation_speed which only
           goes one way. Both directions of a roll are a real choice and they
           look different, where a tumble that only goes one way loses nothing.
           1 is a turn in six minutes, 60 a turn in six seconds. Keep it SLOW
           for a long flight: at 3 a second the tunnel turns once in two
           minutes, which reads as movement rather than as spinning.

           WHY IT WANTS TO BE SLOW IS NOT ONLY TASTE. A roll about the view axis
           is the motion a headset tolerates least — the vestibular system has
           no matching signal for it, where a yaw at least resembles turning
           your head. ThreeJS_and_VR_2026-09-28.md section 5b already cautions
           that a slow fly-through is the most reliably nausea-inducing motion
           in VR; a fly-through that also rolls is that caution squared. On a
           flat screen it is simply a nice effect. -->
      <input id="cam-roll-speed-slider" class="stepper-source" type="number" min="-60" max="60" step="1" value="0">
    </div>

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="cam-axis-slider" data-delta="-1">&minus;</button>
        <span class="stepper-value" data-target="cam-axis-slider">0</span>
        <button class="step-btn" type="button" data-target="cam-axis-slider" data-delta="1">+</button>
      </div>
      <label>cam_axis</label>
      <!-- AIM DOWN ONE ARM'S OWN AXIS. 0 is the figure's axis (azimuth 0,
           elevation 90 — the overhead view that reproduces the 2D kolam);
           1..16 is the axis of that numbered arm, the copies applySymmetry
           makes, counted the way it makes them.

           WHY IT EXISTS, 2026-10-15. Flying in with cam_distance_speed goes
           down whatever line the camera already looks along, and at elevation
           90 that is the figure's central axis — which at symmetry 6 is the
           gap BETWEEN the tubes and at symmetry 1 is alongside the single one,
           outside the right-hand window. The author found cam_azimuth 325 /
           cam_elevation 98 by hand for one structure. That measurement is the
           useful part: it says the arm's axis passes close enough to the
           ORIGIN that looking at the origin is already looking down the arm,
           so nothing about placeCamera needs to change — only the aim, and an
           aim can be MEASURED instead of hunted for.

           So this is a control that WRITES TWO OTHER CONTROLS. Pressing it
           fits a line to the arm by principal axis and puts the resulting
           bearing into cam_azimuth and cam_elevation, where it is visible, is
           saved with the script, and can be nudged afterwards. Nothing new has
           to be understood to use the result, and the two numbers that were
           found by hand are still the two numbers that do the work.

           It therefore RE-AIMS ON A PRESS AND NOT ON A SCRIPT PUSH — RULE 7's
           distinction, for RULE 7's reason. If reading the script re-aimed, a
           reload would silently throw away a hand nudge of the azimuth, and
           the author's own 325/98 would be unrecoverable from a script that
           recorded it.

           Expect the SECOND spelling of the author's bearing: elevation is
           written in -90..90, so the azimuth comes out on the other side.
           325/98 and 145/82 are the same view (ce = cos 98 is negative, which
           is what flips the azimuth), and the module stores the one that does
           not need the far half of the elevation range. -->
      <input id="cam-axis-slider" class="stepper-source" type="number" min="0" max="16" step="1" value="0">
    </div>

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="cam-distance-slider" data-delta="-1">−</button>
        <span class="stepper-value" data-target="cam-distance-slider">260</span>
        <button class="step-btn" type="button" data-target="cam-distance-slider" data-delta="1">+</button>
      </div>
      <label>cam_distance</label>
      <!-- World units — the same units the turtle steps in, so it is a real
           distance and not a percentage of anything. It needs the full range
           because the figure's own size does: MEASURED across the four stored
           Kolam settings, the radius about the origin runs 97 (depth 2) to
           1362 (depth 3, angle 68) — a factor of fourteen. Hence also the
           coarse step above 1000, borrowed from `step`.

           RAISED to 99000 on 2026-10-15, requested while flying down an arm.
           Framing never needed it — 9900 is ten times the largest stored
           figure's radius — but TRAVELLING does: the distance is now where you
           ARE along the axis you are flying in on, so the top of the range is
           how far out the trip can START, and the old 9900 put the beginning
           of the flight inside the figure. Holding the button still crosses
           the whole range in FULL_TRAVERSE_MS, since that rate is derived from
           the range rather than set per control. -->
      <input id="cam-distance-slider" class="stepper-source" type="number"
             min="0.02" max="2000" step="0.01" data-proportional="0.05" value="4">
    </div>

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="cam-distance-speed-slider" data-delta="-1">&minus;</button>
        <span class="stepper-value" data-target="cam-distance-speed-slider">0</span>
        <button class="step-btn" type="button" data-target="cam-distance-speed-slider" data-delta="1">+</button>
      </div>
      <label>cam_distance_speed</label>
      <!-- World units a second, and SIGNED: negative flies IN, positive flies
           out. It sits beside cam_distance for the same reason step_pitch sits
           beside step — a rate belongs next to the quantity it moves.
           ADDED 2026-10-15, for flying through the tunnel of bd_V_Kolam3D_002.
           At cam_elevation 90 the eye is ON the figure's axis, so the distance
           IS the position along it and a rate here is a passage through.

           IT CLAMPS AND STOPS at the ends rather than bouncing or wrapping,
           unlike cam_elevation_speed, which must be cyclic because an angle is.
           A distance is not cyclic, and a piece that arrives somewhere is a
           better default than one that never ends — the same judgement the
           collage sequencer settled on. Reverse by flipping the sign.

           The range is deliberately modest: the tunnel is ~8,600 units long and
           a minute is a slow passage, so ten a second is already a useful
           speed and 300 is a rush. -->
      <input id="cam-distance-speed-slider" class="stepper-source" type="number" min="-5" max="5" step="0.01"

    <div class="control-row">

        <span class="stepper-value" data-target="colour-speed-slider">4</span>
        <button class="step-btn" type="button" data-target="colour-speed-slider" data-delta="1">+</button>

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="saturation-slider" data-delta="-1">−</button>
        <span class="stepper-value" data-target="saturation-slider">100</span>
        <button class="step-btn" type="button" data-target="saturation-slider" data-delta="1">+</button>
      </div>
      <label>saturation</label>
      <input id="saturation-slider" class="stepper-source" type="number" min="0" max="100" step="1" value="100">
    </div>

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="lightness-slider" data-delta="-1">−</button>
        <span class="stepper-value" data-target="lightness-slider">65</span>
        <button class="step-btn" type="button" data-target="lightness-slider" data-delta="1">+</button>
      </div>
      <label>lightness</label>
      <input id="lightness-slider" class="stepper-source" type="number" min="0" max="100" step="1" value="65">
    </div>

    <div class="control-row">
      <div class="stepper">
        <button class="step-btn" type="button" data-target="opacity-slider" data-delta="-1">−</button>
        <span class="stepper-value" data-target="opacity-slider">1</span>
        <button class="step-btn" type="button" data-target="opacity-slider" data-delta="1">+</button>
      </div>
      <label>opacity</label>
      <!-- 2026-09-27 — 0 to 1. In HUNDREDTHS since 2026-09-29. It earns its place in
           the 3D module more than it would in the flat one: with eight
           symmetric copies of a folded curve, the figure is mostly its own
           occlusion, and turning the lines translucent is how you see into it.

           0 is a legal value and draws nothing. That is one tap from visible,

           Material only — no geometry — so it joins the no-rebuild path and
