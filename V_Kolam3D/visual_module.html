    // ── Opacity ───────────────────────────────────────────────────────────
    //
    // Material only, so this costs no geometry and sweeps live at any depth.
    function applyOpacity() {
      if (!material) return 1;
      const o = Math.min(Math.max(safeParseNumber(opacitySlider.value, 1), 0), 1);
      const wantTransparent = o < 1;
      if (material.transparent !== wantTransparent) {
        // `transparent` takes part in three's program cache key, so a change to
        // it needs the material recompiled. Guarded, because this runs on every
        // render — including five to ten times a second while drift is on — and
        // needsUpdate every frame would rebuild the shader every frame.
        material.transparent = wantTransparent;
        material.needsUpdate = true;
      }
      material.opacity = o;
      // Translucent lines must NOT write depth. With depth writing on, the
      // nearest line in each pixel hides every line behind it and the figure
      // reads as a solid shell — which defeats the entire point of reaching for
      // opacity on a figure that is eight overlapping copies of a folded curve.
      // Opaque lines write depth as normal.
      material.depthWrite = !wantTransparent;
      return o;
    }

    // ── Auto-rotate ───────────────────────────────────────────────────────
    //
    // Its own clock, NOT the drift timer's. That one is throttled by depth — a
    // full second per tick at depth 5 — because every tick of it rebuilds the
    // geometry. A camera move rebuilds nothing, so this one runs at 20 a second
    // whatever the depth, and the rotation is as smooth at depth 5 as at 1.
    function manageCamSpin() {
      const speed = safeParseNumber(camElevationSpeedSlider.value, 0);
      if (!(speed > 0)) {
        if (camSpinTimer !== null) { clearTimeout(camSpinTimer); camSpinTimer = null; }
        // Hand the whole degrees back to the slider, so the script, the readout
        // and the picture all agree the moment the rotation stops. Rounded
        // BEFORE wrapping: rounding 179.6 gives 180, which is off the end.
        if (camElevationExact !== null) {
          // Only if the slider still holds the integer THIS module wrote. If a
          // script has set it since — arriving with the speed already at 0 —
          // the script is the authority and the running total is simply dropped.
          if (camElevationWritten === null ||
              safeParseNumber(camElevationSlider.value, NaN) === camElevationWritten) {
            camElevationSlider.value = String(wrapElevation(Math.round(camElevationExact)));
          }
          camElevationExact = null;
          updateValueDisplays();
          placeCamera();
          draw();
        }
        return;
      }
      if (camSpinTimer === null) {
        camElevationExact = wrapElevation(safeParseNumber(camElevationSlider.value, 60));
        camSpinLastWrite  = Date.now();
        camSpinNextDue    = Date.now() + CAM_SPIN_MS;
        camSpinTimer      = setTimeout(camSpinTick, CAM_SPIN_MS);
      }
    }

    function camSpinTick() {
      // Do NOT null camSpinTimer here — manageCamSpin checks it to avoid
      // double-scheduling. The stale handle is overwritten at the end.
      const speed = safeParseNumber(camElevationSpeedSlider.value, 0);
      if (!(speed > 0)) { camSpinTimer = null; return; }
      if (camElevationExact === null) {
        camElevationExact = wrapElevation(safeParseNumber(camElevationSlider.value, 60));
      }

      camElevationExact = wrapElevation(camElevationExact + speed * (CAM_SPIN_MS / 1000));

      // Every tick draws. This is the whole point of a 50ms clock, and it costs
      // a matrix and a draw call.
      placeCamera();
      draw();

      // The script is rewritten far less often than the picture is drawn. At any
      // useful speed the whole degree changes several times a second, and
      // rewriting and announcing on each one would put twenty messages a second
      // on the wire for a value only ever read back to half a degree.
      const now = Date.now();
      if (now - camSpinLastWrite >= CAM_WRITE_MS) {
        camSpinLastWrite = now;
        const whole = wrapElevation(Math.round(camElevationExact));
        if (String(whole) !== camElevationSlider.value) {
          camElevationSlider.value = String(whole);
          camElevationWritten = whole;
          updateValueDisplays();
          if (storedText) {
            storedText = applyControlDirectives(storedText);
            // Labelled as drift, because that is exactly what it is: a timer
            // moved it, not a person, and a viewer is computing the same
            // rotation from the same script. RULE 7 — and the reason BD can
            // decline to forward it rather than snapping the viewer backwards.
            renderingFromDrift = true;
            try { announce(); } finally { renderingFromDrift = false; }
          }
        }
      }

      // Timed from when the tick was DUE, not from now — the same wall-clock
      // scheduling the drift timer needs, and for the same reason: anything the
      // draw costs must be absorbed here instead of added to every period.
      camSpinNextDue += CAM_SPIN_MS;
      if (Date.now() - camSpinNextDue > CAM_SPIN_MS * 5) camSpinNextDue = Date.now() + CAM_SPIN_MS;
      camSpinTimer = setTimeout(camSpinTick, Math.max(0, camSpinNextDue - Date.now()));
    }

    function fitDistance(radius) {
      if (!(radius > 0)) return clampCam(260);
      // Frame a sphere of that radius, with 12% of air round it.
      return clampCam(Math.round((radius / Math.sin((CAM_FOV / 2) * DEG)) * 1.12));
    }

    function curveSegments(depth) {
      // The 2D module draws each F as ONE quadratic bezier and the canvas
      // rasterises the curve for free. A GPU takes line SEGMENTS, so the curve
      // has to be tessellated, and every extra sample multiplies a vertex
      // count that is already 8^(depth+1) for the stored scores.
      //
      // MEASURED F counts for the default rule: depth 2 = 512, depth 3 = 4096,
      // depth 4 = 32768, depth 5 = 262144. So sampling falls as the figure
      // grows, which costs nothing visible: at depth 5 the effective step is
      // 0.49 world units and the bulge on half a unit is under a pixel.
      if (depth <= 2) return 6;
      if (depth === 3) return 4;
      if (depth === 4) return 2;
      return 1;
    }

    // ── The 3D turtle ─────────────────────────────────────────────────────
    // Basis: heading H, up U (the yaw axis), left L (the pitch axis).
    //
    // `+` turns by `angle` about U **and** by `pitch` about L; `-` by the
    // negatives of both. With pitch 0 nothing ever rotates about L, so U stays
    // world +Y, H stays in the XZ plane, and the figure is the 2D drawing laid
    // flat on the ground — which is the property this whole module is built
    // around. 2D (x, y) maps to 3D (x, 0, y).
    function buildTurtle(seq, params) {
      const seg  = curveSegments(params.depth);
      let fCount = 0;
      for (let i = 0; i < seq.length; i++) if (seq[i] === 'F') fCount++;
      const total     = fCount * seg;
      const positions = new Float32Array(total * 6);
      const colors    = new Float32Array(total * 6);
      let w = 0;                                   // write cursor into both

      const pos  = new THREE.Vector3(0, 0, 0);
      const H    = new THREE.Vector3(1, 0, 0);     // heading: 2D angle 0
      const U    = new THREE.Vector3(0, 1, 0);     // up: the yaw axis
      const L    = new THREE.Vector3(0, 0, -1);    // left = U × H
      // Scratch, reused — a Vector3 per segment at a quarter of a million
      // segments is a quarter of a million allocations.
      const q    = new THREE.Quaternion();
      const next = new THREE.Vector3();
      const ctrl = new THREE.Vector3();
      const p    = new THREE.Vector3();
      const prev = new THREE.Vector3();
      const col  = new THREE.Color();

      // The hue follows the accumulated YAW in degrees, exactly as the 2D
      // module's hue follows state.angle — so the same script gives the same
      // colours. Kept as a scalar because a basis cannot be hue-mapped.
      let yawDeg = 0;
      // Tracked SEPARATELY, not as one radius, because step_pitch scales y
      // after the walk — so the figure the camera has to frame is
      // hypot(maxXZ, maxY * scale), and a single radius measured here could
      // not be corrected for it afterwards.
      let maxXZ = 0;
      let maxY  = 0;

      const stack = [];
      const yawRad   = params.effectiveAngle * DEG;
      const pitchRad = params.effectivePitch * DEG;
      const cs  = params.colourSpeed;
      const sat = params.saturation / 100;
      const lit = params.lightness / 100;
      const span = 360 * cs;

      // Rotating (1,0,0) about +Y by θ gives (cos θ, 0, −sin θ), and the 2D
      // heading is (cos a, 0, sin a) — so the yaw is applied as −a. That sign
      // is what makes a top-down view match the 2D figure rather than mirror
      // it, and the reason it is written out rather than guessed at.
      const turn = (deltaYaw, deltaPitch) => {
        if (deltaYaw) {
          q.setFromAxisAngle(U, -deltaYaw);
          H.applyQuaternion(q); L.applyQuaternion(q);
        }
        if (deltaPitch) {
          // Negated so that a POSITIVE pitch lifts the heading upward, which
          // is what "pitch" says. Unnegated it dives.
          q.setFromAxisAngle(L, -deltaPitch);
          H.applyQuaternion(q); U.applyQuaternion(q);
        }
        H.normalize(); U.normalize(); L.normalize();
      };

      for (let i = 0; i < seq.length; i++) {
        const symbol = seq[i];
        if (symbol === 'F') {
          next.copy(pos).addScaledVector(H, params.effectiveStep);
          // The bulge. 2D offsets the bezier control point by rad + π/2, which
          // in the mapped basis is −L, NOT U: at pitch 0 the drawing plane is
          // XZ and L lies in it while U is the plane's normal, so bulging
          // along U would push the curve out of the plane and the pitch-0
          // figure would stop matching the 2D one.
          ctrl.copy(pos).add(next).multiplyScalar(0.5)
              .addScaledVector(L, -params.effectiveStep * 0.3);

          const hue = (((yawDeg % span) + span) % span) / cs;
          col.setHSL(hue / 360, sat, lit);

          prev.copy(pos);
          for (let k = 1; k <= seg; k++) {
            const t = k / seg, u = 1 - t;
            // Quadratic bezier pos → ctrl → next.
            p.set(
              u * u * pos.x + 2 * u * t * ctrl.x + t * t * next.x,
              u * u * pos.y + 2 * u * t * ctrl.y + t * t * next.y,
              u * u * pos.z + 2 * u * t * ctrl.z + t * t * next.z
            );
            positions[w]     = prev.x; positions[w + 1] = prev.y; positions[w + 2] = prev.z;
            positions[w + 3] = p.x;    positions[w + 4] = p.y;    positions[w + 5] = p.z;
            colors[w]     = col.r; colors[w + 1] = col.g; colors[w + 2] = col.b;
            colors[w + 3] = col.r; colors[w + 4] = col.g; colors[w + 5] = col.b;
            w += 6;
            const rXZ = Math.hypot(p.x, p.z);
            if (rXZ > maxXZ) maxXZ = rXZ;
            const aY = Math.abs(p.y);
            if (aY > maxY) maxY = aY;
            prev.copy(p);
          }
          pos.copy(next);
        } else if (symbol === 'f') {
          pos.addScaledVector(H, params.effectiveStep);
        } else if (symbol === '+') {
          turn(yawRad, pitchRad);
          yawDeg += params.effectiveAngle;
        } else if (symbol === '-') {
          turn(-yawRad, -pitchRad);
          yawDeg -= params.effectiveAngle;
        } else if (symbol === '[') {
          stack.push({
            pos: pos.clone(), H: H.clone(), U: U.clone(), L: L.clone(), yawDeg: yawDeg
          });
        } else if (symbol === ']') {
          const s = stack.pop();
          if (s) { pos.copy(s.pos); H.copy(s.H); U.copy(s.U); L.copy(s.L); yawDeg = s.yawDeg; }
        } else if (symbol === '|') {
          turn(Math.PI, 0);
          yawDeg += 180;
        }
      }

      // `w` can fall short of the buffer if the sequence held fewer F's than
      // counted — it cannot, but a short buffer would draw a line to the
      // origin, so the arrays are trimmed rather than trusted.
      return {
        positions: w === positions.length ? positions : positions.subarray(0, w),
        colors:    w === colors.length    ? colors    : colors.subarray(0, w),
        maxXZ:     maxXZ,
        maxY:      maxY
      };
    }

    function applySymmetry(n) {
      if (!group || !geometry) return;
      while (group.children.length > n) group.remove(group.children[group.children.length - 1]);
      // ONE geometry, N objects. This is why the 3D version can afford
      // symmetry at all: the 2D module stamps a rasterised bitmap N times, and
      // the honest equivalent here would be N copies of a quarter of a million
      // segments. Sharing the buffer makes the Nth copy a matrix and a draw
      // call. Nothing is ever disposed from a child, because they all point at
      // the same buffer — render() disposes it, once.
      while (group.children.length < n) group.add(new THREE.LineSegments(geometry, material));
      const sector = (2 * Math.PI) / n;
      group.children.forEach((child, i) => {
        child.geometry = geometry;
        child.material = material;
        // About Y — the axis perpendicular to the base plane, which is the
        // same axis the 2D module rotates about when it spins the offscreen
        // canvas around its centre.
        child.rotation.set(0, i * sector, 0);
      });
    }

    function draw() {
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    function announce() {
      // RULE 7: on a human action, never on a script push. render() is reached
      // both ways, so fromDrift is the label that lets BD forward a real
      // parameter change to a viewer while declining the drift timer's own
      // angle steps, which the viewer is computing for itself.
      try { postToParent({ type: 'bd_av_state', text: storedText, fromDrift: renderingFromDrift }); } catch (_) {}
    }

    // ── Render ────────────────────────────────────────────────────────────
    function render(nodeText) {
      try {
        setStatus('Rendering…');
        storedText = nodeText;
        // The script says which controls it wants. Done before the draw so the
        // column is right by the time anything is on screen.
        try { applyControlVisibility(parseBD(nodeText).__marked); } catch (_) {}
        announce();

        if (typeof nodeText !== 'string') {
          console.error('visual_module3d: render() expected text string, got:', nodeText);
          throw new Error('No valid text provided in BD_INIT payload');
        }
        if (!HAVE_THREE)   throw new Error('three.js did not load from the CDN');
        if (!HAVE_LSYSTEM) throw new Error('lindenmayer did not load from the CDN');

        const directives = parseBD(nodeText);
        const scoreRaw = directives.score;
        if (!scoreRaw) throw new Error('No score found in node text');
        const score = parseScore(scoreRaw);
        if (!score.axiom) throw new Error('No axiom found in score');

        // A script that names the distance is authority, and the module stops
        // framing for itself from then on.
        if (directives.cam_distance !== undefined) camDistanceExplicit = true;

        const params = {
          symmetry:    Math.min(Math.max(safeParseInt(directives.symmetry, 8), 1), 16),
          depth:       Math.min(Math.max(safeParseInt(directives.depth, 2), 1), 5),
          step:        clampStep(safeParseNumber(directives.step, 50)),
          angle:       Math.min(Math.max(safeParseNumber(directives.angle, 90), ANGLE_MIN), ANGLE_MAX),
          pitch:       Math.min(Math.max(safeParseNumber(directives.pitch, 0), ANGLE_MIN), ANGLE_MAX),
          background:  directives.background || '#0a0a0f',
          // Read but not controlled — see LINE_WIDTH_IS_NOT_AVAILABLE.
          weight:      Math.min(Math.max(safeParseNumber(directives.weight, 1.5), 0.5), 5),
          saturation:  Math.min(Math.max(safeParseNumber(directives.saturation, 100), 0), 100),
          lightness:   Math.min(Math.max(safeParseNumber(directives.lightness, 65), 0), 100),
          opacity:     Math.min(Math.max(safeParseNumber(directives.opacity, 1), 0), 1),
          colourSpeed: Math.min(Math.max(safeParseNumber(directives.colour_speed, 4), 0.25), 16)
        };
        if (!Number.isFinite(params.colourSpeed) || params.colourSpeed <= 0) params.colourSpeed = 4;

        // Minutes come from the script; seconds are read LIVE from the hidden
        // input so drift moves the picture every tick and not only when the
        // arcminute carries.
        params.effectiveAngle = params.angle
          + (safeParseNumber(directives.angle_minutes, 0) / 60)
          + (safeParseNumber(angleSecondsSlider.value, 0) / 3600);
        params.effectivePitch = params.pitch
          + (safeParseNumber(directives.pitch_minutes, 0) / 60)
          + (safeParseNumber(pitchSecondsSlider.value, 0) / 3600);
        params.effectiveStep = params.step / Math.pow(3, Math.max(0, params.depth - 1));

        initThree();
        updateCanvasSize();
        // ── %%bd_background transparent (2026-10-08) ──────────────────
        // The canvas becomes genuinely see-through so a HOST can put something
        // BEHIND the figure — which is what a collage wants when the words go
        // underneath the kolam rather than over it.
        //
        // FOUR backgrounds are stacked here and all four have to yield, which
        // is the same shape as the three-site relay trap: three.js's clear
        // colour, this document's body, the wrapper document's html+body, and
        // BD's own #visual-iframe. Any one of them left opaque hides whatever
        // is behind, and nothing reports it — the figure simply sits on black.
        // The other three are handled where they live; this is the first.
        if (BD_TRANSPARENT_BG.test(String(params.background).trim())) {
          scene.background = null;
          renderer.setClearAlpha(0);
          document.body.classList.add('transparent-bg');
        } else {
          scene.background = new THREE.Color(params.background);
          renderer.setClearAlpha(1);
          document.body.classList.remove('transparent-bg');
        }
        material.linewidth = params.weight;

        const lsystem = new LSystem({ axiom: score.axiom, productions: score.productions });
        lsystem.iterate(params.depth);
        const seq = lsystem.getString();
        if (!seq) throw new Error('L-system produced no output');

        setControlValues(directives);

        const built = buildTurtle(seq, params);
        // Dispose BEFORE dropping the reference. A BufferGeometry holds GPU
        // buffers that the garbage collector cannot reach, so a module left
        // drifting for an hour at five renders a second would leak all of it.
        if (geometry) geometry.dispose();
        geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(built.positions, 3));
        geometry.setAttribute('color',    new THREE.BufferAttribute(built.colors, 3));
        haveGeometry = true;
        applySymmetry(params.symmetry);

        applyPitchScale();
        applyOpacity();

        if (!camDistanceExplicit) {
          // An upper bound on the scaled figure's radius, which is what
          // framing wants — the two extrema need not occur at the same point,
          // so this never frames too tightly.
          camDistanceSlider.value = String(fitDistance(
            Math.hypot(built.maxXZ, built.maxY * pitchScale())));
          updateValueDisplays();
          // Deliberately NOT announced and NOT written into storedText. An
          // auto-fit is not a human action, and announcing on a script push is
          // what once took the graph down in a 421/430-character loop. The
          // value enters the script the first time a person moves any control,
          // which is when applyControlDirectives next runs.
        }
        placeCamera();
        draw();

        setStatus('');
        lastError = null;

      } catch (err) {
        lastError = err.message;
        setStatus(`Error: ${err.message}`);
        postToParent({ type: 'BD_ERROR', payload: { message: err.message } });
        console.error('render error:', err);
      }
    }

    // ── Waiting state (A42 §42.4) ─────────────────────────────────────────
    let waitingForFirstScript = true;

    function disableControls() {
      document.querySelectorAll('.control-panel input, .control-panel select, .control-panel .step-btn')
        .forEach(el => { el.disabled = true; });
    }
    function enableControls() {
      document.querySelectorAll('.control-panel input, .control-panel select, .control-panel .step-btn')
        .forEach(el => { el.disabled = false; });
    }

    function showWaitingState() {
      if (!waitingForFirstScript) return;
      initThree();
      updateCanvasSize();
      draw();                       // paints the background, nothing else
      showWaiting('Waiting for script…', false);
      // Same diagnostic as the 2D module: it tells us whether the wrapper
      // (layout) or the canvas (JS sizing) is the constraint, which is how the
      // "canvas only 40% of iframe depth" bug was found.
      setStatus(`Waiting… body ${document.body.clientWidth}×${document.body.clientHeight}` +
                `  wrap ${canvasWrapper.clientWidth}×${canvasWrapper.clientHeight}` +
                `  canvas ${canvas.width}×${canvas.height}`);
    }

    function renderFromScript(scriptText) {
      if (waitingForFirstScript) {
        waitingForFirstScript = false;
        hideWaiting();
        enableControls();
      }
      // Only script ARRIVALS are logged, never the drift timer's renders —
      // those fire five to ten times a second and would drown the log.
      try {
        const d = parseBD(scriptText);
        const keys = Object.keys(d);
        console.log('[module3d] script in: ' + scriptText.length + ' chars, ' +
          keys.length + ' directives' +
          (keys.length
            ? ' {' + keys.map(k => k + '=' + String(d[k]).slice(0, 24)).join(' ') + '}'
            : '  <-- NONE PARSED; every value will be a default'));
      } catch (err) {
        console.error('[module3d] could not parse the incoming script: ' + err.message);
      }
      render(scriptText);
    }

    // ── Boot ──────────────────────────────────────────────────────────────
    disableControls();
    updateValueDisplays();

    if (!HAVE_THREE || !HAVE_LSYSTEM) {
      // A dead module must not look like a slow one.
      const missing = [!HAVE_THREE && 'three.js', !HAVE_LSYSTEM && 'lindenmayer']
        .filter(Boolean).join(' and ');
      showWaiting('Cannot draw: ' + missing + ' did not load.\nCheck the connection and reload.', true);
      setStatus('Error: ' + missing + ' missing');
      console.error('[module3d] ' + missing + ' did not load — the module cannot render');
      try { postToParent({ type: 'BD_ERROR', payload: { message: missing + ' did not load from the CDN' } }); } catch (_) {}
    } else {
      // Deferred until layout has flushed, or the wrapper's clientWidth can
      // still be 0 and the canvas lands at its default size.
      requestAnimationFrame(() => requestAnimationFrame(showWaitingState));
    }

    // A resize needs no new geometry — it is in WORLD space, not canvas space,
    // which the 2D module cannot say (its turtle starts at canvas.width / 2, so
    // every resize there is a full re-render). Here it is a viewport and a
    // projection matrix.
    if (typeof ResizeObserver === 'function') {
      const ro = new ResizeObserver(() => {
        if (waitingForFirstScript) { showWaitingState(); return; }
        updateCanvasSize();
        placeCamera();
        draw();
      });
      ro.observe(canvasWrapper);
    }
    window.addEventListener('resize', () => {
      if (waitingForFirstScript) { showWaitingState(); return; }
      updateCanvasSize();
      placeCamera();
      draw();
    });

    // ── Message Handlers ──────────────────────────────────────────────────
    // A42 protocol names are bd_script_*. Legacy BD_INIT / BD_REQUEST_UPDATE
    // kept as aliases so the reference harness still works.
    window.addEventListener('message', (event) => {
      try {
        const { type, payload, script } = event.data;
        switch (type) {
          case 'bd_script_update': {
            renderFromScript(typeof script === 'string' ? script : '');
            break;
          }
          case 'bd_script_request': {
            window.parent.postMessage({ type: 'bd_script_response', script: storedText }, '*');
            break;
          }

          case 'BD_INIT': {
            const rawText = payload && payload.text;
            renderFromScript(typeof rawText === 'string' ? rawText : rawText == null ? '' : String(rawText));
            break;
          }
          case 'BD_STOP':
            if (driftInterval !== null) { clearTimeout(driftInterval); driftInterval = null; }
            if (camSpinTimer !== null) { clearTimeout(camSpinTimer); camSpinTimer = null; }
            camElevationExact = null;
            if (group) { while (group.children.length) group.remove(group.children[0]); }
            draw();
            setStatus('Stopped');
            break;
          case 'BD_REQUEST_UPDATE':
            postToParent({ type: 'BD_UPDATE', payload: { text: storedText } });
            break;

          // The host supplies an outer control surface, so hide ours. The
          // renderer and the canvas stay fully functional — this is what an
          // AV/AVX viewer sends, and the reason a viewer has no steppers.
          case 'bd_ui_config': {
            // ── outputOnly (2026-10-08) — "show only your output" ─────────
            // The fourth flag and the strongest: the host is PRESENTING this
            // module, so none of its own furniture belongs on screen. BD's
            // View uses it and the collage will use the same one — which is
            // the point: View rehearses the collage's contract while there is
            // only one slot to get wrong.
            //
            // It IMPLIES hideControls and hostChrome:false rather than sitting
            // beside them. Each flag still asserts ONE thing; this one asserts
            // "only the output", which entails the others.
            const outputOnly = !!(event.data && event.data.outputOnly === true);
            const hide = outputOnly || !!(event.data && event.data.hideControls === true);
            document.body.classList.toggle('output-only', outputOnly);
            document.body.classList.toggle('controls-hidden', hide);
            // hostChrome: does the host draw anything AROUND this iframe? BD
            // does — arrows beside the stepper column, an Extension strip under
            // the canvas — so the layout reserves 88px and 52px for them. A
            // standalone draws neither, and that reserve is then simply lost
            // picture. DEFAULTS TO TRUE, so a host that says nothing keeps BD's
            // behaviour and nothing already working changes.
            const chrome = !(event.data && event.data.hostChrome === false);
            document.body.classList.toggle('no-host-chrome', hide || !chrome);
            updateCanvasSize();
            placeCamera();
            draw();
            break;
          }

          // MM2 (2026-07-11) — set a single directive without rewriting the
          // whole script. Writes the hidden input and dispatches 'input', so
          // the normal handleControlChange path runs unchanged.
          //
          // Names map to input ids by convention: pitch_drift →
          // #pitch-drift-slider, cam_azimuth → #cam-azimuth-slider. The
          // `-select` fallback is new here: symmetry and depth are the two
          // controls whose ids end -select, and in the 2D module
          // bd_param_update silently cannot reach either.
          case 'bd_param_update': {
            const name  = event.data && event.data.name;
            const value = event.data && event.data.value;
            if (typeof name !== 'string') break;
            const kebab = name.replace(/_/g, '-');
            const input = document.getElementById(kebab + '-slider')
                       || document.getElementById(kebab + '-select')
                       || document.getElementById(name);
            if (input) {
              input.value = String(value);
              input.dispatchEvent(new Event('input', { bubbles: true }));
            }
            break;
          }

          default:
            break;
        }
