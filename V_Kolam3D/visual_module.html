  </div>

  <!-- Both libraries come from a CDN, and that is a deliberate choice, not a
       convenience: BD is served from this machine through a Cloudflare tunnel,
       so every byte we host is a byte over that tunnel. three.js is ~600 KB.
       The client fetches it from jsdelivr's edge instead, and the version is
       PINNED — an unpinned "latest" would let someone else's release break a
       stored figure without a commit here.

       three.min.js at 0.160.0 is the UMD build: it defines window.THREE and
       needs no import map, which is why the pin is that file and not
       three.module.js. VERIFIED 2026-09-27: HTTP/2 200 and a UMD preamble.

       A CDN that does not answer is handled explicitly further down — the
       module says so on screen rather than showing an empty square. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lindenmayer/dist/lindenmayer.browser.js"></script>

  <script>
    'use strict';

    // ── The renderer must not be blind ───────────────────────────────────
    // Installed FIRST, before anything that can throw. In the 2D module this
    // block sits at the bottom, which is fine there because nothing above it
    // can fail; here the two CDN scripts can, and a module that cannot say
    // "three.js never arrived" is a black square with no explanation.
    const postToParent = (message) => { window.parent.postMessage(message, '*'); };
    (function forwardModuleConsole() {
      const send = (level, args) => {
        try {
          const line = Array.prototype.map.call(args, (a) => {
            if (typeof a === 'string') return a;
            // An Error JSON.stringifies to "{}" — message and stack are
            // non-enumerable. 506 lines of "render error: {}" is how that was
            // learned in the 2D module.
            if (a instanceof Error) return a.message + (a.stack ? ' | ' + a.stack.split('\n')[1] : '');
            try { return JSON.stringify(a); } catch (_) { return String(a); }
          }).join(' ');
          postToParent({ type: 'bd_module_log', level: level, line: line.slice(0, 600) });
        } catch (_) {}
      };
      ['log', 'warn', 'error'].forEach((level) => {
        const original = console[level].bind(console);
        console[level] = function () { send(level, arguments); original.apply(console, arguments); };
      });
      window.addEventListener('error', (e) => {
        send('error', ['uncaught: ' + (e && e.message) + ' @ ' + (e && e.lineno)]);
      });
      window.addEventListener('unhandledrejection', (e) => {
        send('error', ['unhandled rejection: ' + (e && e.reason && (e.reason.message || e.reason))]);
      });
    })();

    // Did the CDN answer? Read ONCE, here, so every later check is a boolean
    // and not a fresh `typeof` that could be true in one place and false in
    // another after a slow script finally arrives.
    const HAVE_THREE   = (typeof THREE   !== 'undefined');
    const HAVE_LSYSTEM = (typeof LSystem !== 'undefined');

    // ── Element refs ──────────────────────────────────────────────────────
    const statusEl       = document.getElementById('status');
    const waitingEl      = document.getElementById('waiting');
    const symmetrySelect = document.getElementById('symmetry-select');
    const depthSelect    = document.getElementById('depth-select');
    const stepSlider     = document.getElementById('step-slider');
    // ONE ceiling per control, read from the input's own max attribute — the
    // 2D module's lesson, where the attribute was raised to 9900 and two
    // hard-coded 999s pulled every render back.
    const STEP_MIN = parseFloat(stepSlider.min) || 0.01;
    const STEP_MAX = parseFloat(stepSlider.max) || 200;
    const clampStep = (v) => Math.min(Math.max(v, STEP_MIN), STEP_MAX);

    const stretchSlider = document.getElementById('stretch-slider');
    const STRETCH_MIN = parseFloat(stretchSlider.min) || 0;
    const STRETCH_MAX = parseFloat(stretchSlider.max) || 4;
    const clampStretch = (v) => Math.min(Math.max(v, STRETCH_MIN), STRETCH_MAX);

    // Paired, in the order the column shows them: every quantity beside its
    // counterpart in the other plane.
    const angleSlider        = document.getElementById('angle-slider');
    const pitchSlider        = document.getElementById('pitch-slider');
    const angleMinutesSlider = document.getElementById('angle-minutes-slider');
    const pitchMinutesSlider = document.getElementById('pitch-minutes-slider');
    const angleSecondsSlider = document.getElementById('angle-seconds-slider');
    const pitchSecondsSlider = document.getElementById('pitch-seconds-slider');
    const angleDriftSlider   = document.getElementById('angle-drift-slider');
    const pitchDriftSlider   = document.getElementById('pitch-drift-slider');

    const camAzimuthSlider   = document.getElementById('cam-azimuth-slider');
    const camAzimuthMinutesSlider   = document.getElementById('cam-azimuth-minutes-slider');
    const camElevationMinutesSlider = document.getElementById('cam-elevation-minutes-slider');
    const camElevationSlider = document.getElementById('cam-elevation-slider');
    const camElevationSpeedSlider = document.getElementById('cam-elevation-speed-slider');
    // Elevation is a full turn like the others, but centred on 0 rather than
    // starting there, so it wraps into [-180, 180) and not [0, 360).
    const ELEV_MIN = parseFloat(camElevationSlider.min) || -180;
    function wrapElevation(deg) {
      return ELEV_MIN + ((((deg - ELEV_MIN) % 360) + 360) % 360);
    }
    const camRollSlider      = document.getElementById('cam-roll-slider');
    const camRollSpeedSlider = document.getElementById('cam-roll-speed-slider');
    const camAxisSlider      = document.getElementById('cam-axis-slider');
    const camDistanceSlider  = document.getElementById('cam-distance-slider');
    const camDistanceSpeedSlider = document.getElementById('cam-distance-speed-slider');
    const CAM_DIST_MIN = parseFloat(camDistanceSlider.min) || 20;
    const CAM_DIST_MAX = parseFloat(camDistanceSlider.max) || 9900;
    const clampCam = (v) => Math.min(Math.max(v, CAM_DIST_MIN), CAM_DIST_MAX);

    const colourSpeedSlider = document.getElementById('colour-speed-slider');
    const saturationSlider  = document.getElementById('saturation-slider');
    const lightnessSlider   = document.getElementById('lightness-slider');
    const opacitySlider     = document.getElementById('opacity-slider');

    const canvas         = document.getElementById('kolam-canvas');
    const canvasWrapper  = document.querySelector('.canvas-wrapper');
    const controlPanel   = document.querySelector('.control-panel');
    const moduleLayout   = document.querySelector('.module-layout');

    // ── Angles ────────────────────────────────────────────────────────────
    // [0, 360): a full turn. 360 is never STORED, because 360 and 0 are the
    // same figure and one picture must not have two spellings. Shared by
    // angle, pitch and cam_azimuth — all three are bearings.
    const ANGLE_MIN  = 0;
    const ANGLE_MAX  = 360;            // exclusive — the wrap point, not a value
    const ANGLE_SPAN = ANGLE_MAX - ANGLE_MIN;
    function wrapAngle(deg) {
      return ANGLE_MIN + ((((deg - ANGLE_MIN) % ANGLE_SPAN) + ANGLE_SPAN) % ANGLE_SPAN);
    }
    const DEG = Math.PI / 180;

    // ── Module state ──────────────────────────────────────────────────────
    let storedText    = '';
    let lastError     = null;
    let driftInterval = null;
    let renderingFromDrift = false;
    // Has anything AUTHORITATIVE set the camera distance — a script directive,
    // or a person's finger? Until it has, the module frames the figure itself,
    // because a 3D scene whose camera is inside the geometry shows literally
    // nothing, and "nothing" is the worst first impression a new module can
    // make. MEASURED: the four stored Kolam settings have radii from 97 to
    // 1362 world units, so no single default can serve them.
    let camDistanceExplicit = false;
    let haveGeometry = false;

    // ── Auto-rotate state ─────────────────────────────────────────────────
    // camElevationExact is the SMOOTH elevation, a float, live only while the
    // spin is running. The script records whole degrees — 20 script rewrites a
    // second for a number read back to half a degree would be noise on the wire
    // — so the drawing follows the float and the record follows the integer,
    // exactly as angle_seconds already does against angle_minutes.
    const CAM_SPIN_MS  = 50;    // 20 a second; a camera move costs no geometry
    const CAM_WRITE_MS = 200;   // how often the script is rewritten + announced
    let camSpinTimer      = null;
    let camSpinNextDue    = 0;
    let camSpinLastWrite  = 0;
    let camElevationExact = null;   // null = follow the slider
    let camElevationWritten = null; // the integer this module last put in the script
    let camDistanceExact   = null;  // null = follow the slider
    let camDistanceWritten = null;  // the integer this module last put in the script
    let camRollExact       = null;  // null = follow the slider
    let camRollWritten     = null;  // the integer this module last put in the script
    // Latched, because `arrived` is true on EVERY tick once the distance is
    // pinned. While the arrival also stopped the clock that did not matter;
    // the moment the roll could keep the clock running it became the
    // difference between saying so once and saying so twenty times a second.
    let camDistanceArrived = false;

    const setStatus = (msg) => { statusEl.textContent = msg; };

    function showWaiting(msg, fatal) {
      if (!waitingEl) return;
      waitingEl.textContent = msg;
      waitingEl.classList.toggle('fatal', !!fatal);
      waitingEl.hidden = false;
    }
    function hideWaiting() {
      if (!waitingEl) return;
      waitingEl.hidden = true;
      waitingEl.classList.remove('fatal');
    }

    function alignStepperTop() {
      if (!controlPanel || !moduleLayout) return;
      if (window.innerWidth > 500) { controlPanel.style.marginTop = ''; return; }
      const offset = Math.max(0, Math.round(
        canvas.getBoundingClientRect().top - moduleLayout.getBoundingClientRect().top
      ));
      controlPanel.style.marginTop = offset + 'px';
    }

    // ── %%bd_ Parser ──────────────────────────────────────────────────────
    // Identical to the 2D module's, and it has to stay that way: the same
    // script travels between them. %%bd_p_<name> marks a directive as wanting
    // a control; the mark is PRESENTATION ONLY, so it is stripped here and the
    // bare name is the key. Which names carried one is remembered on a
    // non-enumerable property so everything that walks the directives is
    // unaffected.
    const BD_MARK = 'p_';
    function parseBD(text) {
      const directives = {};
      const marked = new Set();
      const lines = text.split('\n');
      let state = 'text';
      let currentDirective = null;
      let currentLines = [];

      for (const line of lines) {
        if (state === 'text') {
          if (line.startsWith('%%bd_')) {
            const spaceIdx = line.indexOf(' ');
            if (spaceIdx === -1) continue;
            let name = line.slice(5, spaceIdx);
            if (name.startsWith(BD_MARK)) {
              name = name.slice(BD_MARK.length);
              marked.add(name);
            }
            const value = line.slice(spaceIdx + 1).trim();
            if (value === '[') {
              currentDirective = name;
              currentLines = [];
              state = 'bracket';
            } else {
              directives[name] = value;
            }
          }
        } else if (state === 'bracket') {
          if (line.trim() === '%%bd_]') {
            directives[currentDirective] = currentLines.join('\n');
            state = 'text';
          } else {
            currentLines.push(line);
          }
        }
      }
      Object.defineProperty(directives, '__marked', { value: marked, enumerable: false });
      return directives;
    }

    function parseScore(scoreText) {
      const result = { axiom: '', productions: {} };
      for (const line of scoreText.split('\n')) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;
        if (trimmed.startsWith('axiom:')) {
          result.axiom = trimmed.slice(6).trim();
        } else {
          const colonIdx = trimmed.indexOf(':');
          if (colonIdx !== -1) {
            result.productions[trimmed.slice(0, colonIdx).trim()] = trimmed.slice(colonIdx + 1).trim();
          }
        }
      }
      return result;
    }

    function safeParseNumber(value, fallback) {
      const n = parseFloat(value);
      return Number.isFinite(n) ? n : fallback;
    }
    function safeParseInt(value, fallback) {
      const n = parseInt(value, 10);
      return Number.isFinite(n) ? n : fallback;
    }
    function formatDirectiveNumber(value) {
      if (!Number.isFinite(value)) return String(value);
      return (Math.round(value * 100) / 100).toString();
    }

    function setControlValues(directives) {
      if (!symmetrySelect) return;
      symmetrySelect.value = String(Math.min(Math.max(safeParseInt(directives.symmetry, 8), 1), 16));
      depthSelect.value    = String(Math.min(Math.max(safeParseInt(directives.depth, 2), 1), 5));
      stepSlider.value     = String(clampStep(safeParseNumber(directives.step, 1)));
      // Defaults to `step`, not to a number of its own. A script that has
      // never heard of step_pitch — a 2D Kolam script, or anything written
      // before today — then renders ISOTROPICALLY, which is the only default
      // that cannot change a stored figure.
      // %%bd_stretch wins. Failing that, a legacy %%bd_step_pitch is converted
      // by the division it used to carry — so a script written before
      // 2026-10-19 loads to exactly the figure it always drew. Failing both,
      // 1: isotropic, which is what step_pitch defaulting to `step` meant.
      if (directives.stretch !== undefined) {
        stretchSlider.value = String(clampStretch(safeParseNumber(directives.stretch, 1)));
      } else if (directives.step_pitch !== undefined) {
        const st = safeParseNumber(directives.step, safeParseNumber(stepSlider.value, 1));
        const sp = safeParseNumber(directives.step_pitch, st);
        stretchSlider.value = String(clampStretch(st > 0 ? sp / st : 1));
      } else {
        stretchSlider.value = '1';
      }

      angleSlider.value        = String(Math.min(Math.max(safeParseNumber(directives.angle, 90), ANGLE_MIN), ANGLE_MAX));
      // Falls back to 0, while the MARKUP initialises the stepper to 1. The
      // two differ on purpose — see the note on the pitch input. A script that
      // never mentions pitch was written for the flat module and renders flat.
      pitchSlider.value        = String(Math.min(Math.max(safeParseNumber(directives.pitch, 0), ANGLE_MIN), ANGLE_MAX));

      angleMinutesSlider.value = String(Math.min(Math.max(safeParseNumber(directives.angle_minutes, 0), 0), 59));
      pitchMinutesSlider.value = String(Math.min(Math.max(safeParseNumber(directives.pitch_minutes, 0), 0), 59));

      // angle_seconds / pitch_seconds are internal-only: sub-arcminute drift
      // accumulators that are never written to the script. Only touch them if
      // a directive explicitly supplied one, or the running total is lost on
      // every render and the drift stutters back to a whole arcminute.
      if (directives.angle_seconds !== undefined) {
        angleSecondsSlider.value = String(Math.min(Math.max(safeParseNumber(directives.angle_seconds, 0), 0), 59));
      }
      if (directives.pitch_seconds !== undefined) {
        pitchSecondsSlider.value = String(Math.min(Math.max(safeParseNumber(directives.pitch_seconds, 0), 0), 59));
      }

      angleDriftSlider.value = String(Math.min(Math.max(safeParseInt(directives.angle_drift, 0), 0), 100));
      pitchDriftSlider.value = String(Math.min(Math.max(safeParseInt(directives.pitch_drift, 0), 0), 100));

      camAzimuthSlider.value   = String(wrapAngle(safeParseNumber(directives.cam_azimuth, 0)));
      camElevationSlider.value = String(wrapElevation(safeParseNumber(directives.cam_elevation, 60)));
      // If the script's elevation is NOT the integer this module last wrote,
      // something outside the spin moved it — a push from BD, or a hand on the
      // stepper — so the smooth accumulator must follow it rather than carry on
      // from its own running total. Without this guard the angle-drift render,
      // which reaches setControlValues five times a second, would reseed the
      // float from a rounded degree on every frame and quantise the rotation.
      if (camElevationWritten === null ||
          safeParseNumber(directives.cam_elevation, NaN) !== camElevationWritten) {
        camElevationExact = null;
      }
      camAzimuthMinutesSlider.value = String(Math.min(Math.max(
        safeParseNumber(directives.cam_azimuth_minutes, 0), 0), 59));
      camElevationMinutesSlider.value = String(Math.min(Math.max(
        safeParseNumber(directives.cam_elevation_minutes, 0), 0), 59));
      camElevationSpeedSlider.value = String(Math.min(Math.max(
        safeParseNumber(directives.cam_elevation_speed, 0), 0), 60));
      camRollSlider.value = String(wrapAngle(safeParseNumber(directives.cam_roll, 0)));
      camRollSpeedSlider.value = String(Math.min(Math.max(
        safeParseNumber(directives.cam_roll_speed, 0), -60), 60));
      // The roll's accumulator, on the same terms as the elevation's: a script
      // naming a different roll is the authority, and the running total goes.
      if (camRollWritten === null ||
          safeParseNumber(directives.cam_roll, NaN) !== camRollWritten) {
        camRollExact = null;
      }
      // Guarded, unlike every other control above. An unguarded default here
      // would overwrite the auto-framed distance on EVERY render, so the first
      // stepper press would snap the camera back and the auto-fit would look
      // like a bug rather than a default.
      // Clamped to the SLIDER's 16 and not to the current symmetry: a script
      // may legitimately name arm 12 while symmetry is being swept down and
      // back up, and silently rewriting it to 6 on the way through would lose
      // the author's number. aimAlongArm clamps to the live symmetry at the
      // moment it aims, which is the only moment the number has to be real.
      camAxisSlider.value = String(Math.min(Math.max(safeParseInt(directives.cam_axis, 0), 0), 16));
      if (directives.cam_distance !== undefined) {
        camDistanceSlider.value = String(clampCam(safeParseNumber(directives.cam_distance, 260)));
        // Signed, so clamped on both sides rather than at zero.
        camDistanceSpeedSlider.value = String(Math.min(Math.max(
          safeParseNumber(directives.cam_distance_speed, 0), -300), 300));
      }

      manageDriftInterval();
      manageCamSpin();

      const colourSpeedValueParsed = Math.min(Math.max(safeParseNumber(directives.colour_speed, 4), 0.25), 16);
      colourSpeedSlider.value = String(Math.min(Math.max(Math.round(Math.log2(colourSpeedValueParsed)), -2), 4));
      saturationSlider.value  = String(Math.min(Math.max(safeParseNumber(directives.saturation, 100), 0), 100));
      lightnessSlider.value   = String(Math.min(Math.max(safeParseNumber(directives.lightness, 65), 0), 100));
      // Falls back to 1 — fully opaque — so a script that has never heard of
      // opacity renders exactly as it did before the control existed.
      opacitySlider.value     = String(Math.min(Math.max(safeParseNumber(directives.opacity, 1), 0), 1));

      updateValueDisplays();
    }

    function updateValueDisplays() {
      document.querySelectorAll('.stepper-value').forEach((span) => {
        const targetId = span.dataset.target;
        const input = targetId && document.getElementById(targetId);
        if (!input) return;
        if (targetId === 'opacity-slider' || targetId === 'stretch-slider') {
          // ".05" and ".5" rather than "0.05" and "0.5" — the same number
          // written shorter, which is RULE 8 (abbreviate, never translate) and
          // the same trade the colour readout makes below. MEASURED there: the
          // span holds three Courier characters at 0.7rem, and a fourth
          // shrinks the text rather than widening the column. 1 stays "1".
          const n = parseFloat(input.value);
          span.textContent = Number.isFinite(n)
            ? String(Math.round(n * 100) / 100).replace(/^0\./, '.')
            : input.value;
        } else if (targetId === 'colour-speed-slider') {
          // The hidden input holds the EXPONENT (-2..4); %%bd_colour_speed
          // holds 2^exponent. Showing the directive's own number keeps the
          // readout, the label and the script saying the same thing. The
          // leading zero goes for width only (".25" is the same number as
          // "0.25"), which is RULE 8: abbreviate, never translate.
          const exp = parseFloat(input.value);
          span.textContent = Number.isFinite(exp)
            ? formatDirectiveNumber(2 ** exp).replace(/^0\./, '.')
            : input.value;
        } else {
          // 1000 and above read as 1.0k … 9.9k, and 10000 and above drop the
          // decimal: 10k … 99k. step and cam_distance both reach the first,
          // cam_distance alone the second, and the decimal has to go there or
          // "99.0k" is five characters in a column measured for three.
          // Nothing parses these spans back (the steppers read the hidden
          // input), so the abbreviation has no inverse to keep in step.
          const n = parseFloat(input.value);
          span.textContent = !Number.isFinite(n) ? input.value
            : n >= 10000 ? Math.round(n / 1000) + 'k'
            : n >= 1000  ? (n / 1000).toFixed(1) + 'k'
            : input.value;
        }
        span.classList.toggle('stepper-value--wide', span.textContent.length > 3);
      });
    }

    // RULE 1: the writer reconstructs the form it read. A script carrying
    // %%bd_p_pitch must come back carrying %%bd_p_pitch — building the plain
    // form from the stripped name is what once inserted a SECOND unmarked copy
    // of a directive below the marked one.
    function setDirectiveValue(nodeText, name, value) {
      const lines  = nodeText.split('\n');
      const plain  = `%%bd_${name}`;
      const marked = `%%bd_${BD_MARK}${name}`;
      let replaced = false;
      const updated = lines.map((line) => {
        // Marked first: `%%bd_p_angle ` also starts with `%%bd_p_angle`, but
        // `%%bd_angle ` does not, so this order is unambiguous.
        if (line.startsWith(`${marked} `)) { replaced = true; return `${marked} ${value}`; }
        if (line.startsWith(`${plain} `))  { replaced = true; return `${plain} ${value}`;  }
        return line;
      });
      if (!replaced) {
        const insertAt = updated.findIndex((line) => line.trim() === '%%bd_score [');
        // Added UNMARKED. Offering a control the author never asked for would
        // be a presentation decision taken by a value update, which is the
        // thing RULE 1 exists to stop.
        updated.splice(insertAt === -1 ? updated.length : insertAt, 0, `${plain} ${value}`);
      }
      return updated.join('\n');
    }

    function applyControlDirectives(nodeText) {
      let text = nodeText;
      const controlValues = {
        symmetry:      symmetrySelect.value,
        depth:         depthSelect.value,
        step:          stepSlider.value,
        // %%bd_step_pitch is NOT written. A legacy line is left where it is and
        // ignored, exactly as %%bd_weight is — deleting an author's directive
        // is not a value update's business.
        stretch:       stretchSlider.value,
        angle:         angleSlider.value,
        pitch:         pitchSlider.value,
        angle_minutes: angleMinutesSlider.value,
        pitch_minutes: pitchMinutesSlider.value,
        angle_drift:   angleDriftSlider.value,
        pitch_drift:   pitchDriftSlider.value,
        cam_azimuth:   camAzimuthSlider.value,
        cam_elevation: camElevationSlider.value,
        cam_azimuth_minutes:   camAzimuthMinutesSlider.value,
        cam_elevation_minutes: camElevationMinutesSlider.value,
        cam_elevation_speed: camElevationSpeedSlider.value,
        cam_roll:       camRollSlider.value,
        cam_roll_speed: camRollSpeedSlider.value,
        cam_axis:      camAxisSlider.value,
        cam_distance:  camDistanceSlider.value,
        cam_distance_speed: camDistanceSpeedSlider.value,
        colour_speed:  formatDirectiveNumber(2 ** Number(colourSpeedSlider.value)),
        saturation:    saturationSlider.value,
        lightness:     lightnessSlider.value,
        opacity:       opacitySlider.value
        // angle_seconds / pitch_seconds: internal accumulators, never written.
        // weight: NOT written and NOT read into a control — see
        // LINE_WIDTH_IS_NOT_AVAILABLE. Never naming it here is what leaves an
        // existing %%bd_weight line untouched, so a figure keeps its stroke
        // width when it goes back to the 2D module.
      };
      for (const [name, value] of Object.entries(controlValues)) {
        text = setDirectiveValue(text, name, value);
      }
      return text;
    }

    // Controls that change no GEOMETRY, so they must not pay for any. The
    // three camera steppers move the eye; step_pitch scales the figure in y,
    // which is a transform on the object and not a different walk — see
    // applyPitchScale for why those are the same thing.
    const NO_REBUILD_INPUT_IDS = new Set([
      // `step` is NOT among them: in metres it is the walk itself, so it
      // rebuilds. That is the price of having no scale factor between the
      // turtle's units and the world's.
      'cam-azimuth-slider', 'cam-elevation-slider', 'cam-distance-slider',
      'stretch-slider', 'opacity-slider', 'cam-elevation-speed-slider',
      'cam-distance-speed-slider', 'cam-axis-slider',
      'cam-azimuth-minutes-slider', 'cam-elevation-minutes-slider',
      'cam-roll-slider', 'cam-roll-speed-slider'
    ]);

    function handleControlChange(ev) {
      const id = ev && ev.target && ev.target.id;
      // Start or stop the rotation BEFORE the script is rebuilt. Stopping hands
      // the smooth degrees back to the slider, and if that happened after
      // applyControlDirectives had already read the slider, the script would
      // keep the value from before the hand-back — the picture and the record
      // disagreeing until something else happened to write. Called from here
      // rather than from its own 'input' listener so the order is stated rather
      // than left to whichever listener was registered first.
      if (id === 'cam-elevation-speed-slider' ||
          id === 'cam-distance-speed-slider' ||
          id === 'cam-roll-speed-slider') manageCamSpin();
      // Likewise BEFORE the script is rebuilt, and for the same reason: aiming
      // writes cam_azimuth and cam_elevation, and if it ran after
      // applyControlDirectives had read those sliders the script would keep the
      // old bearing while the picture showed the new one.
      if (id === 'cam-axis-slider') aimAlongArm();
      updateValueDisplays();
      if (!storedText) return;
      const updatedText = applyControlDirectives(storedText);
      if (NO_REBUILD_INPUT_IDS.has(id) && haveGeometry) {
        // The drawing is already on the GPU; looking at it from somewhere else
        // is a matrix. Rebuilding would cost the L-system rewrite plus the
        // turtle walk — a quarter of a million segments at depth 5 — on every
        // press of an orbit button, which is the difference between a camera
        // control and a camera wish.
        storedText = updatedText;
        // applyControlDirectives has just written cam_distance into the script,
        // so the script now names it and the module stops framing for itself.
        camDistanceExplicit = true;
        announce();
        applyPitchScale();
        applyOpacity();
        if ((id === 'cam-elevation-slider' || id === 'cam-elevation-minutes-slider') &&
            camElevationExact !== null) {
          // A hand on the stepper wins: restart the smooth accumulator where
          // the finger put it, rather than let the rotation snap back to its
          // own running total on the next tick. EITHER stepper — the minutes
          // are part of the same number, and a control the clock undoes is the
          // bug this file already has one note about.
          camElevationExact = wrapElevation(elevationTotal());
        }
        if (id === 'cam-roll-slider' && camRollExact !== null) {
          // The roll's hand-win. Third of three, and written at the same time
          // as the control rather than discovered as a bug six hours later —
          // which is the only difference between this line and the note below.
          camRollExact = wrapAngle(safeParseNumber(camRollSlider.value, 0));
          camRollWritten = Math.round(camRollExact);
        }
        // THE SAME HAND-WIN FOR THE DISTANCE, which it did not have.
        //
        // 2026-10-15, reported as "the cam distance will not adjust when cam
        // speed process is active ie when flying". It adjusted perfectly: the
        // slider moved, the script recorded it, and camSpinTick overwrote it
        // from camDistanceExact fifty milliseconds later, every time. The
        // accumulator is the authority while the clock runs — placeCamera says
        // so — so a control that does not re-seed it is a control the clock
        // undoes. It was written for the elevation and not copied, which is
        // the whole fault: cam_distance_speed was built to RIDE on
        // cam_elevation_speed's clock, and inherited its clock without
        // inheriting its one concession to a hand on the wheel.
        if (id === 'cam-distance-slider' && camDistanceExact !== null) {
          camDistanceExact = clampCam(safeParseNumber(camDistanceSlider.value, 260));
          // And the written value goes with it, or manageCamSpin's hand-back
          // would think the slider still held the clock's own last number and
          // overwrite the finger's on the way out.
          camDistanceWritten = Math.round(camDistanceExact);
        }
        placeCamera();
        draw();
        return;
      }
      render(updatedText);
    }

    const controlInputs = [
      symmetrySelect, depthSelect, stepSlider, stretchSlider,
      angleSlider, pitchSlider,
      angleMinutesSlider, pitchMinutesSlider,
      angleSecondsSlider, pitchSecondsSlider,
      angleDriftSlider, pitchDriftSlider,
      camAzimuthSlider, camElevationSlider,
      camAzimuthMinutesSlider, camElevationMinutesSlider,
      camElevationSpeedSlider, camDistanceSlider,
      camDistanceSpeedSlider, camAxisSlider,
      camRollSlider, camRollSpeedSlider,
      colourSpeedSlider, saturationSlider, lightnessSlider, opacitySlider
    ];
    controlInputs.forEach((input) => { input.addEventListener('input', handleControlChange); });

    // ── Which controls a script asks for ──────────────────────────────────
    // angle_seconds and pitch_seconds have controls and deliberately NO
    // directive, so they are absent here and can never be hidden by a marking
    // decision they have no way to express.
    const CONTROL_FOR = {
      symmetry:      symmetrySelect,
      depth:         depthSelect,
      step:          stepSlider,
      stretch:       stretchSlider,
      angle:         angleSlider,
      pitch:         pitchSlider,
      angle_minutes: angleMinutesSlider,
      pitch_minutes: pitchMinutesSlider,
      angle_drift:   angleDriftSlider,
      pitch_drift:   pitchDriftSlider,
      cam_azimuth:   camAzimuthSlider,
      cam_elevation: camElevationSlider,
      cam_azimuth_minutes:   camAzimuthMinutesSlider,
      cam_elevation_minutes: camElevationMinutesSlider,
      cam_elevation_speed: camElevationSpeedSlider,
      cam_roll:       camRollSlider,
      cam_roll_speed: camRollSpeedSlider,
      cam_axis:      camAxisSlider,
      cam_distance:  camDistanceSlider,
      cam_distance_speed: camDistanceSpeedSlider,
      colour_speed:  colourSpeedSlider,
      saturation:    saturationSlider,
      lightness:     lightnessSlider,
      opacity:       opacitySlider
    };

    // RULE 2: a script with NO mark anywhere keeps every control shown, so
    // nothing already written, saved or shared changes. Once a script marks
    // anything it is taken to mean what it says.
    function applyControlVisibility(marked) {
      const anyMarked = marked && marked.size > 0;
      for (const [name, input] of Object.entries(CONTROL_FOR)) {
        const row = input.closest('.control-row');
        if (!row) continue;
        row.hidden = anyMarked && !marked.has(name);
      }
    }

    // ── Stepper (+/−) buttons ─────────────────────────────────────────────
    // Verbatim from the 2D module: the hidden source input owns min/max/step,
    // the buttons read those attributes, clamp, and dispatch a native 'input'
    // event so handleControlChange fires unchanged.
    function tapStep(input, cur, delta) {
      const step   = parseFloat(input.step) || 1;
      const above  = parseFloat(input.dataset.coarseAbove);
      const coarse = parseFloat(input.dataset.coarseStep);
      if (!Number.isFinite(above) || !Number.isFinite(coarse)) return step;
      // The boundary is crossed at FINE resolution in both directions, or
      // stepping down from 1000 would land on 900 and 999 would be a value you
      // could pass but never return to.
      const inCoarse = delta > 0 ? cur >= above : cur > above;
      return inCoarse ? coarse : step;
    }

    function stepControl(input, delta, magnitude) {
      const min  = parseFloat(input.min);
      const max  = parseFloat(input.max);
      const step = parseFloat(input.step) || 1;
      const cur  = parseFloat(input.value);
      if (!Number.isFinite(cur)) return;

      // ── PROPORTIONAL CONTROLS (2026-10-19) ──────────────────────────────
      // A PHYSICAL quantity spans decades where an integer stepper spans one
      // or two: `size` wants 2 cm to 500 m and cam_distance 2 cm to 2 km. A
      // fixed increment is either uselessly coarse at the bottom or uselessly
      // slow at the top, so these step by a fixed PERCENTAGE instead — five
      // per cent means the same thing at every scale, and four decades cross
      // in a constant number of presses.
      //
      // Only for strictly positive ranges. A signed quantity cannot step
      // proportionally through zero, which is why cam_distance_speed stays
      // linear with a fine step.
      const prop = parseFloat(input.dataset.proportional);
      if (Number.isFinite(prop) && prop > 0 && min > 0) {
        const presses = (Number.isFinite(magnitude) && magnitude > 0) ? magnitude : 1;
        let next = cur * Math.pow(1 + prop, delta * presses);
        next = Math.min(Math.max(next, min), max);
        // Three significant figures: enough to read, and it stops a long hold
        // accumulating a tail of meaningless digits.
        next = parseFloat(next.toPrecision(3));
        const strVal = String(next);
        if (input.value === strVal) return;
        input.value = strVal;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        return;
      }
      const tap  = tapStep(input, cur, delta);
      const move = Number.isFinite(magnitude) && magnitude > 0 ? magnitude : tap;
      let next = cur + delta * move;
      // data-wrap marks a CYCLIC control. angle, pitch and cam_azimuth are all
      // bearings: 360 degrees is a turn, not a ceiling. cam_elevation is NOT
      // one — see the note in the markup.
      if (input.dataset.wrap && Number.isFinite(min) && Number.isFinite(max)) {
        const span = (max - min) + step;          // max is inclusive, so 0..359 spans 360
        next = min + ((((next - min) % span) + span) % span);
      } else {
        if (Number.isFinite(min)) next = Math.max(min, next);
        if (Number.isFinite(max)) next = Math.min(max, next);
      }
      if (Number.isFinite(tap) && tap > 0) next = Math.round(next / tap) * tap;
      next = parseFloat(next.toFixed(4));
      const strVal = String(next);
      if (input.value === strVal) return;      // hit min/max — no-op
      input.value = strVal;
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }

    // Hold-repeat. The rate is derived FROM THE RANGE, so whatever the control,
    // holding the button crosses it in about FULL_TRAVERSE_MS — self-scaling, so
    // it needs no revisiting when a range changes and it cannot be set
    // inconsistently across sixteen steppers.
    //
    // 2026-09-27, reported as "ok for a single click but they work too fast when
    // held down". Two faults, both MEASURED before anything was touched:
    //
    //   1. A SMALL range had NO BRAKE AT ALL. repeatMagnitude floored at one
    //      step per tick — 16.7 a second — and returned early under the comment
    //      "below one step, the control is already quick enough — leave it
    //      alone". Leaving it alone was the bug: `depth` is four wide, so a held
    //      button crossed its ENTIRE range in 0.24s, `colour_speed` in 0.36s,
    //      `symmetry` in 0.90s. The code could not express "slower than one step
    //      per tick", so it never tried — and the comment recorded that as a
    //      property rather than a limit.
    //   2. FULL_TRAVERSE_MS 2500 was brisk for the big ranges too. 360 degrees
    //      of angle in two and a half seconds flies past what you aimed at.
    //
    // Both go away once the magnitude is allowed to be FRACTIONAL: the caller
    // accumulates it and steps only when a whole step has built up, so the
    // range-derived rate governs small ranges as well instead of being clamped
    // away by them. The floor is now a TIME — one step per START_STEP_MS — not
    // one step per tick.
    //
    // MEASURED after: every control moves between 1 and 5 units in the first
    // half-second of repeating; a wide range sweeps end to end in ~7.5s; depth
    // takes 1.1s for its four steps.
    const REPEAT_MS        = 60;    // gap between repeats while held
    const HOLD_MS          = 400;   // press-and-hold before repeating starts
    const START_STEP_MS    = 260;   // at the START of a hold, one step per this
    const FULL_TRAVERSE_MS = 7000;  // target time to cross a whole range
    const RAMP_MS          = 1400;  // time to reach full speed

    // May return LESS than one step — the caller accumulates. Deliberately NOT
    // rounded to the control's grid in here: rounding a fractional magnitude up
    // to a whole step is precisely the floor this exists to remove.
    function repeatMagnitude(input, ticks) {
      const min  = parseFloat(input.min);
      const max  = parseFloat(input.max);
      // A proportional control's "range" is counted in PRESSES, not in units —
      // how many five-per-cent steps separate the ends — so the same
      // range-derived rate below gives it the same traverse time as every
      // other control without knowing it is proportional.
      const prop = parseFloat(input.dataset.proportional);
      const propRange = (Number.isFinite(prop) && prop > 0 && min > 0 && max > min)
        ? Math.log(max / min) / Math.log(1 + prop) : null;
      const step = (propRange !== null) ? 1 : (parseFloat(input.step) || 1);
      // Slowest the repeat ever runs: one step per START_STEP_MS.
      const slowest = step * (REPEAT_MS / START_STEP_MS);
      // Fastest: whatever crosses the whole range in FULL_TRAVERSE_MS, but never
      // slower than the floor — which is what gives a tiny range a constant,
      // readable rate instead of a flicker.
      const span = (propRange !== null) ? propRange
                 : ((Number.isFinite(min) && Number.isFinite(max)) ? (max - min) : null);
      const fastest = (span !== null)
        ? Math.max(slowest, span / (FULL_TRAVERSE_MS / REPEAT_MS))
        : slowest;
      // Ramps in, so a short hold is still fine adjustment. A single tap never
      // accelerates at all, because it never enters the repeat.
      const ramp = Math.min(1, (ticks * REPEAT_MS) / RAMP_MS);
      return slowest + (fastest - slowest) * ramp;
    }

    document.querySelectorAll('.step-btn').forEach((btn) => {
      let holdTimer   = null;
      let repeatTimer = null;
      let repeatTicks = 0;
      let repeatCarry = 0;

      const doStep = (magnitude) => {
        const input = document.getElementById(btn.dataset.target);
        const delta = parseFloat(btn.dataset.delta);
        if (!input || input.disabled) return;
        stepControl(input, delta, magnitude);
      };

      const start = (ev) => {
        if (btn.disabled) return;
        ev.preventDefault();
        try { btn.setPointerCapture(ev.pointerId); } catch (_) {}
        repeatTicks = 0;
        repeatCarry = 0;
        doStep();
        holdTimer = setTimeout(() => {
          repeatTimer = setInterval(() => {
            const input = document.getElementById(btn.dataset.target);
            if (!input) return;
            const step = parseFloat(input.step) || 1;
            // repeatMagnitude may be a FRACTION of a step. Accumulate it and
            // move only when a whole step has built up — that is what lets a
            // four-wide control repeat slower than one step per tick.
            repeatCarry += repeatMagnitude(input, repeatTicks);
            repeatTicks += 1;
            if (repeatCarry >= step) {
              const whole = Math.floor(repeatCarry / step) * step;
              repeatCarry = Math.max(0, repeatCarry - whole);
              doStep(whole);
            }
          }, REPEAT_MS);
        }, HOLD_MS);
      };

      const stop = () => {
        if (holdTimer)   { clearTimeout(holdTimer);   holdTimer   = null; }
        if (repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; }
        repeatTicks = 0;
        repeatCarry = 0;
      };

      btn.addEventListener('pointerdown',   start);
      btn.addEventListener('pointerup',     stop);
      btn.addEventListener('pointercancel', stop);
      btn.addEventListener('pointerleave',  stop);
    });

    // ── Drift automation ──────────────────────────────────────────────────
    // ONE timer carries BOTH angles. They are independent parameters with
    // independent rates, but a second timer would give them two clocks that
    // drift apart and two renders per tick for one picture.
    function driftIntervalMs() {
      const table = { 1: 100, 2: 100, 3: 100, 4: 200, 5: 1000 };
      return table[parseInt(depthSelect.value, 10)] ?? 200;
    }

    // The clock runs on WALL TIME. Scheduling the next tick after the render
    // makes the real period `render time + interval`, which is a SYSTEMATIC
    // bias and not jitter: a bigger canvas draws slower and therefore drifts
    // slower, for ever — so BD's module and a viewer's square drew apart all
    // session. driftNextDue is the moment the NEXT tick is owed.
    let driftNextDue = 0;

    function driftRunning() {
      return parseInt(angleDriftSlider.value, 10) > 0 ||
             parseInt(pitchDriftSlider.value, 10) > 0;
    }

    function manageDriftInterval() {
      if (!driftRunning()) {
        if (driftInterval !== null) { clearTimeout(driftInterval); driftInterval = null; }
      } else if (driftInterval === null) {
        driftNextDue = Date.now() + driftIntervalMs();
        driftInterval = setTimeout(driftTick, driftIntervalMs());
      }
    }

    // Carry seconds → minutes → degrees for one angle. Returns the new triple.
    function advanceAngle(degs, mins, secs, drift) {
      secs += drift;
      mins += Math.floor(secs / 60);
      secs  = secs % 60;
      degs += Math.floor(mins / 60);
      mins  = mins % 60;
      return { degs: wrapAngle(degs), mins: mins, secs: secs };
    }

    function driftTick() {
      // Do NOT null driftInterval here — manageDriftInterval (reached via
      // render → setControlValues) checks it to avoid double-scheduling. The
      // stale handle is overwritten at the end once we know whether to go on.
      if (!driftRunning()) { driftInterval = null; return; }

      const a = advanceAngle(
        parseInt(angleSlider.value, 10), parseInt(angleMinutesSlider.value, 10),
        parseInt(angleSecondsSlider.value, 10), parseInt(angleDriftSlider.value, 10) || 0);
      const p = advanceAngle(
        parseInt(pitchSlider.value, 10), parseInt(pitchMinutesSlider.value, 10),
        parseInt(pitchSecondsSlider.value, 10), parseInt(pitchDriftSlider.value, 10) || 0);

      angleSlider.value        = String(a.degs);
      angleMinutesSlider.value = String(a.mins);
      angleSecondsSlider.value = String(a.secs);
      pitchSlider.value        = String(p.degs);
      pitchMinutesSlider.value = String(p.mins);
      pitchSecondsSlider.value = String(p.secs);

      updateValueDisplays();

      if (storedText) {
        // render() reads this to label the bd_av_state it sends, so BD can
        // tell "the timer moved the angle" from "someone changed a parameter"
        // and decline to forward the former to a viewer computing it itself.
        // render() is synchronous, so the flag cannot outlive the call;
        // try/finally anyway, because a throw must not leave every later
        // frame wearing the label.
        renderingFromDrift = true;
        try { render(applyControlDirectives(storedText)); } finally { renderingFromDrift = false; }
      }

      postToParent({
        type: 'bd_state_update',
        angle: a.degs, angle_minutes: a.mins, angle_seconds: a.secs,
        pitch: p.degs, pitch_minutes: p.mins, pitch_seconds: p.secs
      });

      const interval = driftIntervalMs();
      driftNextDue += interval;
      // Too far behind to catch up honestly — a slow machine, or a tab that
      // has just woken. Give up the backlog rather than fire a burst: a spiral
      // of catch-up renders on a waking phone is worse than the lost time.
      if (Date.now() - driftNextDue > interval * 5) driftNextDue = Date.now() + interval;
      driftInterval = setTimeout(driftTick, Math.max(0, driftNextDue - Date.now()));
    }

    angleDriftSlider.addEventListener('input', manageDriftInterval);
    pitchDriftSlider.addEventListener('input', manageDriftInterval);

    // ── The scene ─────────────────────────────────────────────────────────
    // `transparent` and `none` both accepted: `transparent` is the CSS
    // keyword an author will reach for, `none` is what the three.js property
    // is actually set to, and refusing either would be a riddle.
    const BD_TRANSPARENT_BG = /^(transparent|none)$/i;

    const CAM_FOV = 50;
    let renderer = null, scene = null, camera = null, group = null;
    let geometry = null, material = null;

    // LINE_WIDTH_IS_NOT_AVAILABLE
    //
    // Core WebGL ignores gl.lineWidth above 1.0 on every platform that
    // matters, so LineBasicMaterial.linewidth does nothing on the machines
    // this will actually run on. That is why there is no `weight` stepper in
    // this module: a control wired to nothing is worse than no control, and
    // this user cannot use hue alone to compensate for a stroke that will not
    // thicken.
    //
    // It IS set below, because it costs nothing and a few platforms honour it.
    // Real thickness needs Line2 / LineMaterial from three's examples/jsm,
    // which are ES modules and would mean an import map and three more CDN
    // fetches — a fair next step, but not a silent one.
    function initThree() {
      if (!HAVE_THREE || renderer) return;
      // Colour management OFF so setHSL(h, s, l) means exactly what
      // hsl(h, s%, l%) means on a 2D canvas. three r152+ treats vertex colours
      // as linear-sRGB and converts on output, which would render the same
      // script visibly different from the 2D module — and a figure tuned by
      // eye in one must not change hue when it moves to the other.
      if (THREE.ColorManagement) THREE.ColorManagement.enabled = false;
      // `alpha: true` UNCONDITIONALLY, because it can only be set at
      // construction — a renderer built without it can never become
      // see-through, whatever is done later. It costs nothing while the clear
      // alpha stays 1, which is every case except %%bd_background transparent.
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      scene    = new THREE.Scene();
      scene.background = new THREE.Color('#0a0a0f');
      camera   = new THREE.PerspectiveCamera(CAM_FOV, 1, 1, 100000);
      group    = new THREE.Group();
      scene.add(group);
      material = new THREE.LineBasicMaterial({ vertexColors: true });
    }

    function updateCanvasSize() {
      // Square, as in the 2D module: the smaller of the wrapper's two
      // dimensions, so it never overflows the iframe in either axis.
      const w = canvasWrapper.clientWidth;
      const h = canvasWrapper.clientHeight;
      const size = Math.floor(h > 0 ? Math.min(w, h) : w);
      if (size > 0 && renderer) {
        // setSize writes the drawing buffer at size × pixelRatio and the CSS
        // box at size px — both, which is what keeps a retina square sharp
        // without the element outgrowing its wrapper.
        renderer.setSize(size, size);
        if (camera) { camera.aspect = 1; camera.updateProjectionMatrix(); }
      }
      alignStepperTop();
    }

    // ── The bearing, degrees AND arcminutes ───────────────────────────────
    //
    // Minutes always ADD to the signed degrees, which is angle_minutes' own
    // rule. At a negative elevation that means they move TOWARDS zero: -82
    // with 30' is -81.5. One rule, applied once, and every aim has exactly one
    // spelling — which is what a round trip through the script needs.
    function azimuthTotal() {
      return safeParseNumber(camAzimuthSlider.value, 0)
           + (safeParseNumber(camAzimuthMinutesSlider.value, 0) / 60);
    }
    function elevationTotal() {
      return safeParseNumber(camElevationSlider.value, 60)
           + (safeParseNumber(camElevationMinutesSlider.value, 0) / 60);
    }

    // Split a fractional bearing back into a whole-degree control and an
    // arcminute one. FLOOR, not round, because the minutes are unsigned and
    // add: the degrees have to be the value BELOW the total for the remainder
    // to be positive. The carry matters — 81.9999 would otherwise write 60
    // minutes, a value the control's range does not hold.
    function splitBearing(total, wrap) {
      const t = wrap(total);
      let degs = Math.floor(t);
      let mins = Math.round((t - degs) * 60);
      if (mins >= 60) { mins -= 60; degs += 1; }
      return { degs: wrap(degs), mins: mins };
    }

    // ── Which point the camera looks AT ───────────────────────────────────
    //
    // The origin, until cam_axis names an arm — and then the point on THAT
    // ARM'S fitted axis nearest the origin.
    //
    // 2026-10-15, reported as "the central hole is not centred in middle of
    // screen it is now off to left". The bearing was right and the target was
    // not: an arm's axis passes NEAR the origin but not through it, so looking
    // at the origin looks at a point beside the tunnel's mouth and the hole
    // sits off to one side by exactly that miss. Worse while flying, because a
    // fixed sideways offset subtends a bigger angle the closer you get — the
    // hole would have drifted further off centre as the trip went on.
    //
    // Nothing else changes meaning. The eye is still placed by azimuth,
    // elevation and distance; the whole orbit is simply centred on the axis
    // instead of on the world origin, so a nudge of the bearing still pivots
    // around what you are looking at and cam_distance is still how far along
    // the aim you are. cam_axis 0 returns null and every number means what it
    // meant before this existed.
    //
    // CACHED on everything that can move the axis — which arm, how many arms,
    // the live y scale, and the build the samples came from. Measuring is two
    // passes over six thousand points and the flight asks twenty times a
    // second; cheap is not the same as free.
    let camTargetKey   = null;
    let camTargetPoint = null;
    function camTarget() {
      const k = safeParseInt(camAxisSlider.value, 0);
      if (k <= 0 || !haveGeometry) return null;
      const key = k + '|' + symmetrySelect.value + '|' + pitchScale() + '|' + axisSerial;
      if (camTargetKey !== key) {
        const a = armAxisDirection(k);
        camTargetKey   = key;
        camTargetPoint = a ? { x: a.nearX, y: a.nearY, z: a.nearZ } : null;
      }
      return camTargetPoint;
    }

    function placeCamera() {
      if (!camera) return;
      const az = wrapAngle(azimuthTotal()) * DEG;
      // The float while the rotation is running, the slider otherwise. The
      // slider holds whole degrees, so drawing from it would step the camera a
      // degree at a time however fast the clock ticked.
      const el = wrapElevation(camSpinTimer !== null && camElevationExact !== null
        ? camElevationExact
        : elevationTotal()) * DEG;
      // Same indirection as the elevation above, and for the same reason: the
      // slider holds whole units, so drawing from it would step the camera a
      // unit at a time however fast the clock ticked.
      // cam_distance is in METRES, which is to say in world units, because the
      // figure is scaled into metres before the camera is placed. So it is used
      // as it stands — no size scaling here. 2026-10-19.
      const d  = clampCam(camSpinTimer !== null && camDistanceExact !== null
        ? camDistanceExact
        : safeParseNumber(camDistanceSlider.value, 4));
      const ce = Math.cos(el), se = Math.sin(el);
      const ca = Math.cos(az), sa = Math.sin(az);
      // The orbit's centre: the origin, or the arm's own axis if one is named.
      const t  = camTarget();
      const tx = t ? t.x : 0, ty = t ? t.y : 0, tz = t ? t.z : 0;
      camera.position.set(tx + d * ce * sa, ty + d * se, tz + d * ce * ca);
      // The up vector is the sphere's NORTH TANGENT, not world +Y. World +Y is
      // parallel to the view direction at the poles, where lookAt degenerates
      // — and elevation 90 is not a corner case in this module, it is the view
      // that reproduces the 2D kolam, so it has to be the most reliable value
      // in the range rather than the one that breaks.
      //
      // At elevation 90 this gives up = (0, 0, -1), putting world +X to screen
      // right and world +Z to screen DOWN — the 2D canvas's own axes. That is
      // what makes a pitch-0 figure seen from directly above the same drawing
      // as the 2D module's, and not a mirror image of it.
      //
      // ── ROLL, applied to that up vector ──────────────────────────────
      // The third degree of freedom: azimuth and elevation say where the eye
      // is, and neither can turn the picture about the line of sight.
      //
      // forward is the unit vector from the eye TO the target, which is minus
      // the radial one the position was built from; right is forward x up. The
      // two are orthonormal — the elevation markup records that check, at the
      // poles included — so the cross product is already the third unit axis
      // and needs no normalising. Rolling is then one rotation in that plane.
      //
      // ROLL 0 IS BIT-FOR-BIT THE OLD up. cos 0 is exactly 1 and sin 0 exactly
      // 0, so the general form reduces to the north tangent with no rounding,
      // and there is no need for a branch that could drift from it. That
      // matters more here than it looks: elevation 90 with roll 0 is the view
      // that reproduces the 2D kolam segment for segment, and it is the
      // module's whole invariant.
      const roll = wrapAngle(camSpinTimer !== null && camRollExact !== null
        ? camRollExact
        : safeParseNumber(camRollSlider.value, 0)) * DEG;
      const ux = -se * sa, uy = ce, uz = -se * ca;
      const fx = -ce * sa, fy = -se, fz = -ce * ca;
      const rgx = fy * uz - fz * uy;
      const rgy = fz * ux - fx * uz;
      const rgz = fx * uy - fy * ux;
      const cr = Math.cos(roll), sr = Math.sin(roll);
      camera.up.set(ux * cr + rgx * sr, uy * cr + rgy * sr, uz * cr + rgz * sr);
      camera.lookAt(tx, ty, tz);
      // Depth range follows the distance, so precision does not fall away when
      // the camera pulls back to 9900.
      // THE FLOOR IS 1 cm, NOT 0.1 m. 2026-10-19 — reported as "it initialises
      // okay but then after being reduced it only shows black", and that was
      // this line: 0.1 was chosen when cam_distance was in arbitrary units,
      // where it floored a near plane at 0.1 of 600. In metres it is a TEN
      // CENTIMETRE near plane, so any view closer than about 20 cm clips the
      // whole figure and a view at 10 cm shows nothing at all. A units change
      // that leaves a bare constant behind is a units change half done.
      camera.near = Math.max(0.01, d / 1000);
      // And the far plane in metres too: +1000 was generous in figure units
      // and is a kilometre of empty space here. Twenty times the distance plus
      // ten metres covers a figure far bigger than the eye is from it.
      camera.far  = d * 20 + 10;
      camera.updateProjectionMatrix();
    }

    // ── The new dimension's step length ───────────────────────────────────
    //
    // %%bd_step_pitch is how far one turtle step carries the figure OUT of the
    // plane, in the same units as %%bd_step. Equal means isotropic; 0 means
    // flat whatever the pitch is.
    //
    // It is applied as a scale on the group, and that is EXACTLY equivalent to
