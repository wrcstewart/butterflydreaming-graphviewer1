<!-- ButterflyDreaming Fractal Music Module — index.html — iframe wrapper -->
<!-- Loaded by BD's #visual-iframe at /bd_M_Fractal/. Thin relay between the
     grandparent viewer and the inner music_module.html iframe. Mirrors
     M_Music/index.html (bd_M_ABC sibling) — same RELAY_UP/DOWN sets. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ButterflyDreaming — Fractal Music Module</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a0f;
      overflow: hidden;
    }
    #module-frame {
      display: block; width: 100%; height: 100%; border: 0;
    }
  </style>
</head>
<body>
  <iframe id="module-frame"
          src="music_module.html"
          title="ButterflyDreaming Fractal Music Module">
  </iframe>

  <script>
    'use strict';

    const RELAY_DOWN = new Set(['bd_script_update', 'bd_script_request', 'bd_param_update', 'BD_INIT', 'BD_STOP', 'BD_INFO_DIALOG_RESULT']);
    const RELAY_UP   = new Set([
      'BD_READY',
      'bd_script_response',
      'bd_param_update',
      'BD_UPDATE',
      'BD_ERROR',
      'BD_MEDIA_BLOB',
      'BD_MODULE_COPY_LINK_REQUEST',
      'BD_INFO_DIALOG_REQUEST',
      'BD_STATUS',                    // 2026-08-19 — module → BD status strip
      // 2026-09-23 — bd_av_state. The module announces its live script so BD's
      // `auto` can follow the steppers. V_Kolam's wrapper gained this on
      // 2026-09-14 and this one was not updated with it, so the module sent,
      // the wrapper dropped, and BD never heard: the pull direction of the
      // tick box simply did nothing, with nothing anywhere to say why.
      //
      // THE THIRD SITE, again. This relay is a WHITELIST — sender, whitelist,
      // receiver — and two of the three working is indistinguishable from
      // none of them.
      'bd_av_state',
      // The module's console, so a fault in there reaches BD's server log
      // instead of only the iframe's own console — which nobody has open on a
      // phone. The whitelist is the third site: the module may send these all
      // it likes and they go nowhere without this line.
      'bd_module_log'
    ]);

    const moduleFrame = document.getElementById('module-frame');

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data.type !== 'string') return;

      if (event.source === moduleFrame.contentWindow) {
        if (RELAY_UP.has(data.type)) {
          window.parent.postMessage(data, '*');
        }
        return;
      }

      if (event.source === window.parent && RELAY_DOWN.has(data.type)) {
        moduleFrame.contentWindow.postMessage(data, '*');
      }
    });
  </script>
</body>
</html>
