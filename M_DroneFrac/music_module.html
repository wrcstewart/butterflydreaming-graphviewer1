<!DOCTYPE html>
<html lang="en">
<!-- bd_M_DroneFrac — a granular drone steered by an L-system.
     Built 2026-10-01. Tone.js GrainPlayer over one sustained CC0 sample.

     The SHAPE of this module, and why it is not a copy of bd_M_Fractal:

     Fractal emits NOTES. It walks a turtle, writes the walk out as an ABC
     score, parses that back, and plays the resulting note list. This module
     emits no notes at all. It walks the same kind of turtle and uses the walk
     as a TRAJECTORY — a timed sequence of parameter settings on a single
     grain player that never stops sounding.

     Two consequences follow, and they are the whole design:

     1. NO ABC LAYER. There is nothing to notate: a drone has no notes, and
        ABC cannot express grain size or overlap. Fractal's text round-trip
        (turtle → ABC → reparse → notes) is skipped entirely, so nothing is
        quantised by `lenToken` and nothing is rounded to integer BPM. The
        trajectory goes straight to the player. Export is .wav, because no
        interchange format for granular patches exists — SDIF describes
        analysed sound, not a patch, and every tool's preset format is its
        own. The SCRIPT is the portable form, as everywhere else here.

     2. THE TWO AXES REACH TWO DESTINATIONS. In Fractal, horizontal runs
        become durations and vertical movement becomes pitch, but both are
        funnelled into one ABC stream and arrive welded together. Here
        y → detune and run length → grainSize, independently, because there
        is no notation in between to collapse them.

     WHAT GRAINPLAYER WILL AND WILL NOT DO — check before adding modulation.
     `detune`, `grainSize`, `overlap` and `playbackRate` are PLAIN NUMBERS in
     Tone 14, not Signals. You cannot connect an LFO to any of them; the docs
     read as though you can and the source says otherwise. They are read when
     a grain FIRES, so a write lands at the next grain and the effective
     modulation rate is 1/grainSize — five a second at the 0.2 default. That
     is why the trajectory is SCHEDULED rather than connected, and why there
     are no LFOs in this module: for drone-speed movement five steps a second
     is far finer than the ear resolves, and the lever if it is ever not is a
     smaller grainSize, not another oscillator.

     Downstream is the opposite: everything in the effects tail IS a Signal,
     so that is where smooth modulation belongs if it is ever wanted.

     bd_ui_config CARRIES THREE INDEPENDENT FLAGS, all defaulting to BD's own
     behaviour so a host that says nothing changes nothing:
       hideControls     the host supplies the stepper column; hide mine
       hostChrome       the host draws furniture around this iframe (default true)
       hostScriptPanel  the host shows the script and its own copy control
     They are deliberately separate. controls-hidden used to mean two of these
     at once and had to be split; the lesson is that a flag should assert one
     thing.
-->
<head>
<meta charset="utf-8">
<title>bd_M_DroneFrac</title>
<style>
  :root { --ink: #e8e8e0; --dim: #9e9e90; --ground: #07070c; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--ground); color: var(--ink);
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  /* ── Layout ───────────────────────────────────────────────────────────
     The KOLAM shape, not the music-panel shape: a visual area on the left
     and ONE control column on the right. The two existing music modules
     use a three-column grid with copy/player/output filling the left
     two-thirds, which assumes nothing visual — fine for them, wrong here.
     A single column also leaves the left side free to carry an image later,
     which is what the collage work will want. Until then the spectrum
     lives there, and it is genuinely useful: the effect of grain size and
     overlap is far easier to see than to hear at first. */
  .module-layout {
    flex: 1;
    display: grid;
    /* 150px and it stays there: this column has to land where the other
       modules' stepper columns land, so BD's furniture lines up across all of
       them. It is a shared dimension, not a free one — widening it to give
       the readout room was tried and reverted for exactly that reason. */
    grid-template-columns: minmax(0, 1fr) 150px;
    /* minmax(0, 1fr), never 1fr: a grid item's automatic minimum is its
       CONTENT, so a scrolling stepper column grows past the grid and is
       clipped rather than scrolling. Fractal shipped with that bug. */
    grid-template-rows: minmax(0, 1fr) auto auto;
    grid-template-areas:
      "visual   steppers"
      "player   steppers"
      "output   arrows";
    gap: 5px;
    padding: 5px;
    min-height: 0; min-width: 0;
    overflow: hidden;
  }
  .visual-panel { grid-area: visual; }
  .player-panel { grid-area: player; }
  .output-panel { grid-area: output; }
  #control-panel { grid-area: steppers; overflow-y: auto; }
  #bd-arrows-slot { grid-area: arrows; }

  .panel {
    border: 1px solid #fff; border-radius: 4px; padding: 5px;
    display: flex; flex-wrap: wrap; gap: 5px;
    align-content: flex-start; min-width: 0; min-height: 0; overflow: hidden;
  }
  .visual-panel { padding: 0; border-color: #2a2a3a;
                  display: flex; flex-direction: column; min-height: 0;
                  /* nowrap, because .panel sets flex-wrap: wrap for the button
                     panels and this one must NOT inherit it. In a column
                     container, wrap moves an item that does not fit into a
                     SECOND COLUMN — off to the side, where .panel's
                     overflow: hidden erases it. That is how the sample
                     selector came to be absent rather than merely clipped. */
                  flex-wrap: nowrap; }
  .player-panel { flex-direction: row; align-items: center; justify-content: center; }
  #control-panel { flex-direction: column; flex-wrap: nowrap; }

  /* dock-slot — reserved for BD's ↓↑ arrows. Faint frame so the reserved
     area is visible even before BD stamps into it. */
  .dock-slot { border: 1px dashed rgba(255,255,255,0.35); border-radius: 4px;
               min-height: 0; min-width: 0; }

  /* ── A VIEWER, not a controller ───────────────────────────────────────
     bd_ui_config { hideControls: true } — the host supplies the control
     surface, so the steppers and the authoring buttons go and the TRANSPORT
     STAYS. Play cannot be delegated: audio needs a user gesture in the
     document that makes the sound, and a remote press cannot supply one. */
  body.controls-hidden #control-panel,
  body.controls-hidden .copy-row,
  body.controls-hidden #sample-select,
  body.controls-hidden #bd-arrows-slot { display: none; }
  body.controls-hidden .module-layout {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "visual" "player" "output";
  }

  /* ── no-host-chrome ───────────────────────────────────────────────────
     Comes BEFORE controls-hidden on purpose: same specificity, so source
     order decides, and the viewer's single-column grid must win. */
  body.no-host-chrome #bd-arrows-slot { display: none; }
  body.no-host-chrome .module-layout {
    grid-template-areas:
      "visual   steppers"
      "player   steppers"
      "output   steppers";
  }

  /* flex-basis 0, NOT auto. drawSpectrum sets canvas.width/height from the
     canvas's own measured rect, and those are ATTRIBUTES — the element's
     intrinsic size. With flex-basis: auto the intrinsic height is the
     hypothetical main size, so each frame the canvas asked to be
     devicePixelRatio times taller than the space it had just been given: a
     feedback loop that squeezed everything below it out of the panel.
     A basis of 0 makes the height come from flex-grow alone, so the attribute
     can no longer drive layout. */
  #spectrum { display: block; flex: 1 1 0; width: 100%; min-height: 0; }
  /* WHY THIS IS NOT IN THE STEPPER COLUMN.
     Width is the obvious objection and it is not the binding one. A <select>
     is a focusable form control, and iOS Safari ZOOMS THE WHOLE PAGE when one
     under 16px takes focus — inside an iframe that zoom cannot be undone. So
     this cannot wear the 0.58rem the labels wear; 16px is a floor, not a
     preference, and 16px will not fit a 136px column beside two buttons.
     The column could have held a +/- stepper instead, cycling samples like
     `scale` does, and that was the alternative. It was not taken because a
     stepper shows ~4 characters and sample names are the one value here that
     is genuinely a name — "cosmic pad dmin 60bpm" truncated to "cosm" tells
     you nothing, and a library of twenty would be tedious to cycle.
     So it sits under the spectrum, which is the widest space the module has,
     and is marked %%bd_p_sample so the SCRIPT still governs it exactly like
     the steppers. */
  #sample-select {
    /* 0 0 auto — never shrink. The canvas can have whatever is left; the
       selector is a fixed strip and must not be negotiated away. */
    flex: 0 0 auto; width: 100%;
    background: #0d1a18; color: #9fe8d8;
    border: 0; border-top: 1px solid #2a2a3a; border-radius: 0;
    font-family: inherit;
    /* 16px and not a fraction of one: anything smaller and iOS Safari zooms
       the whole page on focus, which in an iframe is unrecoverable. */
    font-size: 16px;
    padding: 5px 6px;
  }

  /* uniform buttons: white frame, black bg, white font, one size */
  /* :not(.step-btn) — the steppers are NOT transport buttons and must not
     inherit this. Without the exclusion this rule (0,1,1) outranks .step-btn
     (0,1,0) and silently wins on min-width, border, background, colour and
     font-size alike. Three attempts to narrow the steppers changed nothing
     on screen because of it. */
  .panel button:not(.step-btn) {
    border: 1px solid #fff; background: #000; color: #fff;
    font-family: inherit; font-size: 0.66rem; line-height: 1.1;
    padding: 4px 6px; border-radius: 3px;
    min-width: 54px; min-height: 26px; cursor: pointer; text-align: center;
    /* The iOS hardening quartet — without these a stepper press selects
       text, flashes grey, and double-tap zooms the page. */
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .panel button:not(.step-btn):hover:not(:disabled) { background: #1a1a1a; }
  .panel button:not(.step-btn):disabled { opacity: 0.4; cursor: not-allowed; }

  .big-btn { min-width: 108px; min-height: 52px; font-size: 0.95rem;
             font-weight: bold; color: #10240f !important; }
  /* ── CANARY host for bd_M_DroneFrac (declared 2026-10-01) ──────────────────
     The BACKGROUND of the Play button (the note said "border" long after it
     stopped being one). Rotates red -> green -> blue on every
     change to this file, so there is always something to LOOK at to answer
     "am I seeing my edit or a cached copy" — the question that cost three
     rounds on the stepper width above, where the file WAS current and the
     CSS was simply being overridden.
     Trust the hex on the background line, not this prose: the note has gone
     stale while the colour rotated on in two other files already.
     2026-10-10e: BLUE, AND FROM HERE IT FOLLOWS BD's. The author's
     instruction: this is all one piece of work as far as the reader is
     concerned, so BD's #copy-link-btn is the canary to read and this button
     carries the same colour rather than a sequence of its own. Two canaries
     rotating independently was a question nobody needed to answer.
     2026-10-10d: RED (the steppers APPEAR in a narrow lane at last:
     `display: flex` on #control-panel was only in the wide-aspect block, so
     nothing re-showed the panel in a column and output-only went on hiding it
     — the lane showed the transport alone. The transport now sits at the FOOT
     of that column, under the steppers). Next = green.
     2026-10-10c: BLUE (the compact controls ADAPT to the rect: a column by
     default, a row only when the frame is wide and shallow, chosen by an
     aspect-ratio query rather than a sixth flag — the shape of the frame is a
     fact the module can see for itself. The host moved the steppers out of the
     52px bar, which was too crowded on a phone, into the lane beside the
     graphic). Next = red.
     2026-10-10b: GREEN (compactControls — a fifth bd_ui_config flag: the
     steppers as a shallow horizontally-SCROLLING row beside the transport, so
     all 25 are reachable inside a 52px playbar. A `.control-row` is 24px of
     stepper over a 9px label, which fits that depth sideways where a 130px
     column could not. The spectrum stays hidden: the collage's output is
     music). Next = blue.
     2026-10-10: RED (a SHALLOW output-only bar: the player panel's padding
     drops to 3px and .big-btn to a 38px minimum, so the transport fits a 52px

     keep their 52px buttons. The 10px gap between Play and Stop is
     untouched). Next = green.
     2026-10-09: BLUE (outputOnly — the player panel alone is this module's
     Output, so BD's View and later a collage get a transport strip and
     nothing else: no spectrum, no steppers, no Bake or Save). Next = red.
     2026-10-06j: GREEN (iOS ring/silent switch: the module now asks for a
     `playback` audio session, so Web Audio stops being treated as ambient
     and silenced along with the ringer). Next = blue.
     2026-10-06i: RED (start_at — WHERE IN THE STRING TO BEGIN, in thousands
     of symbols. Twelve settings give twelve distinct figures where
     `iterations` gives five across its whole range; the permanent false

     2026-10-06h: BLUE (a rebuilt trajectory now reaches a RUNNING transport:

     2026-10-06g: GREEN (the offset note said its figures measured notes

     Next = blue.
     2026-10-06f: RED (new default script set by the author: the GENERATED

     2026-10-06e: BLUE (the chopped grammar IS the default now, by the

     2026-10-06d: GREEN (an alternative grammar recorded beside the default

     2026-10-06c: RED (the shared opening is MEASURED per grammar instead of
     assumed to be the whole previous iteration; expansion and turtle fused so
     the prefix is walked but never stored, which takes iteration 7 from 45 MB

     2026-10-06b: BLUE (the loop is a safety net, not a feature: the trajectory
     is no longer cut off at `duration`, which now governs Bake only).
     2026-10-06: GREEN (offsetCH2 max 60 -> 200).
     2026-10-04g: RED (synth_pad_A2 — generated from arithmetic, so no upstream

     2026-10-04f: BLUE (default refined: ch2 an octave and a fourth up at +4 dB,

     2026-10-04e: GREEN (the PaulXStretch drone as the default sample, ch2 at

     2026-10-04d: RED (paulx_drone up an octave to no transposition at all —
     the third downward shift to be undone; processed sources want less).
     Next = green.
     2026-10-04c: BLUE (paulx_drone — PaulXStretch, which added more movement
     than Alchemy or the Logic effects).
     2026-10-04b: GREEN (gtr_ens_Cmaj7 raised an octave — -2400 was too low by
     ear, despite the register argument for it). Next = blue.
     2026-10-04: RED (gtr_ens_Cmaj7 — the guitar chord through Ensemble and
     ChromaVerb).
     2026-10-03e: BLUE (new default set by the author: the Alchemy guitar pad,
     ch2 a fifth up at full level, overlap 0.44 — the pulse gone). Next = red.
     2026-10-03d: GREEN (channel 2 gains its own level and interval, to settle
     whether a high pulse at the grain rate comes from it). Next = blue.
     2026-10-03c: RED (alchemy_gtr_Cmaj7 — the guitar chord through Logic's
     Alchemy, no transposition needed). Next = green.
     2026-10-03b: BLUE (gtr_pad_Cmaj7 added from Freesound 870087 — the lowest
     of the seven, and the file that made read_any() format-agnostic).
     Next = red.
     2026-10-03: GREEN (bd_ui_config gains hostScriptPanel, which hides the
     module's own Copy Script where the host already has one). Next = blue.
     2026-10-02n: RED (output stage: volume, bass, treble, balance — all _p_ so
     a balance against other sound can be written down). Next = green.
     2026-10-02m: BLUE (new default script set by the author: vox pad, pentatonic,
     step_seconds 2, offsetCH2 60, a wet reverb). Next = red.
     2026-10-02l: GREEN (aura_pad_Amin added from Freesound 697998 — short loop
     on purpose, repetition being what makes a pad musical). Next = blue.
     2026-10-02k: RED (j8_pad_Amin9 added from Freesound 624728, CC0, two
     octaves down — the steadiest source yet and it never loops). Next = green.
     2026-10-02j: BLUE (vox pad transposed an octave down — at native pitch it
     had 0.6% of its energy below C2). Next = red.
     2026-10-02i: GREEN (vox_pad_Dmin7 added from Freesound 625157, CC0; the
     organ pads' loop crossfade removed — it was costing 16 dB of level).
     Next = blue.
     2026-10-02h: RED (loop clicks fixed — each voice now fades to zero at
     both ends, so the wrap step fell from 998 to 8 of 32768). Next = green.
     2026-10-02g: BLUE (stopped answering BD's BD_REQUEST_UPDATE poll, which
     was rewriting the card several times a second). Next = red.
     2026-10-02f: GREEN (pads rebuilt on the 8' rank, two octaves below the
     original — the REGISTRATION, not the octave, was what held the pitch up).
     Next = blue.
     2026-10-02e: RED (sample URLs now carry a content hash; a rebuilt pad
     could otherwise be cached indefinitely). Next = green.
     2026-10-02d: BLUE (all three pads rebuilt an octave lower, from real low
     notes rather than pitch-shifted; gains re-solved). Next = red.
     2026-10-02c: GREEN (the sample selector was invisible: a canvas
     flex-basis feedback loop plus inherited flex-wrap pushed it out of the
     panel). Next = blue.
     2026-10-02b: RED (a single raw note added for A/B against the chorded
     pads).
     2026-10-02: BLUE (bundled pads replaced with CC0 organ pads built from
     VCSL; the Sample Focus material could not be redistributed). */
  .big-btn.play {
    /* The WHOLE background, not a border: a 2px frame was too easy to miss,
       which is the one thing a canary must never be. White text because the
       canary colours are dark and .big-btn's near-black label would be
       unreadable on them — and luminance, not hue, has to carry it. */
    background: #2d7ff9 !important;      /* CANARY — blue, matching BD's */
    color: #fff !important;
  }
  .big-btn.stop { background: #e59b9b !important; }
  .big-btn:hover:not(:disabled) { filter: brightness(1.08); }

  .control-row { display: flex; flex-direction: column; align-items: stretch;
                 gap: 1px; margin-bottom: 4px; }
  .stepper { display: flex; align-items: stretch; gap: 2px; }
  .step-btn {
    /* These apply only now that `.panel button` excludes .step-btn — see the
       note there. min-width: 0 is still needed in its own right, because a
       min-width beats a flex-basis and 54px would otherwise pin the width
       whatever basis is written.
       52px — two off the 54 these were actually rendering at, a pixel at a
       time. The 26px written here before was never on screen
       (see the note on .panel button), so shaving pixels off it was shaving
       pixels off a number nobody had ever seen, and took the buttons to less
       than half the intended size.
       Of the 136px between the column's padding and gaps, the pair takes 104
       and leaves 32 for the readout — about four characters once its own
       padding and border are taken off. Short values fit; `min_pent` does not.
       The column cannot grow (see the layout note), so if more are wanted the
       lever is button size or the readout's own font, not the column. */
    flex: 0 0 52px; min-width: 0;
    border: 1px solid #3a4a48; background: #0d1a18;
    color: #9fe8d8; font-family: inherit; font-size: 0.85rem;
    border-radius: 3px; cursor: pointer; min-height: 24px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .step-btn:hover:not(:disabled) { background: #1a2a28; }
  .step-btn:active:not(:disabled) { background: #243f3b; }
  /* Enum readouts carry words, not numbers, and words need the extra
     character that 0.6rem buys in a 26px box. Numbers stay at 0.7rem, where
     they are more legible and never longer than four digits anyway. */
  .stepper-value.is-enum { font-size: 0.6rem; }
  .stepper-value {
    flex: 1 1 auto; text-align: center; font-size: 0.7rem;
    background: #05050a; border: 1px solid #2a2a3a; border-radius: 3px;
    padding: 3px 2px; min-width: 0; overflow: hidden; white-space: nowrap;
  }
  /* The directive's own name, under the control. Never a prettier synonym:
     the label has to be greppable against the script. */
  .control-row label { font-size: 0.58rem; color: var(--dim); text-align: center; }

  .copy-row { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  /* ── host-script-panel (2026-10-03) ───────────────────────────────────
     The host already shows the script and its own copy control, so this
     module's Copy Script would be the second button doing one job — and the
     host's sits beside the text it copies, which is the better place for it.
     Bake and Save wav stay: those are the module's, and no host can offer
     them.

     A FLAG OF ITS OWN rather than reading hostChrome. hostChrome means "the
     host draws nothing AROUND this iframe", which is a statement about layout
     reserve; whether the host supplies authoring controls is a different
     claim, and the two happen to coincide only in today's standalones.
     controls-hidden was carrying two meanings like that until it was split on
     2026-09-30, and overloading a second flag the same way would be the same
     mistake twice.

     DEFAULTS TO FALSE, so BD and any host that says nothing keeps the button
     and nothing already working changes. */
  body.host-script-panel #copy-script-btn { display: none; }
  #status:empty { display: none; }
  #status { font-size: 0.6rem; color: var(--dim); }
  /* ── output-only: the module's OUTPUT and nothing else (2026-10-08) ──
     For a MUSIC module the output is the player panel — the transport, and the
     piece title where there is one. NOT the steppers, NOT Copy or Bake or
     Save: those are authoring, and a presentation surface has no business
     offering them. Not the status line either — that is the module talking
     about itself.

     HIDE-ALL-THEN-EXEMPT inside the layout rather than a list of things to
     hide. A list is right today and wrong the first time a panel is added;
     inverted, a new panel has to ASK to appear here.

     The grid collapses to a block so the panel is the whole of it. BD's View
     sizes this iframe to a shallow strip at the foot — where a collage will
     put it — so what is seen here is what a collage gets. */
  body.output-only .module-layout { display: block; }
  body.output-only .module-layout > *:not(.player-panel) { display: none; }
  body.output-only .player-panel {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; height: 100%; box-sizing: border-box;
    /* ── A SHALLOW BAR (2026-10-10) ────────────────────────────────────
       3px, down from .panel's 5px. The host's playbar is 52px — exactly the
       52px `.canvas-wrapper` keeps clear below the square for BD's Extension
       strip — so with 3px of padding and a 1px border the buttons have 44px
       to sit in, and nothing hangs below the frame. */
    padding: 3px;
  }
  /* 38px, down from 52. The author: "the font on the buttons has plenty of
     space round it", and it did — 0.95rem bold in a 52px box. Still a
     comfortable target at 38, and the 10px GAP is untouched, which is the one
     thing that was asked to be kept.
     SCOPED TO output-only on purpose: the authoring view keeps its 52px
     buttons, so this cannot change the module's own look or its standalone. */
  body.output-only .big-btn {
    min-height: 38px;
    padding: 0 14px;
  }

  /* ── overlay: LAID OVER ANOTHER MODULE (2026-10-10, stage 1) ───────────
     The host gives this module the WHOLE module area — the same rect the
     visual module has — and asks it to be transparent everywhere it has
     nothing to show. Its panels are then placed at coordinates the host sends,
     because the host is the only party that can see both modules; a module
     describing the shared space would be a contract that can disagree with
     what is on screen.

     THE CLIPPING IS THE HOST'S JOB, not this file's: pointer events inside an
     iframe cannot pass through to the parent document — the iframe element is
     the hit target — so BD clips the frame to the regions this module actually
     occupies. Everything outside that clip belongs to the module underneath,
     for the eye and for the mouse alike.

     Stage 1 shows the TRANSPORT only. The steppers come next. */
  body.overlay, html:has(body.overlay) { background: transparent !important; }
  body.overlay { overflow: visible; }
  body.overlay .module-layout {
    display: block; position: relative;
    width: 100%; height: 100%; padding: 0; gap: 0;
  }
  body.overlay .module-layout > * { display: none; }
  /* The transport, at the rect BD measured for it. The fallbacks are the
     bottom-left corner: if the geometry has not arrived the bar is still
     somewhere sane rather than nowhere. */
  body.overlay .player-panel {
    display: flex; align-items: center; justify-content: center;
    position: absolute;
    left:   var(--bd-bar-left, 0px);
    top:    var(--bd-bar-top, auto);
    width:  var(--bd-bar-width, 240px);
    height: var(--bd-bar-height, 52px);
    gap: 10px; padding: 3px; box-sizing: border-box;
  }
  body.overlay .big-btn { min-height: 38px; min-width: 108px; flex: 0 0 auto; }

  /* ── strip-controls: the steppers as a shallow SCROLLING ROW ───────────
     The host's playbar is 52px deep. A `.control-row` is a 24px stepper over
     a 9px label — about 38px — so it fits that depth laid out sideways, which
     a 130px column never could. 25 directives then scroll HORIZONTALLY, which
     is the author's call: "the current playbar is already scrolling, so why
     can you not just add them — they scroll very rapidly".

     The spectrum stays hidden. That was decided for the collage: the output is
     MUSIC, and a spectrum display is an authoring instrument.

     #control-panel is re-shown by ID, so it beats
     `body.output-only .module-layout > *:not(.player-panel)` on specificity
     without that rule having to learn about this one. */
  /* ── IT ADAPTS TO THE RECT IT IS GIVEN (2026-10-10b) ──────────────────
     COLUMN by default, ROW only when the frame is wide and shallow. The host
     moved these steppers from a 52px bottom bar into the 130px lane beside the
     graphic — "too crowded on M" in the bar — and the right layout for each is
     the opposite of the other.

     An aspect-ratio query rather than a sixth flag: the shape of the frame is a
     fact the module can see for itself, and a host that has to describe its own
     geometry in a message is a contract that can disagree with reality. The
     first media query in this file, and it asks only about its own viewport. */
  body.output-only.strip-controls .module-layout {
    display: flex; flex-direction: column; align-items: stretch;
    gap: 4px; padding: 0; height: 100%; min-width: 0; min-height: 0;
  }
  /* 108px min-width would not fit a 130px lane and the pair would wrap. They
     share the width instead, which keeps them side by side as asked. */
  body.output-only.strip-controls .big-btn { min-width: 0; flex: 1 1 0; }
  body.output-only.strip-controls .player-panel { flex: 0 0 auto; }
  body.output-only.strip-controls #control-panel {
    /* `display: flex` IS THE WHOLE BUG THIS LINE FIXES. It was only in the
       wide-aspect block, so in a narrow lane nothing re-showed the panel and
       `body.output-only .module-layout > *:not(.player-panel)` went on hiding
       it. The lane showed the transport with the steppers suppressed —
       reported as "you put the playbar there instead of the steppers", which
       is precisely what it looked like. An id selector, so it beats that
       class-only rule without that rule having to know about this one. */
    display: flex;
    flex-direction: column; flex-wrap: nowrap;
    overflow-y: auto; overflow-x: hidden;
    align-items: stretch; flex: 1 1 auto; min-height: 0;
  }
  /* THE TRANSPORT GOES TO THE FOOT OF THE COLUMN, not its head. The steppers
     are what this column is for, so they get the top where reading starts, and
     Play/Stop sit low — which is also roughly where the bottom bar put them.
     `order` rather than reordering the markup: the DOM order is the authoring
     order and three other layouts read it. */
  body.output-only.strip-controls .player-panel { order: 2; }
  body.output-only.strip-controls #control-panel { order: 1; }
  body.output-only.strip-controls .strip-title   { order: 0; }
  body.output-only.strip-controls .control-row { width: auto; }
  /* A header with a rule UNDER it, the column equivalent of the bar's rule
     beside it. */
  body.output-only.strip-controls .strip-title {
    display: block; height: auto; width: 100%;
    padding: 1px 2px 3px; margin: 0 0 3px;
    border-right: none; border-bottom: 1px solid #2a2a3a;
  }

  @media (min-aspect-ratio: 2/1) {
  body.output-only.strip-controls .module-layout {
    display: flex; flex-direction: row; align-items: stretch;
    gap: 5px; padding: 0; height: 100%; min-width: 0;
  }
  body.output-only.strip-controls .big-btn { min-width: 108px; flex: 0 0 auto; }
  /* The transport keeps its intrinsic width and does not scroll away: Play is
     the one control that must always be reachable, because audio needs a
     gesture in the document that makes the sound. */
  body.output-only.strip-controls .player-panel {
    flex: 0 0 auto; height: 100%; padding: 3px;
  }
  body.output-only.strip-controls #control-panel {
    display: flex;
    flex-direction: row; flex-wrap: nowrap;
    overflow-x: auto; overflow-y: hidden;
    align-items: center; gap: 5px;
    flex: 1 1 auto; min-width: 0; height: 100%;
    padding: 3px; box-sizing: border-box;
    /* Momentum scrolling on iOS, and a scrollbar that does not eat the 44px. */
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  body.output-only.strip-controls .control-row {
    flex: 0 0 auto; width: 104px; margin-bottom: 0; gap: 0;
  }
  /* 32px, down from the column's 52: a 104px row has to hold two buttons, the
     readout and two gaps. The readout keeps ~36px — four characters, the same
     budget the column works to. */
  body.output-only.strip-controls .step-btn {
    flex: 0 0 32px; min-height: 22px; font-size: 0.75rem;
  }
  body.output-only.strip-controls .stepper-value {
    font-size: 0.62rem; padding: 2px 1px;
  }
  body.output-only.strip-controls .stepper-value.is-enum { font-size: 0.52rem; }
  /* The title, and the SEPARATOR is the right border — a rule between the
     module's name and its first stepper, which is what makes it read as a
     break in the bar rather than just another label. Smallest size that still
     renders as letters; readability is not crucial here by the author's own
     framing, and it is a separator first.
     Hidden outside the strip: the 130px column has its own heading problem and
     a vertical title is a different design, not this one at 90 degrees. */
  .strip-title { display: none; }
  body.output-only.strip-controls .strip-title {
    display: flex; align-items: center;
    flex: 0 0 auto; height: 100%;
    padding: 0 6px 0 2px;
    margin-right: 1px;
    border-right: 1px solid #2a2a3a;
    font-size: 0.5rem; letter-spacing: 0.06em;
    color: var(--dim); white-space: nowrap;
    /* It scrolls away with the steppers rather than pinning, so it reads as
       the HEAD of the group it labels. With one music module there is only one
       group; with two there would be two, and a pinned title would lie about
       which steppers you were looking at. */
  }
  body.output-only.strip-controls .strip-title {
    display: flex; align-items: center; height: 100%; width: auto;
    padding: 0 6px 0 2px; margin: 0 1px 0 0;
    border-bottom: none; border-right: 1px solid #2a2a3a;
  }
  }   /* end @media (min-aspect-ratio: 2/1) */

  body.output-only.strip-controls .control-row label {
    font-size: 0.52rem; line-height: 1.1;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  body.output-only { overflow: hidden; }
</style>
</head>
<body>

<div class="module-layout">
  <div class="panel visual-panel">
    <canvas id="spectrum"></canvas>
    <!-- Wide on purpose: it carries filenames, and it is the one control
         whose value is a word rather than a number. -->
    <select id="sample-select" aria-label="Source sample"></select>
  </div>

  <div class="panel player-panel">
    <button id="play-btn" class="big-btn play" type="button" disabled>Play</button>
    <button id="stop-btn" class="big-btn stop" type="button" disabled>Stop</button>
  </div>

  <div class="panel output-panel">
    <div class="copy-row">
      <button id="copy-script-btn" type="button" title="Copy the whole script — grammar and every stepper value">Copy Script</button>
      <button id="bake-btn" type="button" title="Render offline to WAV" disabled>Bake</button>
      <button id="save-wav-btn" type="button" title="Save the most recent bake as .wav" disabled>Save wav</button>
    </div>
    <span id="status"></span>
  </div>

  <!-- Rows are built from STEPPERS at boot, so that array stays the single
       source of order, names and ranges. -->
  <div class="panel" id="control-panel"></div>

  <!-- BD stamps its ↓↑ arrows here; a standalone sends hostChrome:false and
       the area is released. -->
  <div id="bd-arrows-slot" class="dock-slot"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<script>
'use strict';

// ── Controls ───────────────────────────────────────────────────────────
// `regen: true` means a change rebuilds the trajectory; anything else is a
// live audio parameter and takes effect without a rebuild.
const STEPPERS = [
  { name: 'iterations',        min: 3,    max: 8,   step: 1,    fallback: 6,    regen: true },
  // ── WHERE IN THE STRING TO BEGIN, in THOUSANDS of symbols (2026-10-06) ──
  // The control `iterations` could never be. Measured: across twelve settings
  // from 0 to 177k this gives TWELVE distinct figures, where `iterations`
  // gives five across its whole range and 6 and 8 are byte-identical.
  //
  // The reason is structural. The grammar is prefix-stable or near enough, so
  // the fractal is ONE ENDLESS STRING and depth only ever extends it — the
  // only thing you can hear is WHERE YOU BEGIN. The skip mechanism already
  // held a position in that string; it just had no control attached, and the
  // one position it chose (the shared opening) is the one place the material
  // repeats its own shape by construction.
  //
  // ADDED to the shared opening rather than replacing it, so `start_at` 0 is
  // exactly the behaviour before this existed and `iterations` keeps whatever
  // meaning it had.
  //
  // In THOUSANDS because the useful range is six figures wide and a stepper
  // readout is three characters: 2.5 says 2,500. The status line prints the
  // real count so the unit is never a guess. Clamped at generation to 25% of
  // the iteration's actual length — the string is finite and short iterations
  // are much shorter — and the clamp is REPORTED, never silent.
  { name: 'start_at',          min: 0,    max: 200, step: 0.1,  fallback: 0,    decimals: 1, regen: true },
  { name: 'step_seconds',      min: 0.05, max: 4,   step: 0.05, fallback: 0.5,  regen: true },
  { name: 'detune_span',       min: 0,    max: 24,  step: 1,    fallback: 12,   regen: true },
  { name: 'scale',             min: 0,    max: 4,   step: 1,    fallback: 0,    isEnum: true, regen: true },
  { name: 'grain_size',        min: 0.02, max: 1,   step: 0.01, fallback: 0.2 },
  { name: 'grain_from_run',    min: 0,    max: 1,   step: 0.05, fallback: 0.4 },
  // max 200 (2026-10-06), raised from 60 to guarantee decoupling from channel 1.
  //
  // THIS NOTE REPLACES AN OBSOLETE ONE. It used to warn that the trajectory was
  // only `duration / step_seconds` points — ten at the default — so that any
  // offset past the end clamped to a constant drone. True when written, and
  // wrong as soon as generation stopped being bounded by `duration`: there are
  // 12,000 points now, and the clamp touches only the last 200 of them. An
  // offset anywhere in 0-200 reads ahead in the walk at every iteration. Do not
  // raise `duration` for this; it governs Bake length and nothing else.
  //
  // WHICH OFFSET. The offset indexes TRAJECTORY POINTS, and the useful question
  // is how much channel 2 still ECHOES channel 1.
  //
  // WHAT "ECHO" MEANS HERE, EXACTLY — the first version of this note got it
  // wrong and said "sounding the same pitch", which is not what is measured and
  // not even possible at most settings. The figures below compare the two
  // voices' RAW TRAJECTORY VALUES, before ch2_cents is added. So a match means
  // the two are at the SAME INTERVAL as each other — moving in PARALLEL, ch2 a
  // rigid transposed copy of ch1 — not at the same frequency.
  //
  // Parallel motion is the right thing to measure, because it is what makes a
  // second voice redundant. But the two questions it is NOT answering are worth
  // having the answers to, both measured at the shipped defaults over 11,900
  // instants:
  //
  //   TRUE UNISON, the same sounding frequency:        0 instants, 0.00%
  //   an exact OCTAVE apart in sounding pitch:     1,683 instants, 14.1%
  //
  // Unison is almost unreachable by construction: with nine pitches spanning
  // -900 to +1000 cents and ch2 at +1700, exactly ONE pair could collide (ch1 at
  // +1000 against ch2's raw -700) and that pair never co-occurs at this offset.
  // The octave figure looks alarming and is not: the chance floor for sharing a
  // pitch class at ch2_cents 1700 is 14.4%, so 14.1% is coincidence to within
  // measurement — there is no structural octave fusion to avoid.
  //
  // RE-MEASURED FOR THE CURRENT GRAMMAR (2026-10-06). The first version of this
  // table was taken under the rules that began with their own non-terminal, and
  // became wrong the moment those stopped being the default: the echo peaks sit
  // on the grammar's own block boundaries, so they MOVE when the grammar does.
  // A measurement is only a fact about the thing measured.
  //
  //   offset     4   36    2  112  116   76   80  |  46   60   62   64   52   48
  //   parallel  50%  43%  38%  35%  33%  32%  32%  | 14%  14%  14%  14%  15%  15%
  //
  // 11.7% is the floor — the probability that two UNRELATED instants of this
  // material happen to sit at the same interval, computed from the pitch
  // histogram as the sum of its squared proportions. The right-hand group is as
  // independent as two voices from one walk can be, and the freshest band is a
  // broad one, 46 to 66.
  //
  // Identical to the integer at iterations 5, 6 and 7, which is not a slip: the
  // echo at a given offset is a property of the REWRITING, so it is the same
  // wherever in the string you start. The iteration changes which material you
  // hear (verified differing from the second note, agreeing only at the floor),
  // not how it rhymes with itself.
  //
  // IT IS NOT MONOTONIC, which is the trap: 112 echoes more than 40, and 36
  // more than 8. A bigger offset is not a safer one.
  //
  // The default is 100: parallel 21.3% against the 11.7% floor, so ch2 tracks
  // ch1 about twice as often as chance — the author's choice by ear, and
  // deliberately not the freshest available. Parallel motion measures
  // DIFFERENCE, not interest, and some rhyme between the two voices is a
  // musical decision this number has no standing to overrule.
  //
  // ODD offsets all score 0%, but that is the measure failing rather than
  // freshness: the turtle alternates axes, so adjacent points can never share a
  // pitch. Rigid anti-phase is a kind of dependence too. The table is even
  // offsets for that reason.
  { name: 'offsetCH2',         min: 0,    max: 200, step: 1,    fallback: 12 },
  // ── CHANNEL 2's OWN LEVEL AND INTERVAL (2026-10-03) ────────────────────
  // Added to diagnose a monotonous high pulse at about the grain rate. The
  // level lets channel 2 be muted outright (-60 dB) so it can be ruled in or
  // out by ear; the interval is the likely CAUSE and is now adjustable.
  //
  // WHY THE INTERVAL CAUSES IT. GrainPlayer gives each grain a time slot of
  // grainSize but computes its playback rate from `detune`. At +2400 cents the
  // rate is 4, so a 0.45 s grain READS 1.8 s of material while the next grain
  // starts only 0.45 s along the buffer — every boundary is a 1.35 s jump
  // backwards, repeating at the grain rate. Channel 1, at detune near zero,
  // has no such mismatch. The pulse is therefore an artefact of a large
  // interval, not of the material.
  //
  // Lower intervals shrink the mismatch proportionally: +1200 reads 2x and
  // jumps 0.45 s, +700 reads 1.5x and jumps 0.22 s, 0 jumps not at all.
  { name: 'ch2_level',         min: -60,  max: 6,   step: 1,    fallback: -5 },
  { name: 'ch2_cents',         min: 0,    max: 2400, step: 100, fallback: 2400 },
  { name: 'overlap',           min: 0,    max: 0.5, step: 0.01, fallback: 0.1 },
  { name: 'playback_rate',     min: 0.1,  max: 2,   step: 0.05, fallback: 1 },
  // BAKE LENGTH ONLY, since 2026-10-06. It used to bound the trajectory and
  // therefore the repeat interval too, which made the loop a musical feature
  // when it is meant to be a safety net for running out of notes. Playback now
  // runs the whole trajectory and repeats only at its natural end.
  //
  // Kept at this name rather than renamed: RULE 1 says a script carries the
  // form it was read in, and stored scripts already say %%bd_p_duration.
  { name: 'duration',          min: 5,    max: 300, step: 5,    fallback: 60 },
  { name: 'reverb_wet',        min: 0,    max: 1,   step: 0.05, fallback: 0.45 },
  { name: 'reverb_decay',      min: 0.1,  max: 20,  step: 0.1,  fallback: 4 },
  { name: 'vibrato_frequency', min: 0.5,  max: 20,  step: 0.1,  fallback: 3 },
  { name: 'vibrato_depth',     min: 0,    max: 1,   step: 0.05, fallback: 0.1 },
  { name: 'chorus_wet',        min: 0,    max: 1,   step: 0.05, fallback: 0.3 },
  { name: 'chorus_depth',      min: 0,    max: 1,   step: 0.05, fallback: 0.4 },
  { name: 'loop',              min: 0,    max: 1,   step: 1,    fallback: 1,    isToggle: true },
  // ── OUTPUT STAGE (2026-10-02) ──────────────────────────────────────────
  // Marked _p_ and therefore SAVED IN THE SCRIPT, which is the whole point:
  // these exist so a drone can be balanced against something else — speech,
  // another module — and the balance kept. A mix setting that cannot be
  // written down has to be found again every time.
  //
  // dB, not a 0..1 fraction, because dB is the unit the ear works in and the
  // unit anyone reading the script will expect. 0 means unchanged.
  { name: 'volume',            min: -40,  max: 6,   step: 0.5,  fallback: 0 },
  { name: 'bass',              min: -12,  max: 12,  step: 0.5,  fallback: 0 },
  { name: 'treble',            min: -12,  max: 12,  step: 0.5,  fallback: 0 },
  { name: 'balance',           min: -1,   max: 1,   step: 0.05, fallback: 0 },
];

const SCALES = {
  minor:          [0, 2, 3, 5, 7, 8, 10],
  major:          [0, 2, 4, 5, 7, 9, 11],
  min_pentatonic: [0, 3, 5, 7, 10],
  maj_pentatonic: [0, 2, 4, 7, 9],
  blues:          [0, 3, 5, 6, 7, 10],
};
const SCALE_NAMES = Object.keys(SCALES);
const ENUM_VALUES = { scale: SCALE_NAMES };
// Display aliases: the canonical name goes in the script, a shorter label
// fits the narrow cell. Both directions, because a readout needs its inverse.
// Display aliases exist because the readout is NARROW: about 26px of content
// once its border and padding are off, which is under four characters at this
// font. `min_pent` was eight and rendered as "min_", which does not read as a
// scale at all — it reads as a bug. The canonical name always goes in the
// script, so these are free to be terse.
const ENUM_DISPLAY = {
  minor: 'min', major: 'maj',
  min_pentatonic: 'minP', maj_pentatonic: 'majP',
  blues: 'blue',
};
const ENUM_DISPLAY_INV = Object.fromEntries(
  Object.entries(ENUM_DISPLAY).map(([canonical, shown]) => [shown, canonical]));

// The bundled samples, named by a directive so a shared script says which
// sound it means — a granular drone IS its source file, so a script that did
// not name it would reproduce nothing. Licence and provenance per file are in
// sources/SOURCES.md.
//
// The real list is fetched from sources/manifest.json, which make_manifest.py
// generates by scanning the directory. A browser cannot read a directory —
// there is no API and express.static serves no index — so the listing has to
// be made ahead of time and fetched as data. A manifest rather than a server
// endpoint because an endpoint would work in BD and fail in a standalone on
// GitHub Pages, and the standalone is the point of publishing these at all.
//
// This literal is the FALLBACK, for when the fetch fails: opened from file://
// it will, and the module should still make a sound rather than sit mute.
let SAMPLES = { synth_pad_a2: 'sources/synth_pad_A2.mp3' };
let SAMPLE_LABELS = { paulx_drone: 'paulx drone' };
let DEFAULT_SAMPLE = 'synth_pad_a2';

async function loadManifest() {
  try {
    const res = await fetch('sources/manifest.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const list = (data && data.samples) || [];
    if (!list.length) throw new Error('manifest lists no samples');
    SAMPLES = {}; SAMPLE_LABELS = {};
    for (const e of list) {
      // encodeURIComponent on the FILENAME only: the names carry spaces and
      // capitals, and a raw space in a URL is not fetched. The id never does,
      // which is why the script names the id and not the file.
      //
      // ?v=<content hash> is not decoration. The MP3s are served
      // `public, max-age=0` locally and from a CDN once published, so without
      // a versioned URL a rebuilt sample can go on sounding like the old one
      // indefinitely — with the canary saying the page is current, which makes
      // you doubt the edit instead of the cache. Cost a round exactly that way
      // when all three pads were rebuilt an octave lower and sounded identical.
      SAMPLES[e.id] = 'sources/' + encodeURIComponent(e.file) + (e.v ? '?v=' + e.v : '');
      SAMPLE_LABELS[e.id] = e.label || e.id;
    }
    if (!SAMPLES[DEFAULT_SAMPLE]) DEFAULT_SAMPLE = list[0].id;
  } catch (err) {
    console.warn('sample manifest unavailable, using the built-in list: ' + err.message);
  }
  buildSampleSelect();
}

function buildSampleSelect() {
  const sel = document.getElementById('sample-select');
  if (!sel) return;
  const current = (params && params.sample) || DEFAULT_SAMPLE;
  sel.innerHTML = '';
  for (const id of Object.keys(SAMPLES)) {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = SAMPLE_LABELS[id] || id;
    if (id === current) opt.selected = true;
    sel.appendChild(opt);
  }
}

// Safety caps. Grammar growth is exponential per iteration; without a ceiling
// a high iteration count asks for billions of symbols and takes the tab with
// it. Fractal learned this the hard way — the symptom is silence, not an error.
//   MAX_WALK_CHARS         how many POST-SKIP symbols are worth KEEPING
//   MAX_SYMBOLS_TRAVERSED  how many symbols are worth WALKING PAST
//
// The second used to be MAX_TOTAL_EMISSION at 5,000,000, and it was a MEMORY
// ceiling: every symbol walked was a character stored and, two in five of them,
// a segment object. Since expandAndWalk traverses the shared opening without
// storing it, memory no longer depends on the iteration — so this is a TIME
// ceiling now, and it is set by how long a pause is tolerable rather than by
// how much heap is safe. Measured END TO END through buildTrajectory, default
// rules (which multiply about ninefold per iteration):
//
//   iteration         6        7        8        9        10
//   shared opening    148 k    1.3 M    12.0 M   107.6 M  968.6 M
//   first move        28 ms    52 ms    396 ms   ~3 s     ~30 s
//   same iter again   13 ms    24 ms    156 ms
//
// The first move at an iteration costs about twice the rest, because measuring
// the shared opening walks the prefix once more; sharedOpening() memoises, so
// only the first move pays it.
//
// 20 million admits iteration 8 and refuses 9, which is where the pause starts
// to read as a hang. Raise it to 150 million if a ~3 second first move is
// acceptable; the memory will not move, because none of this is stored.
const MAX_WALK_CHARS        = 300000;
const MAX_SYMBOLS_TRAVERSED = 20000000;
// 12,000 rather than 4,000 (2026-10-06). This is now the ONLY thing deciding
// how long the music plays before it repeats, so it wants to be generous: at
// step_seconds 2.00 it is ~6.7 hours, at 0.05 about ten minutes. Each point is
// a small object and one Transport event, and Tone's timeline is a sorted array
// with binary search, so twelve thousand is comfortable.
const MAX_POINTS         = 12000;

const controlPanel = document.getElementById('control-panel');

const statusEl   = document.getElementById('status');
const playBtn    = document.getElementById('play-btn');
const stopBtn    = document.getElementById('stop-btn');
const bakeBtn    = document.getElementById('bake-btn');
const saveWavBtn = document.getElementById('save-wav-btn');
const canvas     = document.getElementById('spectrum');

const postToParent = (msg) => { try { window.parent.postMessage(msg, '*'); } catch (_) {} };

// ── Forward this module's console to the host ──────────────────────────
// Best-effort and non-fatal by construction: a logger that can break the
// thing it is logging is worse than no logger. An Error JSON.stringifies to
// "{}" because message and stack are non-enumerable, hence the special case.
(function forwardModuleConsole() {
  const send = (level, args) => {
    try {
      const line = Array.prototype.map.call(args, (a) => {
        if (typeof a === 'string') return a;
        if (a instanceof Error) return a.message + (a.stack ? ' | ' + a.stack.split('\n')[1] : '');
        try { return JSON.stringify(a); } catch (_) { return String(a); }
      }).join(' ');
      postToParent({ type: 'bd_module_log', level: level, line: line.slice(0, 600) });
    } catch (_) {}
  };
  ['log', 'warn', 'error'].forEach((level) => {
    const original = console[level].bind(console);
    console[level] = function () { send(level, arguments); original.apply(console, arguments); };
  });
})();

function setStatus(msg, isErr) {
  statusEl.textContent = isErr ? (msg || '') : '';
  postToParent({ type: 'BD_STATUS', text: isErr ? (msg || '') : '', isErr: !!isErr });
}

// ── THE MODULE'S NAME, AT THE HEAD OF ITS OWN STEPPER AREA ────────────
// "A one line title break in the stepper bar with the name of the module, in
// the smallest possible font" — the author's, and the title belongs IN the
// stepper bar rather than being positioned over it by the host. That matters
// for more than tidiness: each module then labels its own group, so the labels
// appear in whatever order the host places the modules, which is the script's
// order. Nothing has to be told twice and nothing can disagree.
//
// Its own identity, not a value read from the script: this file IS
// bd_M_DroneFrac, and deriving that from a directive would let a script rename
// the module in its own label.
{
  const stripTitle = document.createElement('div');
  stripTitle.className = 'strip-title';
  stripTitle.textContent = 'bd_M_DroneFrac';
  controlPanel.appendChild(stripTitle);
}

// ── Stepper rows ───────────────────────────────────────────────────────
STEPPERS.forEach((s) => {
  const row = document.createElement('div');
  row.className = 'control-row';
  row.dataset.name = s.name;
  row.innerHTML =
    '<div class="stepper">' +
      '<button class="step-btn" type="button" data-name="' + s.name + '" data-delta="-1">−</button>' +
      '<span class="stepper-value' + (s.isEnum ? ' is-enum' : '') + '" data-name="' +
        s.name + '">' + formatDisplay(s, s.fallback) + '</span>' +
      '<button class="step-btn" type="button" data-name="' + s.name + '" data-delta="1">+</button>' +
    '</div>' +
    '<label>' + s.name + '</label>';
  controlPanel.appendChild(row);
});

function formatDisplay(spec, val) {
  // 'true'/'false', never 'on'/'off'. The readout must say what the DIRECTIVE
  // says: the script carries `%%bd_loop true`, and a control reading "on"
  // beside it invites the reader to wonder whether they are the same thing.
  if (spec.isToggle) return val >= 0.5 ? 'true' : 'false';
  if (spec.isEnum) {
    const v = (ENUM_VALUES[spec.name] || [])[Math.round(val)] || (ENUM_VALUES[spec.name] || [])[0];
    return ENUM_DISPLAY[v] || v;
  }
  // An explicit decimal count wins over the size-based rule below, which
  // would otherwise print 177.9 as "178" — and getStepperValue reads the
  // DISPLAY back, so the fraction would be destroyed by looking at it.
  if (spec.decimals != null) return val.toFixed(spec.decimals);
  if (spec.step >= 1) return String(Math.round(val));
  if (val < 1)  return val.toFixed(2);
  if (val < 10) return val.toFixed(2);
  return String(Math.round(val));
}
function getStepperValue(name) {
  const s = STEPPERS.find((x) => x.name === name);
  if (!s) return null;
  const span = controlPanel.querySelector('.stepper-value[data-name="' + name + '"]');
  if (!span) return s.fallback;
  const txt = span.textContent.trim();
  // The INVERSE of formatDisplay, and it has to move with it. Fractal's read
  // tested `txt === 'on'`, so the moment the readout began saying 'true'
  // every read of loop returned 0 and the value flipped itself off on the
  // next press, silently. 'on' is still accepted for the same reason.
  if (s.isToggle) return (txt === 'true' || txt === 'on') ? 1 : 0;
  if (s.isEnum) {
    const vals = ENUM_VALUES[s.name] || [];
    const idx = vals.indexOf(ENUM_DISPLAY_INV[txt] || txt);
    return idx >= 0 ? idx : s.fallback;
  }
  const v = parseFloat(txt);
  return Number.isFinite(v) ? v : s.fallback;
}
function setStepperValue(name, val) {
  const s = STEPPERS.find((x) => x.name === name);
  if (!s) return;
  let clamped = Math.max(s.min, Math.min(s.max, val));
  if (s.isToggle) clamped = clamped >= 0.5 ? 1 : 0;
  const span = controlPanel.querySelector('.stepper-value[data-name="' + name + '"]');
  if (span) span.textContent = formatDisplay(s, clamped);
}

// ── Script parsing ─────────────────────────────────────────────────────
// `(?:p_)?` everywhere: a directive may be written %%bd_p_<name> to ask for
// a control. The mark is PRESENTATION and never part of the identity, so
// every read must see through it.
function parseScript(text) {
  const g = {
    axiom: 'X',
    rules: { X: 'FYFX+F+YFXFY-F-XFYFX', Y: 'FXFY-F-XFYFX+F+YFXFY' },
    angle: 90,
    sample: DEFAULT_SAMPLE,
    marked: new Set(),
  };
  for (const s of STEPPERS) g[s.name] = s.fallback;

  const lines = (text || '').split('\n');
  for (const raw of lines) {
    const line = raw.trim();
    const m = line.match(/^%%bd_(p_)?([a-z_0-9]+)\s*(.*)$/i);
    if (!m) continue;
    const marked = !!m[1];
    const key = m[2];
    const val = (m[3] || '').trim();
    if (marked) g.marked.add(key);

    if (key === 'axiom') { if (val) g.axiom = val; continue; }
    if (key === 'rule') {
      const c = val.indexOf(':');
      if (c > 0) g.rules[val.slice(0, c).trim()] = val.slice(c + 1).trim();
      continue;
    }
    if (key === 'angle')  { const v = parseFloat(val); if (Number.isFinite(v)) g.angle = v; continue; }
    if (key === 'sample') { if (val && SAMPLES[val]) g.sample = val; continue; }

    const spec = STEPPERS.find((x) => x.name === key);
    if (!spec) continue;
    if (spec.isToggle)    { g[key] = /^(true|on|1|yes)$/i.test(val) ? 1 : 0; continue; }
    if (spec.isEnum) {
      const vals = ENUM_VALUES[key] || [];
      const idx = vals.indexOf(val);
      if (idx >= 0) g[key] = idx;
      continue;
    }
    const v = parseFloat(val);
    if (Number.isFinite(v)) g[key] = Math.max(spec.min, Math.min(spec.max, v));
  }
  return g;
}

// RULE 2: a script with NO mark anywhere keeps every control shown, so
// nothing already written, saved or shared changes behaviour. Once a script
// marks anything it is taken to mean exactly what it says.
function applyControlVisibility(marked) {
  const any = marked && marked.size > 0;
  for (const s of STEPPERS) {
    const row = controlPanel.querySelector('.control-row[data-name="' + s.name + '"]');
    if (row) row.hidden = any && !marked.has(s.name);
  }
  // The sample selector obeys the same rule even though it is not a stepper:
  // `sample` is script state like any other, and a script that marks some
  // directives and not this one is saying it does not want the control.
  const sel = document.getElementById('sample-select');
  if (sel) sel.hidden = any && !marked.has('sample');
}

// RULE 1: the writer must reconstruct the form it READ. A script that arrived
// carrying %%bd_p_grain_size must go back carrying %%bd_p_grain_size, or
// merely moving a stepper would silently change which controls appear.
function currentScript() {
  let text = storedText || '';
  const setters = {};
  for (const s of STEPPERS) {
    const v = getStepperValue(s.name);
    if (s.isToggle)      setters[s.name] = v >= 0.5 ? 'true' : 'false';
    else if (s.isEnum)   setters[s.name] = (ENUM_VALUES[s.name] || [])[Math.round(v)] || '';
    else if (s.decimals != null) setters[s.name] = v.toFixed(s.decimals);
    else if (s.step >= 1) setters[s.name] = String(Math.round(v));
    else                 setters[s.name] = v.toFixed(2);
  }
  // `sample` is not a stepper but it IS script state, and RULE 1 applies to it
  // the same way: without this the dropdown would change the sound and the
  // script would go on naming the old file, so Copy Script would hand someone
  // a drone they had never heard.
  if (params && params.sample) setters.sample = params.sample;
  // (the %%bd_p_ / %%bd_ form is preserved by the loop below, same as a stepper)
  for (const [key, val] of Object.entries(setters)) {
    const reMarked = new RegExp('^%%bd_p_' + key + '\\s+.*$', 'm');
    const rePlain  = new RegExp('^%%bd_' + key + '\\s+.*$', 'm');
    const isMarked = reMarked.test(text);
    const re   = isMarked ? reMarked : rePlain;
    const line = '%%bd_' + (isMarked ? 'p_' : '') + key + ' ' + val;
    if (re.test(text)) { text = text.replace(re, line); continue; }
    // Absent: insert after the last directive rather than appending at the
    // end, so a trailing prose paragraph stays below the block.
    const ls = text.split('\n');
    let lastBd = -1;
    for (let i = 0; i < ls.length; i++) if (/^%%bd_/.test(ls[i])) lastBd = i;
    ls.splice(lastBd + 1, 0, line);
    text = ls.join('\n');
  }
  return text;
}

// ── L-system ───────────────────────────────────────────────────────────
// How long iteration N would be, WITHOUT materialising it. Recursion with
// memoisation on (symbol, remaining-depth). Needed by the skip mechanism:
// knowing how big iteration N-1 is tells us how many leading symbols of
// iteration N are material we have already heard.
function computeExpansionLength(axiom, rules, iterations) {
  const cache = new Map();
  function len(sym, depth) {
    if (depth === 0 || rules[sym] === undefined) return 1;
    const key = sym + '@' + depth;
    if (cache.has(key)) return cache.get(key);
    let total = 0;
    const rule = rules[sym];
    for (let i = 0; i < rule.length; i++) total += len(rule[i], depth - 1);
    cache.set(key, total);
    return total;
  }
  let total = 0;
  for (const ch of axiom) total += len(ch, iterations);
  return total;
}

// ── HOW MUCH OF THE OPENING IS MATERIAL WE HAVE ALREADY HEARD ──────────
// MEASURED, not assumed (2026-10-06). This was `L(iterations - 1)`, on the
// reasoning that iteration N opens with iteration N-1. That is true of the
// DEFAULT grammar and of nothing else: it holds only because the rule for X
// BEGINS with X, so expanding X to depth N starts by expanding X to depth N-1.
//
// For those rules the shared opening is the whole previous string. Delete the
// one leading symbol from each rule and it collapses to about N symbols,
// because the recursion becomes shared(N) = 2 + shared(N-2) instead of a
// ninefold multiplication. Measured both ways:
//
//   iteration            3       4        5          6
//   rules as given       1,821   16,401   147,621    1,328,601
//   leading X and Y cut  3       4        5          6
//
// The grammar lives in the SCRIPT, so a user can type either kind — and the
// hardwired formula was silently wrong for every grammar but the one it was
// derived from. So compare the two expansions symbol by symbol and skip
// exactly what they actually share.
//
// Two streams advanced in lockstep; neither string is ever materialised.
function symbolStream(axiom, rules, iterations) {
  const stack = [{ expansion: axiom, index: 0, depth: iterations }];
  return function next() {
    while (stack.length > 0) {
      const frame = stack[stack.length - 1];
      if (frame.index >= frame.expansion.length) { stack.pop(); continue; }
      const sym = frame.expansion[frame.index];
      frame.index++;
      const rule = rules[sym];
      if (frame.depth === 0 || rule === undefined) return sym;
      stack.push({ expansion: rule, index: 0, depth: frame.depth - 1 });
    }
    return null;                            // exhausted
  };
}

// Memoised, because the cost is O(shared opening) — which for the default rules
// is the same order as the walk itself, so paying it on every stepper move
// would double generation time. Keyed on the grammar AND the iteration, since
// both decide the answer.
const sharedOpeningCache = new Map();
function sharedOpening(axiom, rules, iterations, cap) {
  if (iterations < 1) return 0;
  const key = axiom + '|' + JSON.stringify(rules) + '|' + iterations + '|' + cap;
  if (sharedOpeningCache.has(key)) return sharedOpeningCache.get(key);
  const a = symbolStream(axiom, rules, iterations);
  const b = symbolStream(axiom, rules, iterations - 1);
  let n = 0;
  while (n < cap) {
    const x = a(), y = b();
    // y === null means iteration N-1 ran out: all of it is repeated by N.
    if (x === null || y === null || x !== y) break;
    n++;
  }
  sharedOpeningCache.set(key, n);
  return n;
}

// ── EXPANSION AND TURTLE, FUSED (2026-10-06) ───────────────────────────
// These were two functions: expandLSystem built the whole string, turtleWalk
// turned it into segments, and buildTrajectory then threw the leading ones
// away. At iteration 7 that discarded 531,440 of 651,441 segment objects —
// 82% of the work, and it was 45 MB of a 54 MB peak.
//
// The prefix cannot simply be skipped: the turtle's x, y and heading where the
// kept material begins depend on every turn before it, and `isHorizontal` —
// the thing deciding which runs carry pitch at all — comes from the heading.
// But those are THREE SCALARS. Nothing else about the prefix is ever read.
//
// So the two stages are fused and the prefix is TRAVERSED WITHOUT BEING
// STORED: no string for it, no segment objects. Measured, peak memory stops
// depending on the iteration at all — peak flat near 7 MB where iteration 7
// cost 45 MB, and under 1 MB resident once the segments are collected — and
// what grows instead is time. Two separate functions cannot do this: the
// intermediate string IS the thing being avoided.
//
// It is also FASTER, which was not the point but follows: 97 ms to 52 ms at
// iteration 7, since a 1.6 M-character string and 651,441 objects are no
// longer built and then discarded. Verified byte-identical output against the
// two-function version at every iteration from 3 to 7, trajectory points and
// diagnostics alike.
//
// Rewriting is context-free — each symbol's expansion depends only on itself —
// so iteration N's symbols can be emitted one at a time by depth-first walk
// without ever materialising an intermediate iteration. An explicit stack, not
// a generator, to avoid per-yield GC pressure at million-symbol outputs.
//
// Turtle: F forward, + turn CCW, - turn CW. Heading in degrees, 0 = east.
// Only F, + and - are acted on; X and Y shape the string and are never walked,
// which is what makes the grammar two-layered.
function expandAndWalk(axiom, rules, iterations, angleDeg,
                       skipSymbols, keepSymbols, traverseCap) {
  const segs = [];
  let x = 0, y = 0, heading = 0;
  let n = 0;                 // absolute symbol index, prefix included
  let kept = 0;              // symbols emitted past the shared opening
  let skippedSegs = 0;       // segments the prefix would have produced
  let truncated = false;
  const stack = [{ expansion: axiom, index: 0, depth: iterations }];
  while (stack.length > 0) {
    if (kept >= keepSymbols) { truncated = true; break; }
    // A TIME guard where MAX_TOTAL_EMISSION was a MEMORY guard: the prefix no
    // longer costs memory, but it still has to be walked.
    if (n >= traverseCap)    { truncated = true; break; }
    const frame = stack[stack.length - 1];
    if (frame.index >= frame.expansion.length) { stack.pop(); continue; }
    const sym = frame.expansion[frame.index];
    frame.index++;
    const rule = rules[sym];
    if (frame.depth > 0 && rule !== undefined) {
      stack.push({ expansion: rule, index: 0, depth: frame.depth - 1 });
      continue;
    }
    const keeping = n >= skipSymbols;
    if (sym === 'F') {
      const rad = heading * Math.PI / 180;
      const dx = Math.cos(rad), dy = Math.sin(rad);
      if (keeping) segs.push({ symIdx: n, x1: x, y1: y, isHorizontal: Math.abs(dx) > 0.5 });
      else skippedSegs++;
      x += dx; y += dy;
    } else if (sym === '+') heading = (heading + angleDeg) % 360;
    else if (sym === '-')   heading = (heading - angleDeg + 360) % 360;
    n++;
    if (keeping) kept++;
  }
  return { segs: segs, truncated: truncated, skippedSegs: skippedSegs, symbols: n };
}

// Collapse consecutive same-direction segments into runs. A horizontal run at
// one height becomes ONE trajectory point whose length is how long to hold it.
function collapseRuns(segments) {
  const out = [];
  let i = 0;
  while (i < segments.length) {
    const seg = segments[i];
    let runLen = 1, j = i + 1;
    if (seg.isHorizontal) {
      const y = Math.round(seg.y1);
      while (j < segments.length && segments[j].isHorizontal
             && Math.round(segments[j].y1) === y) { runLen++; j++; }
    } else {
      while (j < segments.length && !segments[j].isHorizontal) { runLen++; j++; }
    }
    out.push({ symIdx: seg.symIdx, x1: seg.x1, y1: seg.y1,
               isHorizontal: seg.isHorizontal, length: runLen });
    i = j;
  }
  return out;
}

// Pitch reflection, ported from bd_M_Fractal and the most musically
// consequential rule in either file. Walk the raw y-deltas as a particle
// bouncing between walls at ±span. When a step would cross a wall, flip
// direction and RETRY — the step is bounced back into range rather than
// consumed, so the effective y never leaves [-span, +span]. Without it a long
// walk drifts out of audibility; with it, it sings.
function applyReflection(runs, span) {
  const out = [];
  // span 0 is a REACHABLE stepper value and the bounce below cannot survive
  // it: both walls sit at 0, so every candidate step fails the bounds test,
  // direction flips for ever and `remaining` never decrements — an infinite
  // loop that takes the tab, not an error. Zero span means "no pitch
  // movement", so answer it directly.
  if (!(span > 0)) {
    for (const run of runs) {
      out.push(run.isHorizontal
        ? { x1: run.x1, y1: 0, isHorizontal: true, length: run.length }
        : run);
    }
    return out;
  }
  let prevRawY = null, effY = 0, direction = 1;
  for (const run of runs) {
    if (!run.isHorizontal) { out.push(run); continue; }
    const rawY = Math.round(run.y1);
    if (prevRawY !== null) {
      const delta = rawY - prevRawY;
      if (delta !== 0) {
        let step = (delta > 0 ? 1 : -1) * direction;
        let remaining = Math.abs(delta);
        while (remaining > 0) {
          const next = effY + step;
          if (next > span || next < -span) { step = -step; direction = -direction; }
          else { effY = next; remaining--; }
        }
      }
    } else {
      // Seed from the raw starting y wrapped into the span, not always 0:
      // different iterations begin at genuinely different absolute y, so this
      // is what gives each iteration a distinct opening colour.
      effY = span > 0 ? (((rawY % span) + span) % span) : 0;
    }
    prevRawY = rawY;
    out.push({ x1: run.x1, y1: effY, isHorizontal: true, length: run.length });
  }
  return out;
}

// ── The trajectory ─────────────────────────────────────────────────────
// Where this module earns its existence. Two axes, two destinations, nothing
// in between to collapse them:
//
//   y          → detune, quantised to the scale, in CENTS
//   run length → grainSize, blended by grain_from_run
//
// Computed ENTIRELY before playback — like the note list in the other
// modules, nothing here is derived while sound is happening.
let trajectory = [];
let trajectoryInfo = { points: 0, truncated: false, span: 0 };

function buildTrajectory(g) {
  // THE SKIP MECHANISM, ported from bd_M_Fractal — without it `iterations` CAN
  // be an inert control. Iteration N's string may OPEN with material already
  // heard at iteration N-1, in which case taking the first runs of it gives the
  // same trajectory at every setting: measured 3, 6 and 8 producing
  // byte-identical output under the default grammar. Skipping that shared
  // opening is what makes a higher iteration a DIFFERENT piece rather than the
  // same opening at greater expense.
  //
  // How much is shared is MEASURED per grammar now rather than assumed — see
  // sharedOpening(). Under the default rules it is the whole previous string;
  // under a grammar whose rules do not begin with their own non-terminal it is
  // a handful of symbols, and `iterations` then needs no skip at all to mean
  // something. The old formula was right about one grammar and silently wrong
  // about every other.
  let iter = Math.round(g.iterations);
  let skipSymbols = sharedOpening(g.axiom, g.rules, iter, MAX_SYMBOLS_TRAVERSED);
  // If the shared opening alone would blow the traversal ceiling there is
  // nothing left to keep, so drop the effective iteration until it fits.
  // Silent truncation here would read as "the module plays nothing".
  let iterReduced = false;
  while (iter > 1 && skipSymbols + 2000 > MAX_SYMBOLS_TRAVERSED) {
    iter--;
    skipSymbols = sharedOpening(g.axiom, g.rules, iter, MAX_SYMBOLS_TRAVERSED);
    iterReduced = true;
  }
  // ── start_at: the position control, in thousands of symbols ──────────
  // Added to the shared opening, so 0 reproduces the behaviour from before it
  // existed. Clamped to a quarter of the iteration's real length — which is
  // what computeExpansionLength is for, and its only remaining job now that
  // the skip is measured rather than computed from it.
  const totalSymbols = computeExpansionLength(g.axiom, g.rules, iter);
  const startRequested = Math.max(0, Math.round((g.start_at || 0) * 1000));
  const startLimit = Math.floor(totalSymbols * 0.25);
  const startAt = Math.min(startRequested, startLimit);
  const startClamped = startAt < startRequested;
  skipSymbols += startAt;

  const degrees = SCALES[(ENUM_VALUES.scale || [])[Math.round(g.scale)]] || SCALES.minor;

  // detune_span is in SEMITONES, because that is what the name says — but the
  // reflection bounces in SCALE DEGREES, and the two are not the same unit.
  // Walling the bounce at `span` degrees made span 12 reach ±2100 cents, call
  // it a minor seventeenth, when it had promised an octave. Convert.
  const wall = Math.max(0, Math.round(g.detune_span / 12 * degrees.length));

  const walk = expandAndWalk(g.axiom, g.rules, iter, g.angle,
                             skipSymbols, MAX_WALK_CHARS, MAX_SYMBOLS_TRAVERSED);
  const runs = applyReflection(collapseRuns(walk.segs), wall);

  // The longest run in THIS grammar, so grain_from_run spans its full effect
  // whatever the rules produce. Normalising against a fixed constant made the
  // control nearly inert: real run lengths here are 2–5, so a hard-coded
  // ceiling of 8 used only the bottom third of the range.
  let maxRun = 1;
  for (const r of runs) if (r.isHorizontal && r.length > maxRun) maxRun = r.length;

  // ── HOW MUCH OF THE WALK TO TURN INTO MUSIC (corrected 2026-10-06) ───
  // This was bounded by `duration`, which was wrong and conflated three
  // different things. The author put it plainly: **the loop is not a musical
  // feature — it is a safety net for running out of notes.** With 60,000 runs
  // available the music should play through them and repeat only when genuinely
  // exhausted, not every 60 seconds.
  //
  // The earlier bug was real — a 7,000-second trajectory of which the first 60
  // was heard, so iterations 6 and 10 sounded identical — but bounding
  // GENERATION at `duration` entrenched the limitation instead of removing it.
  // The right fix is to generate plenty and let PLAYBACK run through it.
  //
  // So the only ceiling now is MAX_POINTS. At step_seconds 2.00 that is about
  // six hours before anything repeats; at 0.05, about ten minutes. Both are
  // "very infrequently" where 60 seconds was not.
  //
  // `duration` now governs the BAKE LENGTH only — see the stepper's note.
  const limit = Infinity;
  const pts = [];
  let t = 0;
  let used = 0, truncated = walk.truncated;
  let minC = 0, maxC = 0;
  for (const run of runs) {
    if (t >= limit) { truncated = true; break; }
    used++;
    if (!run.isHorizontal) { t += run.length * g.step_seconds * 0.5; continue; }
    if (pts.length >= MAX_POINTS) { truncated = true; break; }
    const yInt   = Math.round(run.y1);
    const octave = Math.floor(yInt / degrees.length);
    const degree = ((yInt % degrees.length) + degrees.length) % degrees.length;
    const cents  = (octave * 12 + degrees[degree]) * 100;
    if (cents < minC) minC = cents;
    if (cents > maxC) maxC = cents;
    pts.push({ time: t, detune: cents, runLength: run.length, maxRun: maxRun });
    t += run.length * g.step_seconds;
  }
  trajectory = pts;
  trajectoryInfo = {
    points: pts.length, truncated: truncated,
    span: Math.round((maxC - minC) / 100), length: t,
    runs: runs.length, used: used,
    iter: iter, iterReduced: iterReduced, skipSymbols: skipSymbols,
    skippedSegments: walk.skippedSegs, symbolsWalked: walk.symbols,
    // What the whole iteration WOULD be, for the sake of knowing how small a
    // window we are hearing. Arithmetic, so it costs nothing to ask.
    totalSymbols: totalSymbols,
    startAt: startAt, startRequested: startRequested,
    startClamped: startClamped, startLimit: startLimit,
  };
  return pts;
}

// grainSize for a point: the base stepper, pushed by how long the run is.
// grain_from_run 0 leaves grain size entirely to the stepper, which is how a
// script that has never heard of this parameter must behave.
function grainSizeFor(point, base, fromRun) {
  if (!fromRun) return base;
  // Normalised against the longest run this grammar actually produced, not a
  // constant — see the note in buildTrajectory.
  const n = Math.min(1, (point.runLength - 1) / Math.max(1, (point.maxRun || 1) - 1));
  return base * (1 - fromRun) + (base * (0.3 + 1.7 * n)) * fromRun;
}


// ── Audio ──────────────────────────────────────────────────────────────
// CHANNEL 2 (2026-10-01) — a second grain player reading the SAME trajectory
// at a different position, two octaves up. The offset is an INDEX, not a delay,
// which is bd_M_Fractal's meaning for offset2/offset3: at trajectory point k,
// channel 2 sounds point k + offsetCH2 at the same instant. So the two voices
// are not a canon — they are a chord the grammar harmonises with itself, and
// what you hear at any moment is two places in the same walk at once.
//
// offsetCH2 0 is still useful: the channels coincide and it becomes a plain
// octave doubling.
let grain = null, grain2 = null, ch2Gain = null;
let chorus = null, vibrato = null, reverb = null, limiter = null, fft = null;
let eq = null, panner = null, outVol = null;
let buffer = null, bufferReady = false;
// ── THE REVERB'S IMPULSE RESPONSE IS NOT THERE AT BOOT (2026-10-06) ────
// Tone.Reverb generates its impulse response asynchronously and the convolver
// holds NULL until that resolves — verified: immediately after `new
// Tone.Reverb(...)` the buffer is NULL, and buildChain() runs at boot, before
// any gesture.
//
// A convolver with no buffer outputs SILENCE. So `wet` is not a blend here,
// it is the share of the signal that DISAPPEARS: at this module's default of
// 0.90 that is 20 dB down, which on a phone speaker is "no sound". The other
// two music modules default to 0.35 and would only lose 3.7 dB — which is why
// this is the module the author's family could not hear.
//
// So the wet mix is HELD BACK until the impulse arrives, and restored when it
// does. If it never arrives the drone plays dry: degraded, never silent, which
// is the right way round for a failure nothing can detect from outside.
let reverbReady = false;
const REVERB_DRY_FALLBACK = 0.15;
let storedText = '';
let params = null;
let playing = false;
let loopTimer = null;
let rescheduleTimer = null;
let lastBake = null;

function buildChain() {
  // ── THE OUTPUT STAGE SITS LAST, AND THE ORDER IS THE DESIGN ──────────
  //   ... reverb -> EQ3 -> Panner -> Volume -> Limiter -> destination
  // EQ before the limiter, so a bass or treble BOOST is caught by the ceiling
  // rather than clipping; volume after the EQ, so the fader means what it says
  // whatever the tone controls are doing; limiter last, always, because it is
  // the only thing standing between grain summing and a clipped output.
  limiter = new Tone.Limiter(-1).toDestination();
  outVol  = new Tone.Volume(0).connect(limiter);
  panner  = new Tone.Panner(0).connect(outVol);
  // 250 Hz and 3 kHz rather than EQ3's defaults of 400 and 2500: "bass" that
  // starts at 400 Hz reaches well into the pads' fundamentals and acts as a
  // level control instead of a tone control.
  eq = new Tone.EQ3({ low: 0, mid: 0, high: 0,
                      lowFrequency: 250, highFrequency: 3000 }).connect(panner);
  // The analyser taps AFTER the output stage, so the display shows what you
  // actually hear — tone controls included — and before the final ceiling.
  fft = new Tone.FFT(64);
  outVol.connect(fft);
  reverb  = new Tone.Reverb({ decay: 4, wet: 0.45 }).connect(eq);
