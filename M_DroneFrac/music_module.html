  watchReverbReady();
  vibrato = new Tone.Vibrato({ frequency: 3, depth: 0.1, type: 'sine' }).connect(reverb);
  chorus  = new Tone.Chorus({ frequency: 1.5, delayTime: 3.5, depth: 0.4, wet: 0.3 }).connect(vibrato);
  chorus.start();
  // -5 dB, fixed. Two grain streams at equal level sum into the limiter and
  // flatten each other; the upper octave also sits forward of the lower by
  // ear, so matching their gains does not match their presence. One line from
  // being a stepper if it wants balancing.
  ch2Gain = new Tone.Gain(Math.pow(10, -5 / 20)).connect(chorus);
}

// Follow the impulse response in, and put the script's wet back when it lands.
// Tone 14's Reverb exposes `ready`; the guard is for any build that does not,
// where assuming it is ready is the harmless choice (the convolver will have a
// buffer or the module was already working).
function watchReverbReady() {
  if (!reverb) return;
  const p = reverb.ready;
  if (!p || typeof p.then !== 'function') { reverbReady = true; return; }
  reverbReady = false;
  p.then(() => {
    reverbReady = true;
    applyLiveParams();                 // restore the script's wet
    if (playing) setStatus('');        // clear the warning if it was shown
  }).catch(() => { /* leave it dry; audible beats correct */ });
}

function applyLiveParams() {
  // Guard the GRAIN lines only. Bailing out of the whole function when the
  // sample has not loaded yet left the effects tail sitting at buildChain's
  // defaults, so a script arriving with its own reverb and chorus values was
  // ignored until someone pressed a stepper.
  for (const g of [grain, grain2]) {
    if (!g) continue;
    g.overlap      = getStepperValue('overlap');
    g.playbackRate = getStepperValue('playback_rate');
    g.grainSize    = getStepperValue('grain_size');
  }
  if (reverb)  { const wantWet = getStepperValue('reverb_wet');
                 // Not a blend while the convolver is empty — see the note by
                 // reverbReady. Hold the wet share back so the dry path still
                 // carries the sound.
                 reverb.wet.value = reverbReady ? wantWet
                                                : Math.min(wantWet, REVERB_DRY_FALLBACK);
                 const d = getStepperValue('reverb_decay');
                 if (Math.abs(reverb.decay - d) > 0.01) {
                   reverb.decay = d;
                   clearTimeout(applyLiveParams._t);
                   // generate() rebuilds the impulse response and is
                   // expensive; debounced so holding the stepper does not
                   // rebuild it on every tick. It also REPLACES the buffer, so
                   // readiness goes back to false until the new one lands.
                   applyLiveParams._t = setTimeout(() => {
                     try { reverbReady = false; reverb.generate(); watchReverbReady(); } catch (_) {}
                   }, 150);
                 } }
  if (vibrato) { vibrato.frequency.value = getStepperValue('vibrato_frequency');
                 vibrato.depth.value     = getStepperValue('vibrato_depth'); }
  if (chorus)  { chorus.wet.value = getStepperValue('chorus_wet');
                 chorus.depth     = getStepperValue('chorus_depth'); }
  if (eq)      { eq.low.value  = getStepperValue('bass');
                 eq.high.value = getStepperValue('treble'); }
  if (panner)  { panner.pan.value = getStepperValue('balance'); }
  if (outVol)  { outVol.volume.value = getStepperValue('volume'); }
  // -60 dB is treated as silence outright rather than a very quiet signal, so
  // the stepper's bottom end is a real mute for diagnosis.
  if (ch2Gain) { const db = getStepperValue('ch2_level');
                 ch2Gain.gain.value = db <= -60 ? 0 : Math.pow(10, db / 20); }
}

async function loadSample(name) {
  const url = SAMPLES[name] || SAMPLES[DEFAULT_SAMPLE];
  bufferReady = false;
  updateControls();
  try {
    buffer = await new Tone.ToneAudioBuffer().load(url);
    if (grain)  { grain.dispose();  grain = null; }
    if (grain2) { grain2.dispose(); grain2 = null; }
    const opts = () => ({
      url: buffer, loop: true,
      grainSize: getStepperValue('grain_size'),
      overlap:   getStepperValue('overlap'),
      playbackRate: getStepperValue('playback_rate'),
    });
    grain  = new Tone.GrainPlayer(opts()).connect(chorus);
    grain2 = new Tone.GrainPlayer(opts()).connect(ch2Gain);
    bufferReady = true;
    const sel = document.getElementById('sample-select');
    if (sel && sel.value !== name) sel.value = name;
    applyLiveParams();
    setStatus('');
  } catch (err) {
    // A missing sample is the failure mode to be loud about. The sampler
    // modules taught this: four 404s made Tone.loaded() never resolve and
    // Play simply stayed disabled with no error anywhere, which reads as a
    // broken library. Say what is wrong.
    console.error('sample load failed', err);
    setStatus('sample ' + name + ' failed to load', true);
  }
  updateControls();
}

// ── Transport scheduling ───────────────────────────────────────────────
// GrainPlayer's detune and grainSize are PLAIN NUMBERS, not Signals, so the
// trajectory cannot be CONNECTED — it has to be written at times. Each write
// lands at the next grain, which is why the effective resolution is
// 1/grainSize and why nothing here tries to ramp.
// `read` supplies grain_size and grain_from_run AT FIRE TIME. Capturing them
// when the trajectory was scheduled made grain_size inert during playback:
// applyLiveParams set it on the press, and the very next trajectory point —
// at most one grain later — overwrote it with the value captured at Play.
// The stepper appeared to do nothing, which is the worst kind of wrong,
// because the control was there and responding and simply had no effect.
//
// Bake passes a FIXED reader instead, because an offline render must not
// depend on what someone does to the panel while it is rendering.
// TWO octaves up, not one. At +1200 the second channel sat inside the first's
// own harmonics and was hard to pick out as a separate voice at all — the
// upper octave of a pad is already present in the pad. +2400 clears that
// region and the two read as two.
// Replaced by the %%bd_p_ch2_cents control; kept only as the fallback for a
// script written before that control existed, so such a script still renders
// as it did.
const CH2_CENTS_DEFAULT = 2400;

function scheduleTrajectory(transport, pts, read) {
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    transport.scheduleOnce((/* time */) => {
      if (!grain) return;
      const v = read();
      grain.detune    = p.detune;
      grain.grainSize = grainSizeFor(p, v.base, v.fromRun);
      if (grain2) {
        // Clamp rather than wrap at the end: wrapping would jump channel 2
        // back to the opening while channel 1 is still finishing, which reads
        // as a mistake. Holding the last value lets the two converge.
        const j = Math.min(i + v.offset2, pts.length - 1);
        const q = pts[j];
        grain2.detune    = q.detune + (v.ch2 != null ? v.ch2 : CH2_CENTS_DEFAULT);
        grain2.grainSize = grainSizeFor(q, v.base, v.fromRun);
      }
    }, p.time);
  }
}

// The live reader: whatever the panel says at the moment the grain fires.
const liveGrainRead = () => ({
  base:    getStepperValue('grain_size'),
  fromRun: getStepperValue('grain_from_run'),
  offset2: Math.round(getStepperValue('offsetCH2')),
  ch2:     getStepperValue('ch2_cents'),
});

async function startPlayback() {
  if (!bufferReady || !grain) return;
  // ── iOS: ESCAPE THE RING/SILENT SWITCH (2026-10-06) ──────────────────
  // Reported from an iPhone 8: the spectrum showed signal at the bottom end —
  // so the samples had loaded, the graph was running and the drone was being
  // generated — and nothing came out of the speaker. That is not a loading
  // fault, and the spectrum is what rules loading out.
  //
  // iOS Safari gives a page that only uses Web Audio the **ambient** audio
  // session, and ambient audio is SILENCED BY THE HARDWARE SWITCH on the side
  // of the phone. Same page, same build, same everything: audible on a handset
  // with the switch up and silent on one with it down. Nothing in the page can
  // detect which, and nothing reports an error.
  //
  // `navigator.audioSession.type = 'playback'` says "this page is here to play
  // music, not to decorate", which moves it off the ambient category and out
  // from under the switch. Safari 16.4+ — an iPhone 8 reaches iOS 16.7, so it
  // is available there if the handset has been updated.
  //
  // Feature-detected and wrapped: on every browser without it this is a no-op,
  // and on those older iOS versions the switch still wins. Set INSIDE the
  // gesture, beside Tone.start(), because that is where the session is decided.
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
  } catch (_) {}
  await Tone.start();
  // Two things that produce "it looks like it is playing and I hear nothing",
  // both invisible from outside the page. Say them out loud.
  if (Tone.getContext().state !== 'running') {
    setStatus('audio is ' + Tone.getContext().state + ' — the browser has not released it', true);
  } else if (!reverbReady) {
    setStatus('reverb impulse not ready — playing drier until it arrives', true);
  }
  stopPlayback(true);
  // The trajectory's own length, not `duration`: the music plays to the end of
  // the material and only then repeats.
  const dur = (trajectoryInfo.length || getStepperValue('duration')) + 0.5;
  const t = Tone.getTransport();
  t.cancel(0);
  t.stop(); t.position = 0;
  scheduleTrajectory(t, trajectory, liveGrainRead);
  t.scheduleOnce(() => {
    if (getStepperValue('loop') >= 0.5) {
      // Reschedule WITHOUT stopping the grain. Tearing the player down and
      // restarting it leaves a gap, and a gap in a drone is a click — the one
      // artefact this whole module is arranged to avoid.
      loopTimer = setTimeout(() => { relaunchTrajectory(); }, 0);
    } else {
      stopPlayback();
    }
  }, dur);
  grain.start();
  if (grain2) grain2.start();
  t.start();
  playing = true;
  updateControls();
}

// The loop path: rewind and reschedule while the grain keeps sounding.
function relaunchTrajectory() {
  if (!playing || !grain) return;
  const t = Tone.getTransport();
  t.cancel(0); t.stop(); t.position = 0;
  scheduleTrajectory(t, trajectory, liveGrainRead);
  t.scheduleOnce(() => {
    if (getStepperValue('loop') >= 0.5) loopTimer = setTimeout(relaunchTrajectory, 0);
    else stopPlayback();
  }, (trajectoryInfo.length || getStepperValue('duration')) + 0.5);
  t.start();
}

function stopPlayback(quiet) {
  // The pending reschedule too: without this, a stepper moved a moment before
  // Stop would fire relaunchTrajectory() after it and start the transport
  // again. relaunchTrajectory guards on `playing`, but that is cleared BELOW,
  // so the race is real on the path where Stop arrives first.
  clearTimeout(rescheduleTimer); rescheduleTimer = null;
  clearTimeout(loopTimer); loopTimer = null;
  const t = Tone.getTransport();
  t.cancel(0); t.stop(); t.position = 0;
  for (const g of [grain, grain2]) { if (g) { try { g.stop(); } catch (_) {} } }
  playing = false;
  if (!quiet) updateControls();
}

function updateControls() {
  const ready = bufferReady && trajectory.length > 0;
  playBtn.disabled = !ready || playing;
  stopBtn.disabled = !playing;
  bakeBtn.disabled = !ready;
  saveWavBtn.disabled = !lastBake;
}

// ── Spectrum ───────────────────────────────────────────────────────────
// Tone.FFT is ANALYSIS ONLY — getValue() hands back magnitudes and there is
// no inverse, so nothing here can feed back into the sound. It is a display,
// and it earns its place because the effect of grain size and overlap is
// much easier to see than to hear at first.
function drawSpectrum() {
  requestAnimationFrame(drawSpectrum);
  if (!canvas || !fft) return;
  const r = canvas.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(r.width * dpr)) {
    canvas.width  = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
  }
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const vals = fft.getValue();
  const n = vals.length;
  const bw = w / n;
  for (let i = 0; i < n; i++) {
    // dB, roughly -100..0. Map to a bar height.
    const v = Math.max(0, Math.min(1, (vals[i] + 100) / 100));
    const bh = v * h;
    // Hue tracks the band so the display reads as a spectrum, but the BAR
    // HEIGHT carries the information — never hue alone.
    ctx.fillStyle = 'hsl(' + Math.round(170 + (i / n) * 120) + ', 55%, ' +
                    Math.round(25 + v * 45) + '%)';
    ctx.fillRect(i * bw, h - bh, Math.max(1, bw - 1), bh);
  }
}
requestAnimationFrame(drawSpectrum);

// ── Regenerate ─────────────────────────────────────────────────────────
function regenerate() {
  try {
    params = parseScript(storedText);
    buildTrajectory(params);
    // setStatus only DISPLAYS when the second argument is true, so this list
    // is "what is worth interrupting someone for" and nothing else.
    //
    // `truncated` was on it and had to come off: it means the walk found more
    // material than it took, which since the loop/duration decoupling is the
    // NORMAL case at every iteration from 6 up — so "trajectory capped at
    // 12000 points" sat there permanently, in error styling, describing the
    // module working exactly as intended. A warning that is always on is not a
    // warning, and it was about to drown the two real ones below.
    if (trajectoryInfo.points === 0) {
      setStatus('grammar produced no horizontal runs — nothing to play', true);
    } else if (trajectoryInfo.startClamped) {
      // Never silent: a control that quietly ignores what it was set to is
      // indistinguishable from one that does nothing.
      setStatus('start_at ' + (trajectoryInfo.startRequested / 1000).toFixed(1) +
                'k clamped to ' + (trajectoryInfo.startAt / 1000).toFixed(1) +
                'k — iteration ' + trajectoryInfo.iter + ' is only ' +
                trajectoryInfo.totalSymbols.toLocaleString() + ' symbols', true);
    } else if (trajectoryInfo.iterReduced) {
      setStatus('iterations reduced to ' + trajectoryInfo.iter +
                ' — the shared opening above that is too long to walk', true);
    } else {
      setStatus('');
    }
    updateControls();
    // ── A REBUILT TRAJECTORY MUST REACH A RUNNING TRANSPORT (2026-10-06) ──
    // scheduleTrajectory lays down EVERY event upfront with its pitch baked
    // in; only the grain parameters are read live, at grain-fire time. So
    // rebuilding `trajectory` while playing changed nothing audible — the
    // Transport went on firing the old schedule until the pass ended and the
    // loop timer called relaunchTrajectory().
    //
    // That was survivable while the pass was `duration`, 60 seconds: a stale
    // schedule corrected itself within a minute and nobody saw it. Decoupling
    // the loop from `duration` made the pass the trajectory's own length —
    // about 20 HOURS at the defaults — which turned a one-minute lag into a
    // permanent one. The symptom was the author's: Reset, and the drone goes
    // on playing the script you just replaced.
    //
    // relaunchTrajectory() returns immediately when not playing, so this is a
    // no-op at boot and on every regen with the transport stopped. It restarts
    // the walk from the beginning, which is right: when the trajectory changes
    // shape, a position part-way through the old one means nothing in the new.
    // The grain is never torn down, so there is no gap and no click.
    //
    // DEBOUNCED, because the steppers repeat on press-and-hold: rescheduling
    // 12,000 transport events on every tick would stutter the audio it is
    // meant to update. Same treatment as reverb.generate() above, which is
    // expensive for the same reason. 180 ms is below noticing and well above
    // the repeat interval.
    clearTimeout(rescheduleTimer);
    rescheduleTimer = setTimeout(() => { try { relaunchTrajectory(); } catch (_) {} }, 180);
  } catch (err) {
    console.error('regenerate failed', err);
    setStatus('grammar error: ' + err.message, true);
  }
}

function syncSteppersFromScript() {
  const g = parseScript(storedText);
  for (const s of STEPPERS) setStepperValue(s.name, g[s.name]);
  applyControlVisibility(g.marked);
  if (!grain || (params && params.sample !== g.sample)) loadSample(g.sample);
  applyLiveParams();
}

// ── Stepper presses ────────────────────────────────────────────────────
controlPanel.addEventListener('click', (e) => {
  const btn = e.target.closest('.step-btn');
  if (!btn || btn.disabled) return;
  const name  = btn.dataset.name;
  const delta = parseFloat(btn.dataset.delta);
  const s = STEPPERS.find((x) => x.name === name);
  if (!s) return;
  setStepperValue(name, getStepperValue(name) + delta * s.step);
  storedText = currentScript();
  // regenerate() rather than an inline copy of its body: that copy had drifted
  // (no status reporting, no reschedule), so a grammar error reached by a
  // stepper went unreported where the same error from a script was announced.
  if (s.regen) regenerate();
  applyLiveParams();
  // Announcing on a STEPPER PRESS is what makes the pull direction work, and
  // it cannot loop: a person has to press something. Announcing on
  // bd_script_update instead DOES loop — see the handler below.
  announce();
});

function announce() {
  postToParent({ type: 'bd_av_state', text: storedText, fromDrift: false });
}

// ── Sample selection ───────────────────────────────────────────────────
document.getElementById('sample-select').addEventListener('change', (e) => {
  const id = e.target.value;
  if (!SAMPLES[id]) return;
  // STOP FIRST. loadSample disposes the running GrainPlayer and builds a new
  // one, so without this the transport would go on firing trajectory events at
  // a player that was never started — silence, while the panel still showed
  // Stop armed and Play greyed out. Stopping hands it back in the state the
  // buttons are already describing: Play lit, Stop inactive, one press away.
  // Deliberately NOT auto-resuming: changing the source is a decision, and a
  // drone that restarts itself under you is harder to audition.
  stopPlayback();
  if (!params) params = parseScript(storedText);
  params.sample = id;
  storedText = currentScript();
  loadSample(id);
  announce();
});

// ── Buttons ────────────────────────────────────────────────────────────
playBtn.addEventListener('click', () => { startPlayback(); });
stopBtn.addEventListener('click', () => { stopPlayback(); setStatus(''); });

document.getElementById('copy-script-btn').addEventListener('click', async () => {
  const text = currentScript();
  try {
    // Hand the clipboard the write INSIDE the click: a gesture does not
    // survive an await, and Safari refuses what Chrome allows.
    await navigator.clipboard.writeText(text);
    setStatus('');
  } catch (_) {
    setStatus('copy failed — clipboard refused', true);
  }
});

bakeBtn.addEventListener('click', async () => {
  if (!buffer || !trajectory.length) return;
  bakeBtn.disabled = true;
  setStatus('');
  try {
    const dur     = getStepperValue('duration');
    const base    = getStepperValue('grain_size');
    const fromRun = getStepperValue('grain_from_run');
    const vals = {
      overlap: getStepperValue('overlap'), rate: getStepperValue('playback_rate'),
      rWet: getStepperValue('reverb_wet'), rDecay: getStepperValue('reverb_decay'),
      vFreq: getStepperValue('vibrato_frequency'), vDepth: getStepperValue('vibrato_depth'),
      cWet: getStepperValue('chorus_wet'), cDepth: getStepperValue('chorus_depth'),
      // Captured once, like the rest: a render must not change because
      // someone moved a stepper while it was rendering.
      offset2: Math.round(getStepperValue('offsetCH2')),
      ch2cents: getStepperValue('ch2_cents'), ch2level: getStepperValue('ch2_level'),
      volume: getStepperValue('volume'), bass: getStepperValue('bass'),
      treble: getStepperValue('treble'), balance: getStepperValue('balance'),
    };
    const tail = Math.max(vals.rDecay, 0.5) + 0.5;
    const rendered = await Tone.Offline(async (ctx) => {
      // The SAME output stage as the live chain, in the same order. Without it
      // Save wav would ignore volume, bass, treble and balance entirely, and
      // the file would not be the thing you balanced.
      const lim = new Tone.Limiter(-1).toDestination();
      const vol = new Tone.Volume(vals.volume).connect(lim);
      const pan = new Tone.Panner(vals.balance).connect(vol);
      const eq3 = new Tone.EQ3({ low: vals.bass, mid: 0, high: vals.treble,
                                 lowFrequency: 250, highFrequency: 3000 }).connect(pan);
      const rev = new Tone.Reverb({ decay: Math.max(0.1, vals.rDecay), wet: vals.rWet }).connect(eq3);
      await rev.ready;
      const vib = new Tone.Vibrato({ frequency: vals.vFreq, depth: vals.vDepth, type: 'sine' }).connect(rev);
      const cho = new Tone.Chorus({ frequency: 1.5, delayTime: 3.5, depth: vals.cDepth, wet: vals.cWet }).connect(vib);
      cho.start();
      const g2 = new Tone.Gain(vals.ch2level <= -60 ? 0 : Math.pow(10, vals.ch2level / 20)).connect(cho);
      const mk = (dest) => new Tone.GrainPlayer({
        url: buffer, loop: true, grainSize: base,
        overlap: vals.overlap, playbackRate: vals.rate,
      }).connect(dest);
      const gp  = mk(cho);
      const gp2 = mk(g2);
      // The offline context has its OWN transport — the live one is on a
      // different context and scheduling against it here renders silence.
      const t = ctx.transport;
      for (let i = 0; i < trajectory.length; i++) {
        const p = trajectory[i];
        if (p.time > dur) break;
        t.scheduleOnce(() => {
          gp.detune = p.detune;
          gp.grainSize = grainSizeFor(p, base, fromRun);
          const q = trajectory[Math.min(i + vals.offset2, trajectory.length - 1)];
          gp2.detune = q.detune + vals.ch2cents;
          gp2.grainSize = grainSizeFor(q, base, fromRun);
        }, p.time);
      }
      gp.start(0);
      gp2.start(0);
      t.start(0);
    }, dur + tail, 2, Tone.getContext().sampleRate);
    lastBake = rendered.get ? rendered.get() : rendered;
    setStatus('');
    saveWavBtn.disabled = false;
  } catch (err) {
    console.error('bake failed', err);
    setStatus('bake failed: ' + err.message, true);
  }
  bakeBtn.disabled = false;
});

saveWavBtn.addEventListener('click', () => {
  if (!lastBake) return;
  const wav = audioBufferToWav(lastBake);
  const blob = new Blob([wav], { type: 'audio/wav' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bd_M_DroneFrac.wav';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

function audioBufferToWav(b) {
  const numCh = b.numberOfChannels, sr = b.sampleRate, numSamp = b.length;
  const bps = 2, ba = numCh * bps, br = sr * ba, ds = numSamp * ba, bs = 44 + ds;
  const out = new Uint8Array(bs); const view = new DataView(out.buffer);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); view.setUint32(4, bs - 8, true); w(8, 'WAVE'); w(12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, numCh, true);
  view.setUint32(24, sr, true); view.setUint32(28, br, true); view.setUint16(32, ba, true);
  view.setUint16(34, 16, true); w(36, 'data'); view.setUint32(40, ds, true);
  const ch = []; for (let c = 0; c < numCh; c++) ch.push(b.getChannelData(c));
  let off = 44;
  for (let i = 0; i < numSamp; i++) {
    for (let c = 0; c < numCh; c++) {
      let s = Math.max(-1, Math.min(1, ch[c][i]));
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      off += 2;
    }
  }
  return out;
}

// ── The host contract ──────────────────────────────────────────────────
window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || typeof data.type !== 'string') return;
  try {
    const type = data.type;
    if (type === 'bd_script_update') {
      storedText = typeof data.script === 'string' ? data.script : '';
      syncSteppersFromScript();
      regenerate();
      // DELIBERATELY SILENT. Announcing here loops: the script is REBUILT
      // from the steppers, so what comes back is not identical to what went
      // in, the host's "already equal" guard never fires, and the two
      // lengths alternate for ever. Fractal was observed flooding at 421/430
      // chars and taking the graph down with it.
    } else if (type === 'bd_script_request') {
      postToParent({ type: 'bd_script_response', script: currentScript() });
    } else if (type === 'bd_ui_config') {
      // ── outputOnly (2026-10-08) — "show only your output" ───────────
      // The fourth flag and the strongest: the host is PRESENTING this
      // module, so none of its own furniture belongs on screen. BD's View
      // uses it and the collage will use the same one — which is the
      // point: View rehearses the collage's contract while there is only
      // one slot to get wrong.
      //
      // It IMPLIES hideControls and hostChrome:false rather than sitting
      // beside them. Each flag still asserts ONE thing; this one asserts
      // "only the output", which entails the others.
      const outputOnly = !!(data && data.outputOnly === true);
      document.body.classList.toggle('output-only', outputOnly);
      document.body.classList.toggle('controls-hidden',
        outputOnly || data.hideControls === true);
      // hostChrome: does the host draw anything AROUND this iframe? BD stamps
      // its arrows into the dock slot, so the grid reserves an area for it. A
      // standalone draws nothing. DEFAULTS TO TRUE, so a host that says
      // nothing keeps BD's behaviour and nothing working changes.
      document.body.classList.toggle('no-host-chrome',
        outputOnly || data.hideControls === true || data.hostChrome === false);
      // hostScriptPanel: does the host show the script with its own copy
      // control? Then this module's Copy Script is redundant. Defaults to
      // false — see the note beside .host-script-panel.
      document.body.classList.toggle('host-script-panel',
        data.hostScriptPanel === true);
      // ── compactControls (2026-10-10) ───────────────────────────────────
      // "Show your controls as a SHALLOW STRIP beside the transport." A fifth
      // flag, and it exists because outputOnly could not answer two different
      // questions: a presentation surface wants the transport ALONE, while a
      // collage PREVIEW is where the piece is built and wants the steppers
      // too — in a bar 52px deep, which no column can use.
      //
      // Only meaningful alongside outputOnly, and it does not imply it: a
      // module showing its whole interface has a column already and needs no
      // strip. Defaults to false, so a host that says nothing is unaffected.
      document.body.classList.toggle('strip-controls',
        outputOnly && data.compactControls === true);
      // ── overlay (2026-10-10) ───────────────────────────────────────────
      // "You are laid over another module: be transparent where you have
      // nothing to show." A sixth flag, and it asserts one thing like the
      // others. Independent of outputOnly: what an overlay SHOWS is still
      // decided by the flags above it.
      document.body.classList.toggle('overlay', data.overlay === true);
    } else if (type === 'bd_collage_layout') {
      // ── WHERE THE HOST WANTS THIS MODULE'S PANELS (2026-10-10) ─────────
      // Frame-relative pixels, measured by BD from the module underneath.
      // Applied as custom properties so the CSS above decides what to do with
      // them — a message that set `style.left` directly would be the host
      // doing this module's layout, which is the thing every other flag here
      // avoids.
      const b = event.data && event.data.bar;
      const r = document.documentElement.style;
      if (b && typeof b.left === 'number') {
        r.setProperty('--bd-bar-left',   Math.round(b.left) + 'px');
        r.setProperty('--bd-bar-top',    Math.round(b.top) + 'px');
        r.setProperty('--bd-bar-width',  Math.round(b.width) + 'px');
        r.setProperty('--bd-bar-height', Math.round(b.height) + 'px');
      }
    } else if (type === 'BD_STOP') {
      stopPlayback();
    }
    // BD_REQUEST_UPDATE is NOT handled, on purpose. It is a poll, and
    // answering a poll with an announce is what drove the card-rewrite loop
    // above. See the note in index.html's RELAY_DOWN.
  } catch (err) {
    console.error('music_module: postMessage error', err);
    setStatus('Message error: ' + err.message, true);
  }
});

// ── THE DEFAULT GRAMMAR, AND THE ONE IT REPLACED (2026-10-06) ──────────
// The rules below do NOT begin with their own non-terminal, and that is the
// point of them. The earlier ones did —
//
//   %%bd_rule X: XFYFX+F+YFXFY-F-XFYFX
//   %%bd_rule Y: YFXFY-F-XFYFX+F+YFXFY
//
// — and with a rule for X that BEGINS with X, expanding X to depth N starts by
// expanding X to depth N-1, so iteration N opens with the whole of iteration
// N-1. Measured: the first 300,000 symbols of iterations 6 and 7 were
// byte-identical. The entire skip mechanism exists to get past that, and
// without it `iterations` was inert for anything above 5.
//
// Cutting the one leading symbol from each rule turns the recursion into
// shared(N) = 2 + shared(N-2) rather than a ninefold multiplication. Measured
// at iteration 6:
//
//                          rules it replaced   DEFAULT NOW
//   shared opening         147,621 symbols     5 symbols
//   generation             28 ms               7 ms
//   runs available         60,000              63,161
//   run lengths            1, 2, 5 only        1 to 9
//   distinct pitches       9                   9  (the reflection wall sets this)
//   walk extent            566 x 242           229 x 229, and it crosses itself
//
// Paste the two lines above over the %%bd_rule lines below to go back.
//
// ONE SIDE EFFECT WORTH KNOWING. grain_from_run normalises against the longest
// run in the grammar, which is now 9 — but 98% of runs are still 1-5, so most
// notes land in the bottom half of the grain-size range where {1,2,5} spread
// across the whole of it. At the defaults below the effective grain size falls
// from a mean of 0.656 to 0.526, about 20% shorter. If that sounds thin, raise
// grain_size from 0.61 to about 0.76 to restore the old mean; the control is
// less potent, not broken. The better fix is to normalise against a high
// PERCENTILE rather than the maximum, which is not done.
//
// The curve crossing itself matters to nothing here; this module never plots
// it. It would matter if the grammar were shared with a visual module, and
// M_Fractal is the only other place these rules appear — and M_Fractal still
// carries both the old rules and the old skip mechanism.

// ── Boot ───────────────────────────────────────────────────────────────
buildChain();
storedText = [
  '%%bd_module bd_M_DroneFrac',
  '%%bd_p_sample synth_pad_a2',
  '%%bd_axiom X',
  '%%bd_rule X: FYFX+F+YFXFY-F-XFYFX',
  '%%bd_rule Y: FXFY-F-XFYFX+F+YFXFY',
  '%%bd_angle 90',
  '%%bd_p_iterations 6',
  '%%bd_p_start_at 0.0',
  '%%bd_p_step_seconds 2.00',
  '%%bd_p_detune_span 10',
  '%%bd_p_scale min_pentatonic',
  '%%bd_p_grain_size 0.61',
  '%%bd_p_grain_from_run 0.50',
  '%%bd_p_offsetCH2 100',
  '%%bd_p_ch2_level -10',
  '%%bd_p_ch2_cents 1700',
  '%%bd_p_overlap 0.44',
  '%%bd_p_playback_rate 1.00',
  '%%bd_p_duration 60',
  '%%bd_p_reverb_wet 0.90',
  '%%bd_p_reverb_decay 4.00',
  '%%bd_p_vibrato_frequency 3.00',
  '%%bd_p_vibrato_depth 0.10',
  '%%bd_p_chorus_wet 0.50',
  '%%bd_p_chorus_depth 0.65',
  '%%bd_p_loop true',
  '%%bd_p_volume 0.00',
  '%%bd_p_bass 0.00',
  '%%bd_p_treble 0.00',
  '%%bd_p_balance 0.00',
  '',
].join('\n');
params = parseScript(storedText);
buildSampleSelect();
// Fetch the real list, then re-sync: syncSteppersFromScript decides which
// sample to load, so it must run AFTER the manifest has replaced the fallback
// or a script naming a sample only the manifest knows about would be ignored.
loadManifest().then(() => { syncSteppersFromScript(); regenerate(); });
syncSteppersFromScript();
regenerate();
// Only now: every listener is attached, so nothing the host sends can arrive
// unheard.
postToParent({ type: 'BD_READY' });
</script>
</body>
